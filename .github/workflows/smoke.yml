name: E2E Smoke

# RETIRED 2026-07-23: this suite targets the apps/web frontend, frozen 2026-05-30.
# Active frontend development moved to the standalone parliament-pulse repo
# (03_Projects/parliament-pulse), which ships its own release-gate + production-probe.
# This smoke asserted apps/web's UI against production and failed wholesale because
# production serves the other build. Manual-dispatch only until repointed or removed.

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Playwright smoke against parliament-pulse.pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Wait 60s for Pages to redeploy
        run: sleep 60

      - name: Run smoke
        run: pnpm --filter e2e test
        env:
          BASE_URL: https://parliament-pulse.pages.dev
