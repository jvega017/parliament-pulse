name: Deploy web

# RETIRED 2026-07-23: apps/web was frozen 2026-05-30 and is no longer the deployed
# frontend (active development moved to the standalone parliament-pulse repo). This
# would publish the stale apps/web (which still carries pre-sweep fabrications in
# src/store/Modals.tsx) over the live site. Manual-dispatch only until repointed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://parliament-pulse.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Publish to Cloudflare Pages
        working-directory: workers/aph-proxy
        run: pnpm exec wrangler pages deploy ../../apps/web/dist --project-name=parliament-pulse --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
