name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web retired 2026-07-23 (frozen 2026-05-30, build broken: main.tsx
      # cannot resolve ./App; active frontend is the standalone parliament-pulse
      # repo). CI is scoped to the canonical worker; the dead web build is removed.
      # No lint step: the worker had only an `echo 'no lint configured'`
      # placeholder, which reported a pass for code nobody linted. Removed
      # 29 Sep 2026 (ARCH-04) rather than kept as a false green. tsc strict
      # typecheck and the unit tests below are the real gates. Add ESLint
      # with a config before reintroducing a lint step.
      - name: Typecheck (worker)
        run: pnpm --filter aph-proxy typecheck

      - name: Unit tests (worker)
        run: pnpm --filter aph-proxy test

      - name: Worker dry-run deploy
        run: pnpm --filter aph-proxy exec wrangler deploy --dry-run --outdir=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
