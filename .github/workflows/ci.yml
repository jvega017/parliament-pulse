name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web retired 2026-07-23 (frozen 2026-05-30, build broken: main.tsx
      # cannot resolve ./App; active frontend is the standalone parliament-pulse
      # repo). CI is scoped to the canonical worker; the dead web build is removed.
      - name: Lint (worker)
        run: pnpm --filter aph-proxy lint

      - name: Typecheck (worker)
        run: pnpm --filter aph-proxy typecheck

      - name: Worker dry-run deploy
        run: pnpm --filter aph-proxy exec wrangler deploy --dry-run --outdir=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
