name: Deploy worker

# Gated on CI (ARCH-04, 29 Sep 2026). This workflow no longer triggers on push:
# it runs only when the "CI" workflow completes, and the deploy job runs only
# when that CI run succeeded, was a push (not a pull request) and was on main.
# A failed, cancelled or PR CI run cannot deploy. The checkout pins the exact
# commit CI tested (workflow_run.head_sha), never whatever main is by then.
# There is deliberately no workflow_dispatch trigger: a manual run would
# bypass the CI gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-worker-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy aph-proxy to Cloudflare Workers
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/aph-proxy
          command: deploy
