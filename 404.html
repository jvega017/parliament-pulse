<!doctype html>
<!-- register: b -->
<!-- Cloudflare Pages serves this file, with status 404, for any path that is not
     a real file (/.env, /.git/config, a mistyped address). It replaces the SPA
     fallback, which answered every unknown path with index.html and status 200.
     The app routes by hash (#/signals), so no app address depends on that
     fallback. No scripts; the colours are the brand-tokens.json values that
     index.html uses (dark by default, the light paper theme when the reader's
     system asks for it). Shipped by scripts/build-dist.mjs (DIST_FILES). -->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Parliament Pulse</title>
<style>
  :root {
    --bg: #06070d;
    --ink: #f5f0e1;
    --ink-2: #d8d4c5;
    --ink-3: #a0a4b4;
    --line: #1c1e2a;
    --link: #d9b779;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f1ece0;
      --ink: #1b1812;
      --ink-2: #433e35;
      --ink-3: #5c5547;
      --line: #d7cfbe;
      --link: #7c2e18;
    }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 16px; text-align: center; }
  .kicker { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 0.75rem; }
  h1 { font-family: "IBM Plex Serif", Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); }
  p { color: var(--ink-2); line-height: 1.55; margin: 0 0 1rem; }
  a { color: var(--link); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Parliament Pulse · 404</p>
  <h1>Page not found</h1>
  <p>This address is not part of Parliament Pulse.</p>
  <p><a href="/">Return to Parliament Pulse</a></p>
</main>
</body>
</html>
