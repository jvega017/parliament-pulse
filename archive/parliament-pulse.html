<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Parliament Pulse — Prometheus Policy Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Parliament Pulse — restrained institutional palette */
    /* One ink, one elevation, two accents. Everything else is a tint of those. */

    --bg:           #0a1017;
    --bg-2:         #0e1620;
    --panel:        #141d28;
    --panel-2:      #1a2431;
    --panel-hi:     #22304260;
    --line:         #ffffff08;
    --line-2:       #ffffff12;
    --line-bright:  #ffffff20;

    --ink:          #eef0ea;
    --ink-2:        #c2cad4;
    --ink-3:        #8794a5;
    --ink-4:        #5a6778;

    /* PRIMARY ACCENT — Prometheus ember. Used for brand, priority, live signals. */
    --brass:        #e09359;
    --brass-2:      #f0ab75;
    --brass-soft:   #8a5430;
    --brass-ink:    #1a0e05;

    /* SECONDARY ACCENT — verified/connected/healthy data. */
    --teal:         #4eaea2;
    --teal-soft:    #2e7068;

    /* Functional status (used sparingly, only where required) */
    --info:         #7ba0d4;
    --caution:      #d9a94a;
    --escalate:     #d06a5e;
    --ok:           #6fb085;

    --r-sm: 4px;
    --r:    8px;
    --r-lg: 14px;

    --shadow: 0 1px 0 #00000050, 0 24px 60px -24px #00000080;

    --sans: "Inter", system-ui, sans-serif;
    --serif: "Fraunces", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:
      radial-gradient(1600px 900px at 10% -5%, #14202e 0%, transparent 50%),
      radial-gradient(1000px 700px at 95% 110%, #1d1712 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    font-feature-settings: "cv11", "ss01";
    letter-spacing: -0.005em;
  }

  .mono { font-family: var(--mono); font-feature-settings: "tnum"; letter-spacing: .01em; }
  .serif { font-family: var(--serif); }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .side {
    background: linear-gradient(180deg, #101925 0%, #0c141d 100%);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: radial-gradient(circle at 35% 30%, #2a1f14 0%, #0d0806 80%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px #d4894a30, 0 0 20px -6px #d4894a50;
  }
  .brand-name { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; font-variation-settings: "opsz" 144; }
  .brand-sub  { font-family: var(--mono); color: var(--ink-4); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; margin-top: 2px; }

  .nav {
    padding: 10px 8px;
    overflow-y: auto;
    flex: 1;
  }
  .nav-group {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: .16em; color: var(--ink-4);
    padding: 14px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    color: var(--ink-2); cursor: pointer;
    font-size: 13px;
    user-select: none;
    position: relative;
  }
  .nav-item:hover { background: #ffffff06; color: var(--ink); }
  .nav-item.active {
    background: linear-gradient(90deg, #c9a36a18, #c9a36a04);
    color: var(--ink);
  }
  .nav-item.active::before{
    content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
    background: var(--brass); border-radius: 0 2px 2px 0;
  }
  .nav-item .ico { width:16px; height:16px; opacity:.85; flex:none; }
  .nav-item .count {
    margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4);
    background: #ffffff0a; padding: 1px 6px; border-radius: 10px;
  }
  .nav-item.active .count { color: var(--brass); background: #c9a36a14; }

  .side-foot {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #2a7570, #3fa39a);
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 11px; color: #0e1620; font-weight: 600;
  }

  /* ---------- Top bar ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: #0e1620cc;
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .search {
    flex: 1; max-width: 560px;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .search input {
    background: transparent; border: 0; outline: 0;
    color: var(--ink); font-family: var(--sans); font-size: 13px; width: 100%;
  }
  .kbd {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 4px;
    background: #ffffff04;
  }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .chip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line-2); color: var(--ink-3); background: #ffffff03;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #6aa57a22; }
  .chip.warn .dot { background: var(--caution); box-shadow: 0 0 0 3px #d4a24a22;}
  .chip.bad .dot { background: var(--escalate); box-shadow: 0 0 0 3px #c2686522;}
  .btn {
    font-family: var(--sans); font-size: 12.5px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--panel-2); color: var(--ink); }
  .btn.primary {
    background: linear-gradient(180deg, #d7b079, #b28a4f);
    color: var(--brass-ink); border: 1px solid #8f7648;
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  /* ---------- Content ---------- */
  .content {
    padding: 24px;
    max-width: 1500px;
    width: 100%;
  }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px; gap: 24px;
  }
  .page-title {
    font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: -.01em; margin: 0;
  }
  .page-kicker {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 6px;
  }
  .page-sub { color: var(--ink-3); font-size: 13.5px; margin-top: 6px; max-width: 620px; }

  .grid { display: grid; gap: 16px; }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-overview { grid-template-columns: 2fr 1fr; }

  /* ---------- Panel ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line-2);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
  }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title { font-weight: 500; font-size: 13.5px; margin: 0; color: var(--ink); letter-spacing: .01em; }
  .panel-kicker { font-family: var(--mono); font-size: 10px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .16em; }
  .panel-body { padding: 14px 16px; }
  .panel-foot { padding: 10px 16px; border-top: 1px solid var(--line); display:flex; align-items:center; gap:10px; }

  /* ---------- Stat block ---------- */
  .stat {
    padding: 16px;
  }
  .stat-label { font-family: var(--mono); font-size: 10px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .16em; }
  .stat-value { font-family: var(--serif); font-size: 34px; font-weight: 500; margin-top: 4px; letter-spacing: -.01em; }
  .stat-value .unit { font-size: 14px; color: var(--ink-3); margin-left: 6px; font-family: var(--mono); }
  .stat-meta { margin-top: 6px; font-size: 12px; color: var(--ink-3); display:flex; align-items:center; gap: 8px; }

  /* ---------- Signal Card ---------- */
  .signal {
    border: 1px solid var(--line-2);
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, #1a2432 0%, #18222f 100%);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    position: relative;
  }
  .signal:hover { border-color: var(--line-bright); }
  .signal + .signal { margin-top: 10px; }

  .sig-head { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .sig-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .05em; }
  .sig-source { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .sig-time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); margin-left: auto; }

  .sig-title {
    font-family: var(--serif); font-size: 17px; font-weight: 500; line-height: 1.3;
    color: var(--ink); margin: 2px 0 6px;
  }
  .sig-sum { color: var(--ink-2); font-size: 13px; }

  .sig-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-family: var(--mono); font-size: 10.5px;
    padding: 3px 8px; border-radius: 4px;
    background: #ffffff06; border: 1px solid var(--line-2); color: var(--ink-3);
    text-transform: none;
  }
  .tag.brass { color: var(--brass); border-color: #c9a36a33; background: #c9a36a0f; }
  .tag.teal  { color: var(--teal);  border-color: #3fa39a33; background: #3fa39a0f; }
  .tag.amber { color: var(--caution); border-color: #d4a24a33; background: #d4a24a0f; }
  .tag.red   { color: var(--escalate); border-color: #c2686533; background: #c268650f; }
  .tag.info  { color: var(--info); border-color: #6b8ec933; background: #6b8ec90f; }

  .sig-action {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-2);
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center;
  }
  .sig-action-label {
    font-family: var(--mono); font-size: 10px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .16em;
  }
  .sig-action-value { font-size: 13px; color: var(--ink); font-weight: 500; }
  .sig-action-reason { grid-column: 1 / -1; color: var(--ink-3); font-size: 12.5px; font-style: italic; }

  /* attention pill */
  .att {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em;
    padding: 3px 8px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .att::before { content:""; width:6px; height:6px; border-radius:50%; }
  .att.high { color: var(--escalate); background: #c268651a; border: 1px solid #c2686540; }
  .att.high::before { background: var(--escalate); }
  .att.med { color: var(--caution); background: #d4a24a1a; border: 1px solid #d4a24a40; }
  .att.med::before { background: var(--caution); }
  .att.low { color: var(--info); background: #6b8ec91a; border: 1px solid #6b8ec940; }
  .att.low::before { background: var(--info); }

  /* confidence bar */
  .conf {
    display: inline-flex; align-items: center; gap: 2px;
  }
  .conf span { width: 6px; height: 10px; background: var(--line-2); border-radius: 1px; }
  .conf span.on { background: var(--brass); }

  /* ---------- Table ---------- */
  table.ds { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ds th, table.ds td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  table.ds th {
    font-family: var(--mono); font-size: 10px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .16em; font-weight: 500;
    background: #ffffff03;
  }
  table.ds tbody tr { cursor: pointer; }
  table.ds tbody tr:hover { background: #ffffff04; }
  table.ds td.num { text-align: right; font-family: var(--mono); }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before {
    content:""; position:absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line-2);
  }
  .tl-item { position: relative; padding: 4px 0 12px; }
  .tl-item::before {
    content:""; position:absolute; left: -18px; top: 8px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--brass);
  }
  .tl-item.teal::before { border-color: var(--teal); }
  .tl-item.info::before { border-color: var(--info); }
  .tl-time { font-family: var(--mono); font-size: 10px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .14em; }
  .tl-body { color: var(--ink-2); font-size: 13px; margin-top: 2px; }

  /* ---------- Drawer ---------- */
  .drawer-back {
    position: fixed; inset: 0; background: #000000a0; backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40;
  }
  .drawer-back.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 580px; max-width: 95vw;
    background: linear-gradient(180deg, #131c28, #0f1721);
    border-left: 1px solid var(--line-2);
    transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.2,1);
    z-index: 50; display: flex; flex-direction: column;
    box-shadow: -20px 0 60px #00000060;
  }
  .drawer.on { transform: translateX(0); }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: #0c141d; }

  .drawer-section { margin-bottom: 22px; }
  .drawer-section h4 {
    font-family: var(--mono); font-size: 10px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .16em; margin: 0 0 8px;
  }
  .drawer-section p { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .1em; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--ink); }

  .feedback-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .fb {
    font-family: var(--sans); font-size: 12px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-2); background: #ffffff04; color: var(--ink-2);
  }
  .fb:hover { background: #ffffff0a; color: var(--ink); }
  .fb.on { background: #c9a36a14; border-color: #c9a36a55; color: var(--brass); }

  /* ---------- Radar ---------- */
  .radar-row { display: grid; grid-template-columns: 1fr 80px 100px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .radar-row:last-child { border-bottom: 0; }
  .bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .bar .fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--brass)); }
  .spark { display: flex; gap: 2px; align-items: end; height: 22px; }
  .spark span { width: 5px; background: var(--teal-soft); border-radius: 1px; }

  /* ---------- Pattern card ---------- */
  .pattern {
    border: 1px solid #c9a36a44;
    background:
      radial-gradient(400px 120px at 0% 0%, #c9a36a14, transparent),
      linear-gradient(180deg, #1b2433, #16202e);
    border-radius: var(--r-lg);
    padding: 16px 18px;
    position: relative;
  }
  .pattern .ribbon {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--brass); background: #c9a36a14; border: 1px solid #c9a36a55;
    padding: 3px 8px; border-radius: 4px;
  }

  /* ---------- Watchlist chip ---------- */
  .wl {
    border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 14px; background: #ffffff03;
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer;
  }
  .wl:hover { border-color: var(--line-bright); }
  .wl-name { font-weight: 500; font-size: 13.5px; }
  .wl-meta { font-size: 11.5px; color: var(--ink-3); display:flex; gap: 10px; font-family: var(--mono); }

  /* Progress ring placeholder */
  .ring {
    width: 40px; height: 40px; border-radius: 50%;
    background: conic-gradient(var(--brass) calc(var(--p,70)*1%), var(--line-2) 0);
    display: grid; place-items: center;
  }
  .ring::after {
    content: attr(data-p)"%"; color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel); display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px;
  }

  /* ---------- Brief preview ---------- */
  .brief {
    background: #f4efe4; color: #1a1208;
    border-radius: 10px; padding: 18px 20px;
    font-family: var(--serif); font-size: 13.5px; line-height: 1.55;
    box-shadow: inset 0 0 0 1px #00000014;
  }
  .brief h5 { margin: 12px 0 4px; font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: #7a5a22; }
  .brief h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .brief .meta { font-family: var(--mono); font-size: 10.5px; color: #7a5a22; }
  .brief ul { margin: 4px 0 0; padding-left: 18px; }

  /* source health dot */
  .hdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align: middle; }
  .hdot.live { background: var(--ok); }
  .hdot.delayed { background: var(--caution); }
  .hdot.broken { background: var(--escalate); }
  .hdot.stale  { background: var(--ink-4); }
  .hdot.review { background: var(--info); }

  /* inline SVG icons */
  .ico { display: inline-block; vertical-align: middle; }

  /* Fade page switches */
  .page { animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

  /* Modal-ish tester */
  .feed-test {
    background: #0c141d; border: 1px solid var(--line-2); border-radius: 10px;
    padding: 14px; font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  }
  .feed-test .ok { color: var(--ok); }
  .feed-test .warn { color: var(--caution); }
  .feed-test .err { color: var(--escalate); }

  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

  .empty { color: var(--ink-4); font-style: italic; font-size: 13px; padding: 12px 0; }

  /* Responsive ish */
  @media (max-width: 1100px) {
    .g-4 { grid-template-columns: repeat(2, 1fr); }
    .g-overview { grid-template-columns: 1fr; }
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .g-2, .g-3 { grid-template-columns: 1fr; }
  }

  /* ---- Modal ---- */
  .modal-back {
    position: fixed; inset: 0; background: #000000b0; backdrop-filter: blur(3px);
    z-index: 60; display: grid; place-items: center; padding: 40px;
    animation: fadeIn .15s ease;
  }
  .modal {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line-2); border-radius: 14px;
    width: 100%; max-width: 860px; max-height: 86vh;

<script type="text/babel" data-module="store.jsx">
// ---- Global store: persistent state for real interactivity ----
const StoreCtx = React.createContext(null);

function useStore() { return React.useContext(StoreCtx); }

function StoreProvider({ children }) {
  // Owners assigned to signals/bills, feedback given, watchlist additions, toasts
  const [state, setState] = React.useState(() => {
    try {
      const raw = localStorage.getItem("cs-state-v1");
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return {
      owners: {}, // { entityId: ownerName }
      feedback: {}, // { signalId: { label, reason, ts } }
      archived: {}, // { signalId: true }
      briefsGenerated: {}, // { signalId: { ts, type } }
      watchlistAdds: {}, // { entityKey: true }
      watchlistCreated: [], // extra watchlists
      feeds: [], // extra custom feeds
      notes: {}, // { signalId: "text" }
    };
  });

  React.useEffect(() => {
    try { localStorage.setItem("cs-state-v1", JSON.stringify(state)); } catch(e){}
  }, [state]);

  const [toasts, setToasts] = React.useState([]);
  const toast = (msg, kind = "ok") => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2800);
  };

  const [modal, setModal] = React.useState(null); // { type, id }
  const openModal = (type, id) => setModal({ type, id });
  const closeModal = () => setModal(null);

  const [signalId, setSignalId] = React.useState(null);
  const openSignal = s => setSignalId(typeof s === "string" ? s : s?.id);
  const closeSignal = () => setSignalId(null);

  // Expose for places that don't live inside the provider context
  React.useEffect(() => {
    window.__openModal = (kind, data) => setModal({ kind, data });
    window.__openSignal = (id) => setSignalId(id);
  }, []);

  const assignOwner = (entityId, owner) => {
    setState(s => ({ ...s, owners: { ...s.owners, [entityId]: owner } }));
    toast(`Assigned ${owner} as policy owner`);
  };
  const saveFeedback = (signalId, label, reason) => {
    setState(s => ({ ...s, feedback: { ...s.feedback, [signalId]: { label, reason, ts: Date.now() } } }));
    toast(`Feedback logged: ${label}`, "brass");
  };
  const archive = (signalId) => {
    setState(s => ({ ...s, archived: { ...s.archived, [signalId]: true } }));
    toast("Signal archived");
  };
  const unarchive = (signalId) => {
    setState(s => { const n = { ...s.archived }; delete n[signalId]; return { ...s, archived: n }; });
  };
  const addWatchlist = (key) => {
    setState(s => ({ ...s, watchlistAdds: { ...s.watchlistAdds, [key]: true } }));
    toast("Added to watchlist", "brass");
  };
  const createWatchlist = (name) => {
    setState(s => ({ ...s, watchlistCreated: [...s.watchlistCreated, { name, keywords: 0, matches: 0, trend: [0,0,0,0,0,0,0] }] }));
    toast(`Watchlist "${name}" created`, "brass");
  };
  const generateBrief = (signalId, type) => {
    setState(s => ({ ...s, briefsGenerated: { ...s.briefsGenerated, [signalId]: { ts: Date.now(), type } } }));
    toast(`${type} generated`, "brass");
  };
  const addFeed = (feed) => {
    setState(s => ({ ...s, feeds: [...s.feeds, feed] }));
    toast(`Feed added: ${feed.name}`, "brass");
  };
  const saveNote = (signalId, text) => {
    setState(s => ({ ...s, notes: { ...s.notes, [signalId]: text } }));
  };

  return (
    <StoreCtx.Provider value={{
      state, setState, toast, toasts,
      modal, openModal, closeModal,
      signalId, openSignal, closeSignal,
      assignOwner, saveFeedback, archive, unarchive,
      addWatchlist, createWatchlist, generateBrief, addFeed, saveNote,
    }}>
      {children}
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className="toast">
            <Icon name="check" size={14} stroke={t.kind === "brass" ? "var(--brass)" : "var(--ok)"} />
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </StoreCtx.Provider>
  );
}

// ---- Detail Modal: renders per entity type ----
function DetailModal() {
  const { modal, closeModal, openModal, state, assignOwner, addWatchlist, openSignal } = useStore();
  if (!modal) return null;
  const { type, id } = modal;

  const render = () => {
    if (type === "committee") return <CommitteeDetail id={id} />;
    if (type === "bill") return <BillDetail id={id} />;
    if (type === "member") return <MemberDetail id={id} />;
    if (type === "minister") return <MinisterDetail id={id} />;
    if (type === "division") return <DivisionDetail id={id} />;
    if (type === "feed") return <FeedDetail id={id} />;
    if (type === "watchlist") return <WatchlistDetail id={id} />;
    if (type === "radar") return <RadarDetail id={id} />;
    if (type === "inquiry") return <InquiryDetail id={id} />;
    if (type === "hearing") return <HearingDetail data={id} />;
    return <div>Unknown</div>;
  };

  return (
    <div className="modal-back" onClick={closeModal}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        {render()}
      </div>
    </div>
  );
}

function ModalHead({ kicker, title, right, onClose }) {
  const { closeModal } = useStore();
  return (
    <div className="modal-head">
      <div style={{flex:1}}>
        <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em"}}>{kicker}</div>
        <div className="serif" style={{fontSize:22, marginTop:4, fontWeight:500, lineHeight:1.25}}>{title}</div>
      </div>
      {right}
      <button className="btn ghost sm" onClick={onClose || closeModal} style={{flex:"none"}}><Icon name="close" size={14}/></button>
    </div>
  );
}

function CommitteeDetail({ id }) {
  const c = ENTITIES.committees[id];
  const { openModal, closeModal, toast } = useStore();
  if (!c) return <ModalHead kicker="Committee" title="Not found" />;
  return (
    <>
      <ModalHead kicker={`Committee · ${c.chamber}`} title={c.name} />
      <div className="modal-body">
        <p style={{color:"var(--ink-2)", marginTop:0}}>{c.bio}</p>
        <dl className="kv" style={{marginTop:14}}>
          <dt>Chair</dt><dd>{c.chair}</dd>
          <dt>Members</dt><dd>{c.members}</dd>
          <dt>Portfolio</dt><dd>{c.portfolio}</dd>
          <dt>Active inquiries</dt><dd>{c.active}</dd>
          <dt>Reports (30d)</dt><dd>{c.recentReports}</dd>
          <dt>Source</dt><dd className="mono" style={{fontSize:11, color:"var(--ink-3)"}}>{c.url}</dd>
        </dl>

        <h4 className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em", marginTop:22, marginBottom:8}}>Upcoming & today's hearings</h4>

function Topbar({ setPage }) {
  const { openModal, openSignal, toast } = useStore();
  const [q, setQ] = React.useState("");
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const h = (e) => {
      if (e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ref.current?.focus(); }
      if (e.key === "Escape") { setOpen(false); ref.current?.blur(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const results = React.useMemo(() => {
    if (!q.trim()) return null;
    const term = q.toLowerCase();
    const sig = SIGNALS.filter(s =>
      s.title.toLowerCase().includes(term) || s.summary.toLowerCase().includes(term) || s.id.toLowerCase().includes(term));
    const bills = Object.values(ENTITIES.bills).filter(b => b.title.toLowerCase().includes(term) || b.ref.toLowerCase().includes(term));
    const comm = Object.values(ENTITIES.committees).filter(c => c.name.toLowerCase().includes(term));
    const mem = Object.values(ENTITIES.members).filter(m => m.name.toLowerCase().includes(term));
    const feeds = APH_FEEDS.filter(f => f.name.toLowerCase().includes(term));
    return { sig, bills, comm, mem, feeds };
  }, [q]);

  return (
    <div className="topbar">
      <div className="search" onClick={() => setOpen(true)}>
        <Icon name="search" size={14} stroke="var(--ink-3)" />
        <input ref={ref} value={q} onChange={e => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onBlur={() => setTimeout(() => setOpen(false), 200)}
          placeholder="Search signals, bills, committees, members, feeds…" />
        <span className="kbd">⌘K</span>
        {open && results && (
          <div className="search-results" onMouseDown={e=>e.preventDefault()}>
            {results.sig.length > 0 && <>
              <div className="sr-group">Signals</div>
              {results.sig.slice(0,4).map(s => (
                <div key={s.id} className="sr-item" onClick={() => { openSignal(s.id); setOpen(false); }}>
                  <span className="k">{s.id}</span><span>{s.title}</span>
                </div>
              ))}
            </>}
            {results.bills.length > 0 && <>
              <div className="sr-group">Bills</div>
              {results.bills.map(b => (
                <div key={b.ref} className="sr-item" onClick={() => { openModal("bill", b.ref); setOpen(false); }}>
                  <span className="k">{b.ref}</span><span>{b.title}</span>
                </div>
              ))}
            </>}
            {results.comm.length > 0 && <>
              <div className="sr-group">Committees</div>
              {results.comm.map(c => (
                <div key={c.id} className="sr-item" onClick={() => { openModal("committee", c.id); setOpen(false); }}>
                  <span className="k">{c.chamber}</span><span>{c.name}</span>
                </div>
              ))}
            </>}
            {results.mem.length > 0 && <>
              <div className="sr-group">Members</div>
              {results.mem.map(m => (
                <div key={m.id} className="sr-item" onClick={() => { openModal("member", m.id); setOpen(false); }}>
                  <span className="k">{m.party}</span><span>{m.name}</span>
                </div>
              ))}
            </>}
            {results.feeds.length > 0 && <>
              <div className="sr-group">Sources</div>
              {results.feeds.slice(0,4).map(f => (
                <div key={f.id} className="sr-item" onClick={() => { openModal("feed", f.id); setOpen(false); }}>
                  <span className="k">{f.group}</span><span>{f.name}</span>
                </div>
              ))}
            </>}
            {q && !results.sig.length && !results.bills.length && !results.comm.length && !results.mem.length && !results.feeds.length && (
              <div className="sr-item" style={{color:"var(--ink-4)", cursor:"default"}}>No matches for "{q}"</div>
            )}
          </div>
        )}
      </div>
      <div className="top-right">
        <span className="chip clk" onClick={() => setPage("live")} style={{borderColor:"#c26865", color:"#fff", background:"#c268651a"}}>

        </span>
        <span className="chip"><span className="dot" /> 14/15 sources</span>
        <button className="btn ghost sm" title="Refresh all feeds" onClick={() => toast("Feeds refreshed")}><Icon name="refresh" size={13} /> Refresh</button>
        <button className="btn sm" onClick={() => toast("3 new alerts")}><Icon name="bell" size={13} /> Alerts</button>
        <button className="btn primary sm" onClick={() => toast("Brief generator opened", "brass")}><Icon name="plus" size={13} /> New brief</button>
      </div>
    </div>
  );
}

function Att({ level }) {
  const map = { high: "High", med: "Medium", low: "Low" };
  return <span className={"att " + level}>{map[level]}</span>;
}

function Conf({ n = 3 }) {
  return (
    <span className="conf" title={`Confidence ${n}/5`}>
      {[1,2,3,4,5].map(i => <span key={i} className={i<=n?"on":""} />)}
    </span>
  );
}

function SignalCard({ s }) {
  const { openSignal, state } = useStore();
  const archived = state.archived[s.id];
  if (archived) return null;
  return (
    <div className="signal" onClick={() => openSignal(s.id)}>
      <div className="sig-head">
        <span className="sig-id mono">{s.id}</span>
        <span className="sig-source mono">· {s.source}</span>
        <Att level={s.attention} />
        <span className="sig-time mono">{s.time}</span>
      </div>
      <div className="sig-title serif">{s.title}</div>
      <div className="sig-sum">{s.summary}</div>
      <div className="sig-tags">
        {s.tags.map((t, i) => <span key={i} className={"tag " + (t.c || "")}>{t.l}</span>)}
      </div>
      <div className="sig-action">
        <span className="sig-action-label">Recommended</span>
        <span className="sig-action-value">{s.action}</span>
        <Conf n={s.confidence} />
        <span className="sig-action-reason">{s.actionReason}</span>
      </div>
      {state.feedback[s.id] && (
        <div style={{marginTop:8, fontSize:11.5, color:"var(--brass)"}}>
          <Icon name="check" size={12} style={{verticalAlign:"-2px", marginRight:4}}/> Feedback: {state.feedback[s.id].label}
        </div>
      )}
    </div>
  );
}

function Drawer() {
  const { signalId, closeSignal, state, saveFeedback, archive, generateBrief, addWatchlist, saveNote, toast } = useStore();
  const signal = React.useMemo(() => SIGNALS.find(s => s.id === signalId), [signalId]);
  const [fb, setFb] = React.useState(null);
  const [note, setNote] = React.useState("");
  React.useEffect(() => {
    setFb(state.feedback[signalId]?.label || null);
    setNote(state.notes[signalId] || "");
  }, [signalId, state.feedback, state.notes]);
  const on = !!signal;
  const s = signal || {};
  const labels = ["Correct priority","Too high","Too low","Wrong topic","Wrong portfolio","Duplicate","Noise","Needs human review"];
  return (
    <>
      <div className={"drawer-back" + (on ? " on" : "")} onClick={closeSignal} />
      <aside className={"drawer" + (on ? " on" : "")}>
        {on && (
          <>
            <div className="drawer-head">
              <div>
                <div className="mono" style={{fontSize:10, color:"var(--ink-4)", letterSpacing:".16em", textTransform:"uppercase"}}>
                  {s.id} · {s.date}
                </div>
                <div className="serif" style={{fontSize:20, marginTop:4, maxWidth:460, lineHeight:1.25}}>{s.title}</div>
              </div>
              <button className="btn ghost sm" style={{marginLeft:"auto"}} onClick={closeSignal}><Icon name="close" size={14} /></button>
            </div>
            <div className="drawer-body">
              <div className="drawer-section"><h4>Summary</h4><p>{s.summary}</p></div>
              <div className="drawer-section">
                <h4>Signal metadata</h4>
                <dl className="kv">
                  <dt>Source</dt><dd>{s.source}</dd>
                  <dt>Source group</dt><dd>{s.sourceGroup}</dd>
                  <dt>Authority</dt><dd>{s.sourceAuthority}</dd>
                  <dt>Attention</dt><dd><Att level={s.attention} /></dd>
                  <dt>Confidence</dt><dd><Conf n={s.confidence} /> <span style={{color:"var(--ink-3)", marginLeft:8, fontFamily:"var(--mono)", fontSize:11}}>{s.confidence}/5</span></dd>
                  <dt>Human review</dt><dd>{s.humanReview}</dd>
                </dl>
              </div>
              <div className="drawer-section"><h4>Why it matters</h4><p>{s.attentionReason}</p></div>
              <div className="drawer-section">
                <h4>Recommended action</h4>
                <div style={{padding:"12px 14px", border:"1px solid #c9a36a44", borderRadius:8, background:"#c9a36a0d"}}>
                  <div style={{fontWeight:600, color:"var(--brass)"}}>{s.action}</div>
                  <div style={{color:"var(--ink-2)", fontSize:13, marginTop:4}}>{s.actionReason}</div>
                </div>
              </div>
              {s.score && (
                <div className="drawer-section">
                  <h4>Attention score breakdown</h4>
                  {Object.entries(s.score).map(([k,v]) => {
                    const lab = {authority:"Source authority", portfolio:"Portfolio relevance", novelty:"Novelty", momentum:"Momentum", time:"Time sensitivity", scrutiny:"Scrutiny relevance", ops:"Operational impact"};
                    return (
                      <div key={k} style={{display:"grid", gridTemplateColumns:"160px 1fr 40px", gap:10, alignItems:"center", padding:"4px 0"}}>
                        <div style={{fontSize:12.5, color:"var(--ink-2)"}}>{lab[k]}</div>
                        <div className="bar"><div className="fill" style={{width:`${v*100}%`}} /></div>
                        <div className="mono" style={{fontSize:11, color:"var(--ink-3)", textAlign:"right"}}>{Math.round(v*100)}</div>
                      </div>
                    );
                  })}
                </div>
              )}
              <div className="drawer-section">
                <h4>Evidence · open the actual source</h4>
                {s.evidence?.map((e,i) => (
                  <a key={i} href={e.url} target="_blank" rel="noopener noreferrer" style={{
                    display:"flex", alignItems:"center", gap:10, padding:"10px 12px",
                    border:"1px solid var(--line-2)", borderRadius:8, color:"var(--ink)",
                    textDecoration:"none", marginBottom:6, fontSize:13,
                  }}>
                    <Icon name="link" size={14} stroke="var(--teal)" />
                    <span>{e.label}</span>
                    <span className="mono" style={{color:"var(--ink-4)", fontSize:11, marginLeft:"auto", maxWidth:240, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{e.url.replace(/^https?:\/\//,"")}</span>
                    <Icon name="ext" size={12} stroke="var(--ink-3)" />
                  </a>
                ))}
              </div>

              {s.provenance && s.provenance.length > 0 && (
                <div className="drawer-section">
                  <h4>Provenance · how this signal was produced</h4>
                  <div style={{border:"1px solid var(--line-2)", borderRadius:8, overflow:"hidden"}}>
                    {s.provenance.map((p,i) => (
                      <div key={i} style={{display:"grid", gridTemplateColumns:"78px 90px 1fr", gap:10, padding:"8px 12px", fontSize:12, borderBottom: i<s.provenance.length-1 ? "1px solid var(--line)" : 0, background: i%2 ? "#ffffff03" : "transparent"}}>
                        <div className="mono" style={{color:"var(--ink-4)", fontSize:10.5}}>{p.ts}</div>
                        <div><span className="tag" style={{fontSize:10, padding:"1px 6px"}}>{p.by}</span></div>
                        <div style={{color:"var(--ink-2)"}}>{p.event}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {s.updates && s.updates.length > 0 && (
                <div className="drawer-section">
                  <h4>Updates to this signal · who / what / when</h4>
                  {s.updates.map((u,i) => (
                    <div key={i} style={{display:"grid", gridTemplateColumns:"60px 140px 1fr", gap:10, padding:"8px 0", borderBottom: i<s.updates.length-1 ? "1px solid var(--line)" : 0, fontSize:12.5}}>
                      <div className="mono" style={{color:"var(--ink-4)", fontSize:11}}>{u.ts}</div>
                      <div style={{color:"var(--brass)"}}>{u.who}</div>
                      <div style={{color:"var(--ink-2)"}}>{u.what}</div>
                    </div>
                  ))}
                </div>
              )}

              {s.members && s.members.length > 0 && (
                <div className="drawer-section">
                  <h4>People referenced</h4>
                  <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                    {s.members.map(mid => {
                      const m = window.ENTITIES?.members?.[mid];
                      if (!m) return null;
                      return <span key={mid} className="tag brass clk" onClick={() => window.__openModal?.("member", mid)}>{m.name}</span>;
                    })}
                  </div>
                </div>
              )}
              <div className="drawer-section">
                <h4>Analyst note</h4>
                <textarea value={note} onChange={e=>setNote(e.target.value)} onBlur={()=>saveNote(s.id, note)}
                  placeholder="Private notes (auto-saved)" rows={3}
                  style={{width:"100%", background:"var(--panel)", border:"1px solid var(--line-2)", borderRadius:8, color:"var(--ink)", padding:"8px 10px", fontFamily:"var(--sans)", fontSize:13, resize:"vertical"}}/>
              </div>
              <div className="drawer-section">
                <h4>Analyst feedback · is this right?</h4>
                <div className="feedback-row">
                  {labels.map(l => (
                    <button key={l} className={"fb" + (fb === l ? " on" : "")} onClick={() => { setFb(l); saveFeedback(s.id, l, ""); }}>
                      {l === "Correct priority" && <Icon name="check" size={12} style={{marginRight:6, verticalAlign:"-2px"}}/>}
                      {l}
                    </button>
                  ))}
                </div>
                {fb && fb !== "Correct priority" && (
                  <div style={{marginTop:10, padding:"10px 12px", background:"#ffffff04", border:"1px dashed var(--line-2)", borderRadius:8, fontSize:12.5, color:"var(--ink-2)"}}>
                    <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em"}}>Learning applied</div>
                    <div style={{marginTop:4}}>{s.source} · similar items · portfolio mapping adjusted</div>
                  </div>
                )}
                {fb === "Correct priority" && (
                  <div style={{marginTop:10, color:"var(--ok)", fontSize:12.5}}>
                    <Icon name="check" size={13} style={{verticalAlign:"-2px", marginRight:4}}/>Logged. Weights retained.
                  </div>
                )}
              </div>
            </div>
            <div className="drawer-foot">
              <button className="btn primary" onClick={() => generateBrief(s.id, "Executive brief")}><Icon name="brief" size={13} /> Generate brief</button>
              <button className="btn" onClick={() => addWatchlist(s.id)}><Icon name="watch" size={13} /> Watchlist</button>
              <button className="btn" onClick={() => { archive(s.id); closeSignal(); }}>Archive</button>
              <button className="btn ghost" style={{marginLeft:"auto"}} onClick={closeSignal}>Close</button>
            </div>
          </>
        )}
      </aside>
    </>
  );
}

Object.assign(window, { Sidebar, Topbar, SignalCard, Drawer, Att, Conf });

// Real AUSParliamentLive (@UCvO8Qfr3etT6khGA9Zln8WA) YouTube live embed.
// YouTube's live_stream endpoint auto-resolves to whatever stream is active on that channel.
// When no stream is live, YouTube shows the channel's upcoming/latest placeholder.
const APH_YT_CHANNEL = "UCvO8Qfr3etT6khGA9Zln8WA"; // @AUSParliamentLive
const APH_LIVE = {
  house:    { label: "House of Representatives", streamId: null, url: `https://www.youtube.com/embed/live_stream?channel=${APH_YT_CHANNEL}&autoplay=1&mute=1` },
  senate:   { label: "Senate",                    streamId: null, url: `https://www.youtube.com/embed/live_stream?channel=${APH_YT_CHANNEL}&autoplay=1&mute=1` },
  federation:{label: "Federation Chamber",        streamId: null, url: `https://www.youtube.com/embed/live_stream?channel=${APH_YT_CHANNEL}&autoplay=1&mute=1` },
};

function LiveBroadcast({ which, toast }) {
  const cfg = APH_LIVE[which] || APH_LIVE.house;
  // mode: "embed" = YouTube live_stream iframe ; "offline" = explicit fallback
  const [mode, setMode] = React.useState("embed");
  const [nonce, setNonce] = React.useState(0); // bump to force reload

  // When chamber changes, retry embed
  React.useEffect(() => {
    setMode("embed");
  }, [which]);

  return (
    <div className="live-wrap" style={{background:"#000", aspectRatio:"16/9", position:"relative", overflow:"hidden", borderRadius:10, border:"1px solid var(--line-2)"}}>
      {mode === "embed" && (
        <iframe
          key={which + "-" + nonce}
          src={cfg.url}
          title={`AUSParliamentLive — ${cfg.label}`}
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowFullScreen
          referrerPolicy="strict-origin-when-cross-origin"
          style={{position:"absolute", inset:0, width:"100%", height:"100%", border:0}}
        />
      )}

      {/* LIVE badge (only shown when embed mode is active) */}
      {mode === "embed" && (
        <div style={{position:"absolute", top:12, left:12, zIndex:3, display:"flex", alignItems:"center", gap:6, background:"rgba(0,0,0,0.6)", padding:"5px 10px", borderRadius:4, fontFamily:"var(--mono)", fontSize:11, color:"#fff", letterSpacing:".12em", border:"1px solid #d06a5e80"}}>
          <span style={{width:7, height:7, borderRadius:"50%", background:"#d06a5e", boxShadow:"0 0 10px #d06a5e", animation:"pulse 1.4s infinite"}}/>
          LIVE · {cfg.label.toUpperCase()}
        </div>
      )}

      {/* Manual "No stream?" pill — always available in embed mode because YouTube's
          offline state renders INSIDE the iframe and we can't detect it from here. */}
      {mode === "embed" && (
        <button
          onClick={() => setMode("offline")}
          style={{position:"absolute", top:12, right:12, zIndex:3, fontFamily:"var(--mono)", fontSize:10.5, color:"#fff", background:"rgba(0,0,0,0.55)", border:"1px solid #ffffff30", padding:"4px 9px", borderRadius:4, cursor:"pointer", letterSpacing:".08em"}}
          title="Show alternate sources if no stream is live"
        >
          NO STREAM?
        </button>
      )}

      {/* Fallback for no-stream / blocked / user-toggled */}
      {mode === "offline" && (
        <div style={{position:"absolute", inset:0, background:"linear-gradient(180deg, #0a0f16, #050810)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, textAlign:"center"}}>
          <div style={{fontFamily:"var(--serif)", fontSize:22, color:"#d4894a", marginBottom:10}}>Stream unavailable</div>
          <div style={{color:"var(--ink-2)", fontSize:13, maxWidth:460, lineHeight:1.5, marginBottom:18}}>
            AUSParliamentLive only broadcasts <strong>{cfg.label}</strong> while the chamber is in session. Try the official APH pages below, or retry the embed.
          </div>
          <div style={{display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center"}}>
            <a href="https://www.youtube.com/@AUSParliamentLive/streams" target="_blank" rel="noopener noreferrer" className="btn primary" style={{textDecoration:"none"}}>YouTube · AUSParliamentLive ↗</a>
            <a href="https://www.aph.gov.au/News_and_Events/Watch_Read_Listen" target="_blank" rel="noopener noreferrer" className="btn" style={{textDecoration:"none"}}>APH Watch / Read / Listen ↗</a>
            <a href="https://parlview.aph.gov.au/" target="_blank" rel="noopener noreferrer" className="btn" style={{textDecoration:"none"}}>ParlView archive ↗</a>
            <button className="btn" onClick={() => { setNonce(n => n + 1); setMode("embed"); }}>Retry embed</button>
          </div>
        </div>
      )}

      <style>{`@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
    </div>
  );
}

function PageLive() {
  const [which, setWhich] = useState("house");
  const { toast, openModal } = useStore();

  // --- REAL LIVE RSS POLLER ---
  // Fetches the official APH RSS feeds listed at https://www.aph.gov.au/Help/Rss_feeds
  // via allorigins.win (adds CORS headers APH does not send), parses the XML, and
  // merges items into a single time-sorted signal stream. Refreshes every 2 minutes.
  const APH_FEED_URLS = [
    { url: "https://www.aph.gov.au/house/rss/divisions",         label: "House Divisions",              kind: "division" },
    { url: "https://www.aph.gov.au/house/rss/todays_hearings",   label: "Today's House hearings",       kind: "hearing"  },
    { url: "https://www.aph.gov.au/house/rss/daily_program",     label: "House Daily Program",          kind: "program"  },
    { url: "https://www.aph.gov.au/senate/rss/red",              label: "Today's Senate hearings",      kind: "hearing"  },
    { url: "https://www.aph.gov.au/senate/rss/new_inquiries",    label: "New Senate inquiries",         kind: "inquiry"  },
    { url: "https://www.aph.gov.au/senate/rss/reports",          label: "Senate reports tabled",        kind: "report"   },
    { url: "https://www.aph.gov.au/senate/rss/upcoming_hearings",label: "Upcoming Senate hearings",     kind: "hearing"  },
    { url: "https://www.aph.gov.au/house/rss/house_inquiries",   label: "House inquiries",              kind: "inquiry"  },
    { url: "https://www.aph.gov.au/house/rss/joint_inquiries",   label: "Joint inquiries",              kind: "inquiry"  },
    { url: "https://www.aph.gov.au/house/rss/media_releases",    label: "House media releases",         kind: "signal"   },
    { url: "https://www.aph.gov.au/house/rss/house_news",        label: "About the House News",         kind: "signal"   },
    { url: "https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;adv=yes;orderBy=date-eFirst;page=0;query=Date%3AthisYear%20Dataset%3Abillsdgs;resCount=100", label: "Bills Digests", kind: "digest" },
  ];
  const [events, setEvents] = useState([]);
  const [feedStatus, setFeedStatus] = useState({}); // url -> {ok, count, error}
  const [lastPoll, setLastPoll] = useState(null);
  const [loading, setLoading] = useState(true);

  React.useEffect(() => {
    let cancelled = false;

    // r.jina.ai is a fetch-proxy reachable from sandboxed browsers.
    // Default output is markdown; we extract item titles + links from it.
    // Link format in jina markdown: "[Title](url)" or "Title\n   url"
    const parseJinaMarkdown = (text, feedMeta) => {
      const out = [];
      // Strategy 1: markdown links [title](url) — jina's default rendering of RSS items
      const re = /\[([^\]]{8,240})\]\((https?:\/\/[^\s\)]+)\)/g;
      let m;
      const seen = new Set();
      while ((m = re.exec(text)) !== null) {
        const title = m[1].trim().replace(/\s+/g, " ");
        const link = m[2];
        // Filter out nav/chrome links
        if (/^(home|menu|skip|log in|contact|rss|search|login|register|top|back to top|feed address)$/i.test(title)) continue;
        if (/aph\.gov\.au\/(Help|About|Senators_and_Members)\b/i.test(link) && !/rss|feed|inquiry|hearing|bill|division|report/i.test(title)) continue;
        // Skip entries whose title is just a URL (jina markdown sometimes renders bare links)
        if (/^https?:\/\//i.test(title)) continue;
        // Must look like actual content (avoid pure nav)
        if (title.length < 10) continue;
        const key = title.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({
          title, link,
          date: null, // jina markdown doesn't reliably include pubDate
          sourceLabel: feedMeta.label,
          sourceUrl:   feedMeta.url,
          kind:        feedMeta.kind,
          order:       out.length, // preserve feed order as recency proxy
        });
        if (out.length >= 6) break;
      }
      return out;
    };

    const fetchOne = async (f) => {
      // jina re-serves the URL contents. Concatenated, NOT URL-encoded.
      const proxy = "https://r.jina.ai/" + f.url;
      const res = await fetch(proxy, {
        cache: "no-store",
        headers: { "Accept": "text/plain" },
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      return parseJinaMarkdown(text, f);
    };

    const poll = async () => {
      setLoading(true);
      const results = await Promise.allSettled(APH_FEED_URLS.map(fetchOne));
      if (cancelled) return;
      const all = [];
      const status = {};
      results.forEach((r, i) => {
        const f = APH_FEED_URLS[i];
        if (r.status === "fulfilled") {
          status[f.url] = { ok: true, count: r.value.length };
          all.push(...r.value.map((it, idx) => ({ ...it, feedIdx: i, itemIdx: idx })));
        } else {
          status[f.url] = { ok: false, error: String(r.reason).slice(0, 80) };
        }
      });
      // Without dates, sort by feed priority (divisions first, then hearings, etc.) then item order
      all.sort((a, b) => a.feedIdx - b.feedIdx || a.itemIdx - b.itemIdx);
      setEvents(all.slice(0, 30));
      setFeedStatus(status);
      setLastPoll(new Date());
      setLoading(false);
    };

    poll();
    const id = setInterval(poll, 120000); // 2 min
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  const fmtTime = (d) => {
    if (!d) return "—";
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return `${d.getDate()} ${d.toLocaleString("en-AU",{month:"short"})}`;
  };
  const liveCount = Object.values(feedStatus).filter(s => s.ok).length;
  const totalFeeds = APH_FEED_URLS.length;

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-kicker">Today · live</div>
          <h1 className="page-title">Live parliament</h1>
          <div className="page-sub">Official AUSParliamentLive broadcast (YouTube), ParlView archive, Hansard live-track, and division bells — all wired to the signal engine.</div>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button className={"btn " + (which === "house" ? "primary" : "")} onClick={() => setWhich("house")}>House</button>
          <button className={"btn " + (which === "senate" ? "primary" : "")} onClick={() => setWhich("senate")}>Senate</button>
          <button className={"btn " + (which === "federation" ? "primary" : "")} onClick={() => setWhich("federation")}>Federation</button>
          <button className="btn" onClick={() => toast("Flag captured — linked to current speaker", "brass")}><Icon name="flag" size={13}/> Flag moment</button>
        </div>
      </div>

      <div className="grid" style={{gridTemplateColumns:"1.7fr 1fr", gap:16}}>
        <div>
          <LiveBroadcast which={which} toast={toast} />
          <div style={{display:"flex", gap:8, marginTop:12, alignItems:"center", flexWrap:"wrap"}}>
            <span className="src-badge"><span className="hdot live"/> AUSParliamentLive · YouTube</span>
            <span className="src-badge"><Icon name="clock" size={11}/> Since 09:30 AEST</span>
            <a href="https://www.youtube.com/@AUSParliamentLive/streams" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> AUSParliamentLive ↗</a>
            <a href="https://parlview.aph.gov.au/" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> ParlView archive ↗</a>
            <a href="https://www.aph.gov.au/Parliamentary_Business/Hansard" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> Hansard ↗</a>
            <button className="btn sm ghost" style={{marginLeft:"auto"}} onClick={() => toast("Transcript queued from ParlView")}>Request transcript</button>
            <button className="btn sm" onClick={() => toast("Clip queued for brief", "brass")}><Icon name="brief" size={12}/> Clip to brief</button>
          </div>

          <div className="panel" style={{marginTop:16}}>
            <div className="panel-head">
              <h3 className="panel-title">Currently on program</h3>
              <span className="panel-kicker">{which === "house" ? "House of Representatives" : which === "senate" ? "Senate" : "Federation Chamber"}</span>
              <a href={which === "house" ? "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Daily_program" : "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/Senate_chamber_documents/Dynamic_Red"} target="_blank" rel="noopener noreferrer" style={{marginLeft:"auto", fontSize:11.5, color:"var(--teal)", textDecoration:"none"}}>Open daily program <Icon name="ext" size={11}/></a>
            </div>
            <div className="panel-body">
              <div className="timeline">
                <div className="tl-item"><div className="tl-time">12:00</div><div className="tl-body">Question time · <a href="#" onClick={e=>{e.preventDefault(); openModal("bill","BILL-2026-048");}} style={{color:"var(--ink)"}}>Digital ID Amendment</a> expected</div></div>
                <div className="tl-item teal"><div className="tl-time">14:00</div><div className="tl-body">Government business · 2nd reading <a href="#" onClick={e=>{e.preventDefault(); openModal("bill","BILL-2026-041");}} style={{color:"var(--ink)"}}>Cyber Security Bill</a> <span className="tag brass" style={{marginLeft:6}}>Watchlist · Cyber</span></div></div>
                <div className="tl-item info"><div className="tl-time">16:30</div><div className="tl-body">Adjournment debate</div></div>
              </div>
            </div>
          </div>

          {/* APH Connectors panel */}
          <div className="panel" style={{marginTop:16}}>
            <div className="panel-head">
              <h3 className="panel-title">APH connectors</h3>
              <span className="panel-kicker">Live data endpoints · {6} connected</span>
            </div>
            <div className="panel-body">
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
                {[
                  { name: "Hansard live", url: "https://www.aph.gov.au/Parliamentary_Business/Hansard", status: "live", desc: "Daily proofs · every 5 min" },
                  { name: "ParlInfo Search API", url: "https://parlinfo.aph.gov.au/parlInfo/search/search.w3p", status: "live", desc: "Full-text across bills, Hansard, committees" },
                  { name: "Bills Search (OpenSearch)", url: "https://www.aph.gov.au/Parliamentary_Business/Bills_Legislation/Bills_Search_Results", status: "live", desc: "Bill stage & status" },
                  { name: "Senate Dynamic Red", url: "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/Senate_chamber_documents/Dynamic_Red", status: "live", desc: "Senate program · live" },
                  { name: "House Daily Program", url: "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Daily_program", status: "live", desc: "House program · live" },
                  { name: "Division results feed", url: "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Division_lists", status: "live", desc: "Votes within 2 min of call" },
                  { name: "Committee hearings RSS", url: "https://www.aph.gov.au/Parliamentary_Business/Committees/RSS_Feeds", status: "live", desc: "New & upcoming inquiries" },
                  { name: "Senators & Members", url: "https://www.aph.gov.au/Senators_and_Members", status: "live", desc: "Member roster + portfolios" },
                ].map((c,i) => (
                  <a key={i} href={c.url} target="_blank" rel="noopener noreferrer" style={{display:"flex", alignItems:"center", gap:10, padding:"10px 12px", border:"1px solid var(--line-2)", borderRadius:6, textDecoration:"none", color:"var(--ink)", background:"var(--panel-2)"}}>
                    <span className={"hdot live"} style={{flexShrink:0}}/>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:12.5, fontWeight:500}}>{c.name}</div>
                      <div style={{fontSize:11, color:"var(--ink-3)", marginTop:2}}>{c.desc}</div>
                    </div>
                    <Icon name="ext" size={12} stroke="var(--ink-3)"/>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="panel">
          <div className="panel-head">
            <h3 className="panel-title">Signal events · live RSS</h3>
            <span className="panel-kicker">{loading && events.length === 0 ? "Polling…" : `${events.length} items · ${liveCount}/${totalFeeds} feeds`}</span>
          </div>
          <div className="panel-body" style={{maxHeight:720, overflowY:"auto"}}>
            {loading && events.length === 0 && (
              <div style={{padding:"20px 8px", color:"var(--ink-3)", fontSize:12.5, textAlign:"center"}}>
                Fetching live RSS from aph.gov.au via CORS proxy…
              </div>
            )}
            {!loading && events.length === 0 && (
              <div style={{padding:"14px 8px", fontSize:12.5, color:"var(--ink-3)"}}>
                <div style={{color:"var(--caution)", fontWeight:500, marginBottom:6}}>⚠ No items returned</div>
                The CORS proxy (allorigins.win) could not reach the APH RSS endpoints. This can happen if the proxy is rate-limited or APH rejected the request. Links below still open the raw feeds in a new tab.

            )}
            {events.map((e, i) => (
              <a key={i} href={e.link || e.sourceUrl} target="_blank" rel="noopener noreferrer" className="clk" style={{display:"grid", gridTemplateColumns:"56px 16px 1fr", gap:10, padding:"10px 8px", borderBottom: i<events.length-1 ? "1px solid var(--line)" : 0, borderRadius:6, alignItems:"start", textDecoration:"none", color:"inherit"}}>
                <div className="mono" style={{fontSize:10.5, color:"var(--ink-4)", paddingTop:2}}>{fmtTime(e.date)}</div>
                <div style={{paddingTop:3}}>
                  {e.kind === "division" && <Icon name="flag" size={13} stroke="var(--escalate)"/>}
                  {e.kind === "hearing" && <Icon name="signal" size={13} stroke="var(--teal)"/>}
                  {e.kind === "inquiry" && <Icon name="pattern" size={13} stroke="var(--brass)"/>}
                  {e.kind === "digest" && <Icon name="brief" size={13} stroke="var(--brass)"/>}
                  {e.kind === "program" && <Icon name="clock" size={13} stroke="var(--ink-3)"/>}
                  {e.kind === "report" && <Icon name="brief" size={13} stroke="var(--teal)"/>}
                  {e.kind === "signal" && <Icon name="signal" size={13} stroke="var(--ink-3)"/>}
                </div>
                <div>
                  <div style={{fontSize:13, color:"var(--ink)", lineHeight:1.4}}>{e.title}</div>
                  <div style={{display:"flex", gap:8, marginTop:6, alignItems:"center", flexWrap:"wrap"}}>
                    <span className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".12em"}}>{e.kind}</span>
                    <span style={{fontSize:10.5, color:"var(--teal)", fontFamily:"var(--mono)", display:"inline-flex", alignItems:"center", gap:3}}>
                      <Icon name="ext" size={10}/> {e.sourceLabel}
                    </span>
                  </div>
                </div>
              </a>
            ))}
          </div>
          <div className="panel-foot" style={{flexDirection:"column", alignItems:"flex-start", gap:4}}>
            <span className="mono" style={{fontSize:10, color:"var(--ink-3)"}}>Live RSS · aph.gov.au via r.jina.ai CORS proxy · refreshes every 2 min</span>
            <span className="mono" style={{fontSize:10, color:"var(--ink-4)"}}>Last poll: {lastPoll ? fmtTime(lastPoll) : "—"} · Click any item to open source</span>
          </div>
        </div>
      </div>
    </div>
  );
}

          <div className="page-sub">Every brief follows a required structure: What happened · Source · Why it matters · Recommended action · Evidence · Uncertainty · Human review.</div>
        </div>
        <button className="btn primary" onClick={() => toast("New brief opened", "brass")}><Icon name="plus" size={13}/> New brief</button>
      </div>

      <div className="grid" style={{gridTemplateColumns:"280px 1fr", gap:16}}>
        <div className="panel">
          <div className="panel-head"><h3 className="panel-title">Queue</h3><span className="panel-kicker">4 pending</span></div>
          <div>
            {briefs.map((b, i) => (
              <div key={i} onClick={() => setSel(i)} style={{padding:"12px 14px", borderBottom:"1px solid var(--line)", cursor:"pointer", background: sel===i ? "#c9a36a0c" : "transparent", borderLeft: sel===i ? "2px solid var(--brass)" : "2px solid transparent"}}>
                <div style={{fontSize:13, fontWeight:500}}>{b.type}</div>
                <div style={{fontSize:11.5, color:"var(--ink-3)"}}>For {b.for}</div>
                <div className="mono" style={{fontSize:10, marginTop:4, color: b.status === "Drafted" ? "var(--ok)" : b.status === "In progress" ? "var(--caution)" : "var(--info)", textTransform:"uppercase", letterSpacing:".12em"}}>{b.status}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="panel">
          <div className="panel-head">
            <h3 className="panel-title">{briefs[sel].type} · preview</h3>
            <span className="panel-kicker">For {briefs[sel].for}</span>
            <div style={{marginLeft:"auto", display:"flex", gap:6}}>
              <button className="btn ghost sm" onClick={() => toast("PDF exported")}><Icon name="download" size={12}/> PDF</button>
              <button className="btn sm" onClick={() => toast("Brief sent")}>Send</button>
              <button className="btn primary sm" onClick={() => toast("Brief approved", "brass")}>Approve</button>
            </div>
          </div>
          <div className="panel-body">
            <div className="brief">
              <div className="meta">CIVIC SIGNAL · {briefs[sel].type.toUpperCase()} · 24 APR 2026 · 08:20</div>
              <h3>New Senate inquiry: Digital procurement governance</h3>
              <h5>What happened</h5>
              <div>The Finance and Public Administration References Committee has opened an inquiry into Commonwealth procurement and contract governance for digital programs over $100m. Submissions close 19 May.</div>
              <h5>Source</h5>
              <div>APH Senate New Inquiries RSS · Official · validated 24 Apr 08:15.</div>
              <h5>Why it matters</h5>
              <div>The inquiry directly overlaps two watchlists (Digital procurement, Procurement) and follows last week's ANAO report tabling. Preliminary scrutiny pattern detected on the same topic (4 QONs / 3 members / 48h).</div>
              <h5>Recommended action</h5>
              <div><strong>Assign Policy Owner.</strong> Draft submission plan by 02 May. Coordinate with Legal on contract-variation data scope.</div>
              <h5>Evidence</h5>
              <ul><li>APH · inquiry listing (primary)</li><li>ANAO · performance audit report 2025–26/41</li><li>Internal · existing procurement governance framework v4.2</li></ul>
              <h5>Uncertainty</h5>
              <div>The inquiry's terms of reference may expand during hearings. Confidence: Moderate.</div>
              <h5>Human review</h5>
              <div>Required · to be cleared by Director, Digital Strategy.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- WATCHLISTS ----------
function PageWatchlists() {
  const { openModal, createWatchlist, state } = useStore();
  const [newName, setNewName] = useState("");
  const all = [...WATCHLISTS, ...state.watchlistCreated];
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-kicker">Workflow</div>
          <h1 className="page-title">Watchlists</h1>
          <div className="page-sub">The relevance engine. Click any watchlist for matches and configuration.</div>
        </div>
        <div style={{display:"flex", gap:8}}>
          <input placeholder="New watchlist name" value={newName} onChange={e=>setNewName(e.target.value)} className="search" style={{padding:"7px 10px"}}/>
          <button className="btn primary" onClick={() => { if (newName.trim()) { createWatchlist(newName.trim()); setNewName(""); } }}><Icon name="plus" size={13}/> Create</button>
        </div>
      </div>

      <div className="grid g-3">
        {all.map(w => {
          const max = Math.max(...w.trend, 1);
          return (
            <div key={w.name} className="wl" onClick={() => openModal("watchlist", w.name)}>
              <div style={{display:"flex", alignItems:"center", gap:8}}>
                <span className="wl-name">{w.name}</span>
                <span className="mono" style={{fontSize:10.5, color:"var(--brass)", background:"#c9a36a12", border:"1px solid #c9a36a44", padding:"1px 6px", borderRadius:4, marginLeft:"auto"}}>{w.matches} matches</span>
              </div>
              <div className="wl-meta"><span>{w.keywords} keywords</span><span>·</span><span>7-day</span></div>
              <div className="spark" style={{marginTop:2}}>
                {w.trend.map((v,i) => <span key={i} style={{height: (v/max*20+2)+"px"}}/>)}
              </div>
            </div>
          );
        })}
      </div>

      <div className="panel" style={{marginTop:18}}>
        <div className="panel-head">
          <h3 className="panel-title">Digital government · configuration</h3>
          <span className="panel-kicker">Selected watchlist</span>
        </div>
        <div className="panel-body">
          <div className="grid g-2">
            <div>
              <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", marginBottom:6}}>Keywords</div>
              <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                {["digital transformation","ICT procurement","MyGov","service delivery","APS digital","digital identity","digital strategy","cloud services","data sharing","Digital Transformation Agency"].map(k => <span key={k} className="tag brass">{k}</span>)}
              </div>
              <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", margin:"14px 0 6px"}}>Linked committees</div>
              <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                <span className="tag teal clk" onClick={() => openModal("committee","jcpaa")}>Joint Committee on Public Accounts & Audit</span>
                <span className="tag teal clk" onClick={() => openModal("committee","finpa")}>Finance & Public Administration (Sen)</span>
                <span className="tag teal clk" onClick={() => openModal("committee","econ")}>Economics Legislation (Sen)</span>
              </div>
            </div>
            <div>
              <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", marginBottom:6}}>Attention thresholds</div>
              <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:8, fontSize:13}}>
                <div>Source authority weight</div><div className="mono">0.95</div>
                <div>Portfolio relevance weight</div><div className="mono">0.90</div>
                <div>Minimum attention score</div><div className="mono">0.55</div>
                <div>Auto-escalate above</div><div className="mono">0.80</div>
                <div>Suppress duplicates within</div><div className="mono">24h</div>
              </div>
              <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", margin:"14px 0 6px"}}>Audit — recent corrections</div>
              <div style={{fontSize:12.5, color:"var(--ink-2)"}}>
                08:43 · House media releases → downgraded procedural items (weight −0.12)<br/>
                Yesterday 14:10 · Duplicate suppression added for cross-posted inquiry notices
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- RADAR ----------
function PageRadar() {
  const { openModal } = useStore();
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-kicker">Today</div>
          <h1 className="page-title">Attention radar</h1>
          <div className="page-sub">Transparent categories — no fake precision scores. Click any issue for momentum detail and suggested actions.</div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h3 className="panel-title">Active issues</h3>
          <span className="panel-kicker">Last 7 days</span>
        </div>
        <div className="panel-body">
          <div style={{display:"grid", gridTemplateColumns:"1fr 100px 80px 120px 140px", padding:"4px 0 10px", borderBottom:"1px solid var(--line)", alignItems:"center", gap:14}}>
            <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em"}}>Issue</div>
            <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em"}}>Attention</div>
            <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em", textAlign:"right"}}>Sources</div>
            <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em"}}>Momentum</div>
            <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em"}}>Confidence</div>
          </div>
          {RADAR.map((r,i) => (
            <div key={i} className="clk" onClick={() => openModal("radar", r.issue)} style={{display:"grid", gridTemplateColumns:"1fr 100px 80px 120px 140px", padding:"14px 8px", borderBottom: i<RADAR.length-1 ? "1px solid var(--line)" : 0, gap:14, alignItems:"center", borderRadius:6}}>
              <div>
                <div style={{fontSize:14, fontWeight:500}}>{r.issue}</div>
                <div style={{fontSize:12, color:"var(--ink-3)", marginTop:2}}>{r.reason}</div>
              </div>
              <div><Att level={r.att}/></div>
              <div className="mono" style={{textAlign:"right", color:"var(--ink-2)"}}>{r.sources}</div>
              <div><div className="bar"><div className="fill" style={{width:`${r.momentum*100}%`}}/></div></div>
              <div style={{display:"flex", alignItems:"center", gap:10}}>
                <div className="ring" style={{"--p": Math.round(r.confidence*100)}} data-p={Math.round(r.confidence*100)}></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { PageOverview, PageLive, PageSources, PageCommittees, PageBills, PageParliament, PagePatterns, PageBriefings, PageWatchlists, PageRadar });

</script>
<script type="text/babel" data-module="app.jsx">
// App root — wires StoreProvider and all pages
function App() {
  const [page, setPage] = React.useState("overview");
  React.useEffect(() => { window.__setPage = setPage; }, []);

  const renderPage = () => {
    switch (page) {
      case "overview":   return <PageOverview />;
      case "live":       return <PageLive />;
      case "sources":    return <PageSources />;
      case "committees": return <PageCommittees />;
      case "bills":      return <PageBills />;
      case "parliament": return <PageParliament />;
      case "patterns":   return <PagePatterns />;
      case "briefings":  return <PageBriefings />;
      case "watchlists": return <PageWatchlists />;
      case "radar":      return <PageRadar />;
      default:           return <PageOverview />;
    }
  };

  return (
    <StoreProvider>
      <div className="app">
        <Sidebar page={page} setPage={setPage} />
        <div className="main">
          <Topbar setPage={setPage} />
          <div className="content">{renderPage()}</div>
        </div>
        <Drawer />
        <DetailModal />
      </div>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
