<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Parliament Pulse — Prometheus Policy Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Parliament Pulse — Australian parliamentary intelligence for policy officers. Live feeds, signal tracking, committee monitoring, and brief generation." />
<meta name="author" content="Prometheus Policy Lab" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "IBM Plex Sans Fallback";
    src: local("Arial");
    size-adjust: 96%;
    ascent-override: 101%;
    descent-override: 28%;
    line-gap-override: 0%;
  }
  :root {
    /* Parliament Pulse — Fire House warm near-black, ember sovereign */
    /* One ink, two-step elevation, one sovereign ember accent. Teal is verification-only. */

    --bg:           #07080e;
    --bg-2:         #0a0c14;
    --panel:        #11131f;
    --panel-2:      #161826;
    --panel-hi:     #20223440;
    --line:         #ffffff0c;
    --line-2:       #ffffff16;
    --line-bright:  #ffffff2a;

    --ink:          #f5f0e1;   /* warm cream, never pure white */
    --ink-2:        #d8d4c5;
    --ink-3:        #a0a4b4;
    --ink-4:        #8a8e9e;

    /* PRIMARY ACCENT — incandescent ember, sovereign. Brand, priority, live.
       Sanctioned ember inventory (DESIGN-2) — ember (--brass) appears ONLY as:
         1. brand mark + sidebar active-nav left-border
         2. the single primary action per surface (.btn.primary)
         3. active selection / focus ring (--accent-ring, --accent-glow)
         4. live + high-priority signal accents (escalates to --ember-flash)
         5. topbar underglow scanline (--topbar-underglow)
       Everything else (fixture pills, match counts, .tag.brass non-primary) is
       neutral ink/line. ember-flash is reserved strictly for LIVE/breaking/high. */
    --brass:        #f08a3c;   /* ~8.0:1 on #07080e, ~7.4:1 on panel — AA */
    --brass-2:      #ff9d4f;   /* hover/glow */
    --brass-soft:   #7a4420;
    --brass-ink:    #160b03;
    --gold:         #d9b779;   /* secondary numerics, brief accent, ~10:1 */
    --ember-flash:  #e0534b;   /* reserved: LIVE, breaking, high attention only */

    /* SECONDARY ACCENT — verification only, never decorative. */
    --teal:         #45b3a4;   /* connected, healthy, verified */
    --teal-soft:    #2e7068;

    /* Functional status — the true five: ink-scale + ember + gold + teal + one risk.
       Positive/affirmative (agreed, ready, success) folds into the teal verification
       family so no standalone green sixth hue survives (DESIGN-9). Caution-gold and
       steel-ash are the only sanctioned counterpoints; ember-flash is the sole risk red. */
    --info:         #9aa6b0;   /* steel-ash — the single sanctioned cool counterpoint */
    --caution:      #d4a017;   /* warm */
    --escalate:     #f87171;   /* risk */
    --ok:           #45b3a4;   /* positive/affirmative = teal-verified family (no green) */

    --side-start:   #0c0d16;
    --side-end:     var(--bg);
    --topbar-bg:    #0a0c14cc;
    --scrim:        #000000a0;
    --scrim-strong: #000000b0;
    --overlay-shadow: #00000080;
    --search-shadow: #000000a0;
    --brand-core:   #0d0806;
    --brand-glow:   #3a2410;
    --accent-ring:  #f08a3c33;
    --accent-glow:  #f08a3c55;
    --topbar-underglow: #f08a3c1a;   /* ember scanline under the command bar (DESIGN-7) */
    --rule-1:       #ffffff14;   /* visible hairline: panel + section boundaries */
    --rule-2:       #ffffff08;   /* whisper hairline: sub-rows inside a panel */
    --gap-section:  28px;        /* big between sections */
    --gap-intra:    8px;         /* tight within a section */
    --signal-high-bg: linear-gradient(160deg, #1f1614 0%, var(--panel) 100%);
    --live-red:     #c4382f;     /* nav live count background (white text, AA) */
    --hover-surface: #ffffff06;
    --active-surface: #ffffff0c;
    --soft-surface: #ffffff03;

    --r-sm: 4px;
    --r:    8px;
    --r-lg: 14px;

    --shadow: 0 1px 0 #00000060, 0 20px 50px -28px #00000090;

    --sans: "IBM Plex Sans", "IBM Plex Sans Fallback", system-ui, sans-serif;
    --serif: "IBM Plex Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    /* Type scale */
    --t-display:  56px;
    --t-masthead: 30px;
    --t-headline: 23px;
    --t-subhead:  18px;
    --t-body:     15px;
    --t-body-sm:  13px;
    --t-stat:     28px;
    --t-kpi:      48px;
    --t-label:    10px;
    --t-micro:    9px;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;

    /* Motion tokens — Fire House tier model */
    --ease-functional: cubic-bezier(0.2,0,0,1);
    --ease-entrance:   cubic-bezier(0.22,1,0.36,1);
    --ease-textural:   cubic-bezier(0.34,1.56,0.64,1);
    --dur-micro: 120ms;
    --dur:       200ms;
    --dur-page:  280ms;
  }

  :root[data-theme="light"] {
    /* Warm paper, not cool white — Fire House light register */
    --bg:       #f3eee2;
    --bg-2:     #ebe4d4;
    --panel:    #fdfaf2;
    --panel-2:  #f3eee2;
    --panel-hi: rgba(120,70,20,.05);
    --ink:      #1a140c;
    --ink-2:    #3a3026;
    --ink-3:    #5a5044;   /* ~4.9:1 AA */
    --ink-4:    #685c4d;   /* ~5.7:1 AA */
    --line:     rgba(80,50,20,.12);
    --line-2:   rgba(80,50,20,.08);
    --line-bright: rgba(80,50,20,.20);
    --shadow:   0 1px 0 rgba(60,40,20,.05), 0 12px 36px -20px rgba(60,40,20,.20);
    /* Accent colours recalibrated for warm paper — dark theme ember fails AA here */
    --brass:    #9a5219;  /* ~5.0:1 on warm paper, ~5.6:1 on panel */
    --brass-2:  #b5611f;
    --gold:     #766019;  /* secondary numerics, ~5.3:1 on bg */
    --ember-flash: #c0392f;  /* LIVE/high — ~4.7:1 on bg */
    --teal:     #1f7068;  /* verification only — ~5.1:1 */
    --ok:       #1f7068;  /* positive/affirmative = teal-verified family (DESIGN-9), ~5.1:1 */
    --escalate: #b03028;  /* ~5.5:1 */
    --caution:  #7a570d;  /* ~5.7:1 */
    --info:     #5a5e68;  /* steel-ash — ~5.6:1 */
    --side-start: #efe7d6;
    --side-end: #e6dcc8;
    --topbar-bg: rgba(243,238,226,.9);
    --scrim: rgba(70,45,20,.36);
    --scrim-strong: rgba(70,45,20,.46);
    --overlay-shadow: rgba(60,40,20,.22);
    --search-shadow: rgba(60,40,20,.16);
    --brand-core: #efe2cc;
    --brand-glow: #f8ead4;
    --accent-ring: rgba(154,82,25,.22);
    --accent-glow: rgba(154,82,25,.24);
    --topbar-underglow: rgba(154,82,25,.14);   /* ember scanline, warm-paper register (DESIGN-7) */
    --hover-surface: rgba(80,50,20,.05);
    --active-surface: rgba(80,50,20,.07);
    --soft-surface: rgba(80,50,20,.03);
  }
  /* Light theme structural overrides — hardcoded dark values in base CSS */
  [data-theme="light"] body {
    background: var(--bg);
  }
  [data-theme="light"] .signal {
    background: var(--panel);
  }
  [data-theme="light"] .drawer {
    background: linear-gradient(180deg, #fdfaf2, #f5efe2);
  }
  [data-theme="light"] .pattern {
    background: linear-gradient(180deg, #fdf6e9, #fbf0df);
  }
  [data-theme="light"] .nav-item .count {
    background: rgba(80,50,20,.07);
  }
  [data-theme="light"] table.ds th {
    background: rgba(80,50,20,.03);
  }
  [data-theme="light"] table.ds tbody tr:hover {
    background: rgba(80,50,20,.03);
  }
  [data-theme="light"] .wl {
    background: rgba(80,50,20,.03);
  }
  [data-theme="light"] .toast {
    background: #fdfaf2;
    border-color: rgba(80,50,20,.16);
    box-shadow: 0 4px 20px rgba(60,40,20,.14);
  }
  [data-theme="light"] .toast.toast-err {
    background: #fbf0ee;
    border-color: #c0392f44;
  }
  [data-theme="light"] .clk:hover {
    background: rgba(80,50,20,.05);
  }
  [data-theme="light"] .live-strip {
    background: linear-gradient(90deg, #fdf0e2 0%, #f3eee2 60%, #f3eee2 100%);
  }
  [data-theme="light"] ::-webkit-scrollbar-thumb { background: #cdbfa6; }
  [data-theme="light"] .nav-item.active {
    background: rgba(80,50,20,.06);
  }
  [data-theme="light"] .sr-item.active {
    background: rgba(80,50,20,.07);
  }
  /* High-attention signal card: base rule hardcodes a dark gradient; warm-paper override (design bug). */
  [data-theme="light"] .signal[data-att="high"] {
    background: linear-gradient(160deg, #fbe9dc 0%, var(--panel) 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:
      radial-gradient(1600px 900px at 8% -8%, #14100a 0%, transparent 55%),
      radial-gradient(1100px 760px at 96% 112%, #1a1108 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--t-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: 0.005em;
  }

  .mono { font-family: var(--mono); font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .serif { font-family: var(--serif); }
  .t-kpi { font-size: var(--t-kpi); line-height: 1; }
  .t-stat { font-size: var(--t-stat); line-height: 1; }
  .t-body { font-size: var(--t-body-sm); line-height: 1.5; }
  .t-label { font-size: var(--t-label); letter-spacing: .18em; text-transform: uppercase; }
  .list-row, .data-row { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
  .list-row:last-child, .data-row:last-child { border-bottom: 0; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 256px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .side {
    background: var(--side-start);   /* flat ink slab — premium UIs do not gradient chrome */
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 6px;
    background: var(--brand-core);
    border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
  .brand-sub  { font-family: var(--mono); color: var(--ink-4); font-size: 10px; text-transform: uppercase; letter-spacing: .18em; margin-top: 2px; }

  .nav {
    padding: 10px 8px;
    overflow-y: auto;
    flex: 1;
  }
  .nav-group {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .18em; color: var(--ink-4);
    padding: 14px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    color: var(--ink-2); cursor: pointer;
    font-size: 13px;
    user-select: none;
    position: relative;
  }
  .nav-item:hover { background: var(--hover-surface); color: var(--ink); }
  .nav-item.active {
    background: var(--active-surface);  /* ember left-border carries selection */
    color: var(--ink);
  }
  .nav-item.active::before{
    content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    background: var(--brass); border-radius: 0 2px 2px 0;
    box-shadow: 0 0 10px -2px var(--brass);
  }
  .nav-item .ico { width:16px; height:16px; opacity:.85; flex:none; }
  .nav-item .count {
    margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    background: var(--active-surface); padding: 1px 6px; border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .nav-item.active .count { color: var(--brass); background: #f08a3c1f; }
  .nav-item .count.nav-live { color: #fff; background: var(--live-red); font-weight: 600; }

  .side-foot {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brass-soft), var(--brass));
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 11px; color: var(--brass-ink); font-weight: 600;
  }

  /* ---------- Top bar ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 -1px 0 var(--topbar-underglow);
    background: var(--topbar-bg);
    position: sticky; top: 0; z-index: 20;
  }
  .search {
    flex: 1; max-width: 620px;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 8px 10px;
    transition: border-color var(--dur) var(--ease-functional), box-shadow var(--dur) var(--ease-functional);
  }
  .search:focus-within {
    border-color: var(--brass);
    box-shadow: 0 0 0 3px #f08a3c22;
  }
  .search input {
    background: transparent; border: 0; outline: 0;
    color: var(--ink); font-family: var(--sans); font-size: 13px; width: 100%;
  }
  /* Topbar command-bar live clock + status cluster */
  .top-clock {
    font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .kbd {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 4px;
    background: var(--soft-surface);
  }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-toggle { display: none; flex: none; }
  .mobile-nav-back { display: none; }
  .chip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line-2); color: var(--ink-3); background: var(--soft-surface);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px #4ade8022; }
  .chip.warn .dot { background: var(--caution); box-shadow: 0 0 0 3px #d4a01722;}
  .chip.bad .dot { background: var(--escalate); box-shadow: 0 0 0 3px #f8717122;}
  .btn {
    font-family: var(--sans); font-size: 12.5px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--panel-2); color: var(--ink); }
  .btn.primary {
    background: linear-gradient(180deg, #f5934a, #e07d33);
    color: var(--brass-ink); border: 1px solid #c4661e;
    font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 0 0 1px #f08a3c66, 0 0 14px -4px var(--brass-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { border-color: var(--line-2); }
  .btn.sm { padding: 4px 9px; font-size: 12px; }

  /* ---------- Content ---------- */
  .content {
    padding: 20px;
    max-width: 1500px;
    width: 100%;
  }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px; gap: 24px;
  }
  .page-title {
    font-family: var(--serif); font-weight: 600; font-size: var(--t-masthead); letter-spacing: -.012em; margin: 0;
  }
  .page-kicker {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 6px;
  }
  .page-sub { color: var(--ink-3); font-size: 13.5px; margin-top: 6px; max-width: 620px; }

  /* ---------- Command-strip hero ---------- */
  .command-strip {
    display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--gap-intra); align-items: stretch;
    margin-bottom: var(--gap-section);
  }
  .cs-primary .unit, .cs-secondary .unit { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin-left: 8px; font-weight: 400; }
  .cs-primary {
    background:
      radial-gradient(420px 140px at 0% 0%, #f08a3c14, transparent),
      linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--line-2);
    border-left: 3px solid var(--brass);
    border-radius: var(--r);
    box-shadow: inset 0 1px 0 #ffffff08;
    padding: 18px 20px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .cs-primary .cs-kpi {
    font-family: var(--sans); font-weight: 600; font-size: var(--t-kpi); line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .cs-primary .cs-kpi .unit { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin-left: 8px; font-weight: 400; }
  .cs-secondary {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--rule-1); border-radius: var(--r);
    padding: 16px; display: flex; flex-direction: column; justify-content: center;
  }
  .cs-secondary .cs-stat {
    font-family: var(--sans); font-weight: 600; font-size: var(--t-stat); line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .cs-secondary .cs-stat-label {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 8px;
  }
  /* KPI count-up flourish on first paint (600ms decel); static under reduced-motion */
  .cs-count-up { animation: csCountUp 600ms var(--ease-functional) both; }
  @keyframes csCountUp { from { opacity: 0; } to { opacity: 1; } }  /* opacity-only — no first-paint layout shift (PERF-7) */

  .grid { display: grid; gap: 14px; }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-overview { grid-template-columns: 2.4fr 1fr; }
  .g-onboarding { grid-template-columns: repeat(3,1fr); }
  .g-live-strip { grid-template-columns: auto 1fr auto auto auto; }
  .g-brief-row, .g-tracked-row, .g-threshold-row { grid-template-columns: 1fr auto; }
  .g-source-row { grid-template-columns: 1fr auto auto; }
  .g-live-main { grid-template-columns: 1.7fr 1fr; }
  .g-link-grid, .g-feed-form { grid-template-columns: 1fr 1fr; }
  .g-live-event { grid-template-columns: 56px 16px 1fr; }
  .g-qon-evidence { grid-template-columns: 130px 200px 1fr 90px; }
  .g-briefings { grid-template-columns: 280px 1fr; }
  .radar-row.g-radar-table { grid-template-columns: 1fr 100px 80px 120px 140px; }

  /* ---------- Panel — two-step elevation ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--rule-1);
    border-radius: var(--r);
    box-shadow: inset 0 1px 0 #ffffff08;   /* tonal lift, not a drop shadow (resident-panel tier) */
  }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule-1);
  }
  .panel-title { font-weight: 600; font-size: 14px; margin: 0; color: var(--ink); letter-spacing: .005em; }
  .h-drawer { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  .panel-kicker { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: .02em; }
  .panel-body { padding: 14px 16px; }
  .panel-foot { padding: 10px 16px; border-top: 1px solid var(--line); display:flex; align-items:center; gap:10px; }
  /* one cohesive rail: sections inside a single panel, hairline-separated */
  .panel-section { padding: 16px; border-bottom: 1px solid var(--rule-1); }
  .panel-section:last-child { border-bottom: 0; }
  .panel-section-head { display:flex; align-items:baseline; gap:10px; margin-bottom: 12px; }
  .panel-section-title { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-4); margin: 0; font-weight: 600; }

  /* ---------- Stat block ---------- */
  .stat {
    padding: 16px;
  }
  .stat-label { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--ink-4); text-transform: uppercase; letter-spacing: .18em; }
  .stat-value { font-family: var(--sans); font-size: var(--t-kpi); font-weight: 600; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat-value .unit { font-size: 13px; color: var(--ink-3); margin-left: 6px; font-family: var(--mono); }
  .stat-meta { margin-top: 6px; font-size: 12px; color: var(--ink-3); display:flex; align-items:center; gap: 8px; }
  /* optional trend slot — ember up, steel-ash down */
  .stat-trend.up { color: var(--brass); }
  .stat-trend.down { color: var(--info); }

  /* ---------- Signal Card ---------- */
  .signal {
    border: 1px solid var(--line-bright);
    border-radius: var(--r-lg);
    background: linear-gradient(160deg, var(--panel-2) 0%, var(--panel) 100%);
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
  }
  .signal:hover { border-color: var(--line-bright); box-shadow: 0 6px 24px -10px #00000090, 0 0 0 1px #ffffff12 inset; }
  .signal + .signal { margin-top: 10px; }

  .sig-head { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .sig-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  .sig-source { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .sig-time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); margin-left: auto; font-variant-numeric: tabular-nums; }

  .sig-title {
    font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.25;
    color: var(--ink); margin: 2px 0 6px;
  }
  .sig-sum { color: var(--ink-2); font-size: var(--t-body-sm); }

  .sig-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-family: var(--mono); font-size: 10.5px;
    padding: 3px 8px; border-radius: 4px;
    background: var(--hover-surface); border: 1px solid var(--line-2); color: var(--ink-3);
    text-transform: none;
  }
  .tag.brass { color: var(--brass); border-color: #f08a3c33; background: #f08a3c0f; }
  .tag.teal  { color: var(--teal);  border-color: #45b3a433; background: #45b3a40f; }
  .tag.amber { color: var(--caution); border-color: #d4a01733; background: #d4a0170f; }
  .tag.red   { color: var(--escalate); border-color: #f8717133; background: #f871710f; }
  .tag.info  { color: var(--info); border-color: #9aa6b033; background: #9aa6b00f; }

  .sig-action {
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--rule-2);
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: center;
  }
  .sig-action-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em;
  }
  .sig-action-value { font-size: var(--t-body-sm); color: var(--ink); font-weight: 500; }
  .sig-action-reason { grid-column: 1 / -1; color: var(--ink-3); font-size: var(--t-body-sm); font-style: italic; }

  /* attention pill — fire-to-ash ramp */
  .att {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em;
    padding: 3px 8px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .att::before { content:""; width:6px; height:6px; border-radius:50%; }
  .att.high { color: #ef6a5e; background: #e0534b1a; border: 1px solid #e0534b40; }
  .att.high::before { background: #ef6a5e; }
  .att.med { color: var(--caution); background: #d4a0171a; border: 1px solid #d4a01740; }
  .att.med::before { background: var(--caution); }
  .att.low { color: var(--info); background: #9aa6b01a; border: 1px solid #9aa6b040; }
  .att.low::before { background: var(--info); }
  /* Light theme: the dark coral #ef6a5e fails AA on warm paper (~2.8:1); darken to ~6:1 (A11Y-9). */
  [data-theme="light"] .att.high { color: #b02a20; background: rgba(192,57,47,.10); border-color: rgba(192,57,47,.30); }
  [data-theme="light"] .att.high::before { background: #b02a20; }

  /* confidence bar — 5-segment ember-to-gold gradient */
  .conf {
    display: inline-flex; align-items: center; gap: 2px;
  }
  .conf span { width: 6px; height: 11px; background: var(--line-2); border-radius: 1px; }
  /* single sovereign accent at stepped opacity reads quantitatively without a 5-hue ramp */
  .conf span.on { background: var(--brass); }
  .conf span.on:nth-child(1) { opacity: .45; }
  .conf span.on:nth-child(2) { opacity: .6; }
  .conf span.on:nth-child(3) { opacity: .75; }
  .conf span.on:nth-child(4) { opacity: .9; }
  .conf span.on:nth-child(5) { opacity: 1; }

  /* ---------- Table ---------- */
  table.ds { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.ds th, table.ds td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  table.ds th {
    font-family: var(--mono); font-size: 10px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; font-weight: 600;
    background: var(--soft-surface); position: sticky; top: 0;
    box-shadow: inset 0 -1px 0 var(--rule-1);
  }
  table.ds tbody tr { cursor: pointer; }
  table.ds tbody tr:hover { background: var(--soft-surface); }
  table.ds td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before {
    content:""; position:absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line-2);
  }
  .tl-item { position: relative; padding: 4px 0 12px; }
  .tl-item::before {
    content:""; position:absolute; left: -18px; top: 8px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--brass);
  }
  .tl-item.teal::before { border-color: var(--teal); }
  .tl-item.info::before { border-color: var(--info); }
  .tl-time { font-family: var(--mono); font-size: 10px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .14em; }
  .tl-body { color: var(--ink-2); font-size: 13px; margin-top: 2px; }

  /* ---------- Drawer ---------- */
  .drawer-back {
    position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 40;
  }
  .drawer-back.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 580px; max-width: 95vw;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border-left: 1px solid var(--line-2);
    transform: translateX(100%); transition: transform var(--dur-page) var(--ease-entrance);
    z-index: 50; display: flex; flex-direction: column;
    box-shadow: -20px 0 60px var(--overlay-shadow);
  }
  .drawer.on { transform: translateX(0); }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--bg); }

  .drawer-section { margin-bottom: 26px; }
  .drawer-section h3 {
    font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-3);
    letter-spacing: .04em; margin: 0 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--rule-2);
  }
  .drawer-section p { margin: 0; color: var(--ink-2); font-size: var(--t-body-sm); line-height: 1.55; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; font-size: var(--t-body-sm); }
  .kv dt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .1em; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--ink); }

  .feedback-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .fb.affirmative {
    border-color: color-mix(in srgb, var(--teal) 55%, transparent);
    color: var(--teal);
    background: color-mix(in srgb, var(--teal) 12%, transparent);
  }
  .fb.affirmative.on {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--bg);
  }
  .fb {
    font-family: var(--sans); font-size: 12px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--soft-surface); color: var(--ink-2);
    transition: background .1s, border-color .1s, color .1s;
  }
  .fb:hover { background: var(--hover-surface); color: var(--ink); }
  .fb.on { background: #f08a3c14; border-color: #f08a3c55; color: var(--brass); animation: fbSelect 180ms ease-out; }
  .fb.affirmative.on {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--bg);
  }
  @keyframes fbSelect { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.06); } }

  /* ---------- Radar ---------- */
  .radar-row { display: grid; grid-template-columns: 1fr 80px 100px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .radar-row:last-child { border-bottom: 0; }
  .bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--brass); }  /* priority/score metric — ember, not teal (teal is verification-only) */
  .spark { display: flex; gap: 2px; align-items: end; height: 22px; }
  .spark span { width: 5px; background: var(--teal-soft); border-radius: 1px; }

  /* ---------- Pattern card ---------- */
  .pattern {
    border: 1px solid #f08a3c44;
    background:
      radial-gradient(400px 120px at 0% 0%, #f08a3c14, transparent),
      linear-gradient(180deg, var(--panel-2), var(--panel));
    border-radius: var(--r-lg);
    padding: 16px 18px;
    position: relative;
  }
  .pattern .ribbon {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--brass); background: #f08a3c14; border: 1px solid #f08a3c55;
    padding: 3px 8px; border-radius: 4px;
  }

  /* ---------- Watchlist chip ---------- */
  .wl {
    border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 14px; background: #ffffff03;
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer;
  }
  .wl:hover { border-color: var(--line-bright); }
  .wl-name { font-weight: 500; font-size: 13.5px; }
  .wl-meta { font-size: 11.5px; color: var(--ink-3); display:flex; gap: 10px; font-family: var(--mono); }

  /* Progress ring placeholder */
  .ring {
    width: 40px; height: 40px; border-radius: 50%;
    background: conic-gradient(var(--brass) calc(var(--p,70)*1%), var(--line-2) 0);
    display: grid; place-items: center;
  }
  .ring::after {
    content: attr(data-p)"%"; color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel); display: grid; place-items: center;
    font-family: var(--mono); font-size: 10px;
  }

  /* ---------- Brief preview — warm paper, gold accent ---------- */
  :root { --brief-bg: #f4efe4; --brief-ink: #1a1208; --brief-accent: #6f5418; --brief-link: #5a4310; }
  :root[data-theme="light"] { --brief-bg: #f4efe4; --brief-ink: #1a1208; --brief-accent: #6f5418; --brief-link: #5a4310; }
  .brief {
    background: var(--brief-bg); color: var(--brief-ink);
    border-radius: 10px; padding: 18px 20px;
    font-family: var(--serif); font-size: 13.5px; line-height: 1.55;
    box-shadow: inset 0 0 0 1px #00000014;
  }
  .brief h5 { margin: 12px 0 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--brief-accent); }
  .brief h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 20px; font-weight: 600; }
  .brief .meta { font-family: var(--mono); font-size: 10.5px; color: var(--brief-accent); }
  .brief ul { margin: 4px 0 0; padding-left: 18px; }

  .linklike {
    appearance: none; background: none; border: 0; padding: 0;
    color: inherit; font: inherit; text-decoration: underline; cursor: pointer;
  }
  .linklike:hover { color: var(--teal); }

  /* source health dot */
  .hdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align: middle; }
  .hdot.live { background: var(--ok); }
  .hdot.delayed { background: var(--caution); transform: rotate(45deg); border-radius: 1px; }  /* diamond — shape redundancy for deuteranopia */
  .hdot.broken { background: var(--escalate); border-radius: 2px; }  /* square — distinct from live circle */
  .hdot.stale  { background: var(--ink-4); }
  .hdot.review { background: var(--info); }

  /* inline SVG icons */
  .ico { display: inline-block; vertical-align: middle; }

  /* Fade page switches */
  .page { animation: fadeIn var(--dur-page) var(--ease-entrance) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }  /* opacity-only — page switches no longer shift content (PERF-7) */

  /* Skeleton shimmer — loading state */
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position:  200% center; }
  }
  .skeleton {
    display: block;
    background: linear-gradient(90deg, var(--panel) 0%, var(--line-2) 40%, #ffffff22 50%, var(--line-2) 60%, var(--panel) 100%);
    background-size: 200% 100%;
    animation: shimmer 2.4s linear infinite;  /* slower + linear — less frenetic */
    border-radius: 4px;
  }

  /* Focus-visible ring — keyboard accessibility */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
  .search input:focus-visible { outline: none; }

  /* Signal card attention-level left border — status spine */
  .signal[data-att="high"] { border-left: 4px solid var(--ember-flash); background: linear-gradient(160deg, #1f1614 0%, var(--panel) 100%); }
  .signal[data-att="med"]  { border-left: 4px solid var(--caution); }
  .signal[data-att="low"]  { border-left: 4px solid var(--info); }

  /* Signal card hover lift — reduced, ember-tinted shadow */
  .signal { transition: border-color var(--dur-micro) var(--ease-functional), box-shadow var(--dur-micro) var(--ease-functional), transform var(--dur-micro) var(--ease-functional); }
  .signal:hover { box-shadow: 0 6px 22px -8px var(--accent-ring), 0 4px 18px -10px var(--search-shadow); transform: translateY(-1px); }

  /* Modal-ish tester */
  .feed-test {
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 14px; font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  }
  .feed-test-line { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .feed-test .ok { color: var(--ok); }
  .feed-test .warn { color: var(--caution); }
  .feed-test .err { color: var(--escalate); }

  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

  .empty { color: var(--ink-4); font-style: italic; font-size: var(--t-body-sm); padding: 12px 0; }
  .empty-state {
    display: flex; align-items: center; gap: var(--sp-3);
    color: var(--ink-3); padding: var(--sp-5) 0;
  }
  .empty-state.error {
    padding: var(--sp-4);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    background: var(--panel-hi);
    align-items: flex-start;
  }
  .empty-kicker {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600;
    color: var(--ink-4); letter-spacing: .18em; text-transform: uppercase;
  }
  .empty-body { font-size: var(--t-body-sm); color: var(--ink-2); margin-top: 2px; }
  .empty-action { margin-left: auto; }

  /* Print — brief only */
  @media print {
    .side, .topbar, .drawer-back, .drawer, .modal-back, .toast-wrap { display: none !important; }
    .main { display: block; }
    .content { padding: 0; max-width: 100%; }
    body { background: #fff; color: #1a1814; font-size: 12pt; }
    .brief { background: #fff; color: #1a1814; box-shadow: none; border: 1px solid #ccc; }
    .brief h3 { font-size: 16pt; }
    .brief h5 { font-size: 9pt; }
    a { color: #1a1814; }
  }

  /* Responsive ish */
  @media (max-width: 1100px) {
    .g-4 { grid-template-columns: repeat(2, 1fr); }
    .g-overview { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .chip.sources-chip, .shortcut-btn { display: none !important; }
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .nav-toggle { display: inline-flex; }
    .mobile-nav-back { display: block; }
    .side {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(82vw, 320px);
      height: 100vh;
      z-index: 50;
      transform: translateX(-104%);
      transition: transform var(--dur-page) var(--ease-entrance);
      box-shadow: 20px 0 60px var(--overlay-shadow);
    }
    .side.mobile-open { transform: translateX(0); }
    .side .nav { display: block; overflow-y: auto; padding: 10px 8px; }
    .side .nav-group { display: block; }
    .side .nav-item { white-space: normal; }
    .side-foot { display: flex; }
    .g-2, .g-3 { grid-template-columns: 1fr; }
    /* Collapse every multi-column grid to one column. */
    .command-strip, .live-strip { grid-template-columns: 1fr; }
    .content .grid { grid-template-columns: 1fr !important; }
    .g-onboarding, .g-live-strip, .g-brief-row, .g-tracked-row, .g-threshold-row,
    .g-source-row, .g-live-main, .g-link-grid, .g-feed-form, .g-live-event,
    .g-qon-evidence, .g-briefings { grid-template-columns: 1fr !important; }
    .radar-row { grid-template-columns: 1fr !important; gap: 4px !important; }
    /* Mobile triage focus: lead with the priority hero + signals; defer secondary KPIs and the context rail. */
    .command-strip .cs-secondary { display: none; }
    .g-overview > div:last-child { display: none; }
    /* Overlays go full width on phones (UX-3/UX-5). */
    .drawer { width: 100% !important; max-width: 100% !important; }
    .modal { max-width: 100% !important; }
    .modal-back { padding: 12px !important; }
    .chip.live-chip { display: none !important; }
    .search { max-width: 240px; }
    .top-right { flex-wrap: wrap; gap: 6px; }
  }

  /* ---- Modal ---- */
  .modal-back {
    position: fixed; inset: 0; background: var(--scrim-strong); backdrop-filter: blur(3px);
    z-index: 60; display: grid; place-items: center; padding: 40px;
    animation: fadeIn .18s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .modal {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line-2); border-radius: 14px;
    width: 100%; max-width: 860px; max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 50px 100px var(--scrim-strong), inset 0 0 0 1px #ffffff08;
  }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display:flex; align-items:flex-start; gap:14px; }
  .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 12px 22px; border-top: 1px solid var(--line); display:flex; gap:10px; background: var(--bg); }

  /* ---- Live video ---- */
  .live-wrap {
    position: relative; border-radius: 10px; overflow: hidden;
    background: #000; aspect-ratio: 16 / 9;
    border: 1px solid var(--line-2);
  }
  .live-wrap iframe { width:100%; height:100%; border:0; display:block; }
  .live-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 4px; color: #fff;
    background: var(--ember-flash); box-shadow: 0 0 0 3px #e0534b40;
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* ember LIVE pulse — the one Prometheus flourish */
  .live-badge .pulse { width:6px; height:6px; border-radius:50%; background:#fff; animation: emberPulse 1.6s ease-in-out infinite; }
  @keyframes emberPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .src-badge {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    display:inline-flex; align-items:center; gap:5px;
    padding: 2px 7px; border: 1px solid var(--line-2); border-radius: 4px;
    background: #ffffff03;
  }

  /* clickable chip */
  .clk { cursor: pointer; transition: background .12s, border-color .12s; }
  .clk:hover { background: #ffffff08; border-color: var(--line-bright); }

  /* Live now strip — ember-lit, static spine (no perpetual pulse; one pulse per viewport lives in the topbar) */
  .live-strip {
    background: linear-gradient(90deg, #1a1108 0%, var(--panel) 40%, var(--panel) 100%);
    border: 1px solid var(--line-2);
    border-left: 3px solid var(--ember-flash);
    border-radius: 10px;
  }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line-bright);
    color: var(--ink); padding: 10px 14px; border-radius: 8px;
    font-size: var(--t-body-sm); box-shadow: 0 14px 38px var(--search-shadow);
    animation: toastIn .2s cubic-bezier(0.25,0.46,0.45,0.94);
    display: inline-flex; align-items: center; gap: 8px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .toast .tok { color: var(--ok); }
  .toast .tbr { color: var(--brass); }
  .toast.toast-err { border-color: #f8717155; background: #1a1110; }
  .toast-act { background: none; border: 1px solid var(--line-bright); color: var(--brass); border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-family: var(--sans); margin-left: 6px; }
  .toast-act:hover { background: #f08a3c1a; }

  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;

  .sr-item .k { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }

  .btn:active { transform: translateY(1px); filter: brightness(0.93); }

    case "gauge":      return <svg {...props}><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/><circle cx="12" cy="18" r="1.2" fill={stroke} stroke="none"/></svg>;
    default: return <svg {...props}><circle cx="12" cy="12" r="9"/></svg>;
  }
};

Object.assign(window, { Icon });

</script>

<script type="text/babel">
// ---- Global store: persistent state for real interactivity ----
const StoreCtx = React.createContext(null);

function useStore() { return React.useContext(StoreCtx); }

// Canonical default shape. Returning users from older builds may have saved
// state that is missing newer keys, so every read merges over this object.
const STORE_DEFAULTS = {
  owners: {}, // { entityId: ownerName }
  feedback: {}, // { signalId: { label, reason, ts } }
  archived: {}, // { signalId: true }
  briefsGenerated: {}, // { signalId: { ts, type } }
  watchlistAdds: {}, // { entityKey: true }
  watchlistCreated: [], // extra watchlists
  feeds: [], // extra custom feeds
  notes: {}, // { signalId: "text" }
};

// Merge a parsed blob over the defaults. Top-level keys are taken from the saved
// blob where present; the nested object keys (notes, feeds, owners, feedback,
// watchlistCreated and the rest) are coerced back to their default type so a
// corrupt or partial save can never crash a render that spreads or maps them.
function hydrateState(parsed) {
  if (!parsed || typeof parsed !== "object") return { ...STORE_DEFAULTS };
  const merged = { ...STORE_DEFAULTS, ...parsed };
  for (const key of Object.keys(STORE_DEFAULTS)) {
    const def = STORE_DEFAULTS[key];
    const val = parsed[key];
    if (Array.isArray(def)) {
      merged[key] = Array.isArray(val) ? val : [];
    } else if (def && typeof def === "object") {
      merged[key] = (val && typeof val === "object" && !Array.isArray(val)) ? { ...def, ...val } : { ...def };
    }
  }
  merged.watchlistCreated = merged.watchlistCreated.map(w => ({
    ...w,
    trend: Array.isArray(w.trend) ? w.trend : [],
    matches: Number.isFinite(Number(w.matches)) ? Number(w.matches) : 0,
    keywords: Number.isFinite(Number(w.keywords)) ? Number(w.keywords) : 0,
  }));
  return merged;
}

// Explicit keyword and tag lists per watchlist name, so signal matching is
// stable rather than relying on the first word of the watchlist name. Keys are
// the canonical WATCHLISTS names. Created watchlists fall back to a tokenised
// match on their own name (see watchlistKeywords).
const WATCHLIST_KEYWORDS = {
  "Digital government": ["digital", "service delivery", "myGov", "platform"],
  "AI & automation": ["ai", "automation", "automated", "assurance", "algorithm", "machine learning"],
  "Cyber security": ["cyber", "security", "breach", "ransomware", "incident"],
  "Digital identity": ["digital id", "identity", "credential", "verification"],
  "Data sharing & privacy": ["data", "privacy", "sharing", "consent", "personal information"],
  "Procurement": ["procurement", "contract", "tender", "consultancy"],
  "Service delivery": ["service delivery", "service", "client", "channel"],
  "Infrastructure & connectivity": ["infrastructure", "connectivity", "network", "5g", "broadband"],
  "Health digital systems": ["health", "ehealth", "medical", "telehealth"],
  "Parliamentary scrutiny": ["scrutiny", "estimates", "committee", "inquiry", "tabled"],
  "Estimates preparation": ["estimates", "budget", "appropriation", "portfolio"],
  "Queensland federal signals": ["queensland", "qld", "brisbane", "state"],
};

// Resolve the keyword list for any watchlist. Canonical lists win; created
// watchlists tokenise their own name into match terms.
function watchlistKeywords(w) {
  const explicit = WATCHLIST_KEYWORDS[w.name];
  if (explicit && explicit.length) return explicit;
  if (Array.isArray(w.keywordList) && w.keywordList.length) return w.keywordList;
  return w.name.toLowerCase().split(/\s+|&/).map(t => t.trim()).filter(t => t.length > 2);
}

// Count signals matching a watchlist by tag against the keyword list.
function watchlistMatches(w) {
  const terms = watchlistKeywords(w);
  if (typeof SIGNALS === "undefined" || !Array.isArray(SIGNALS)) return [];
  return SIGNALS.filter(s => (s.tags || []).some(t => {
    const label = (t.l || "").toLowerCase();
    return terms.some(term => label.includes(term.toLowerCase()));
  }));
}

function StoreProvider({ children, navigate = () => {} }) {
  // Owners assigned to signals/bills, feedback given, watchlist additions, toasts
  const [state, setState] = React.useState(() => {
    try {
      const raw = localStorage.getItem("cs-state-v1");
      if (raw) return hydrateState(JSON.parse(raw));
    } catch(e){
      // Corrupt or incompatible saved state. Fall through to defaults so the
      // app still loads rather than throwing on hydration.
    }
    return { ...STORE_DEFAULTS };
  });

  React.useEffect(() => {
    try { localStorage.setItem("cs-state-v1", JSON.stringify(state)); } catch(e){}
  }, [state]);

  const [toasts, setToasts] = React.useState([]);
  const toast = React.useCallback((msg, kind = "ok", action = null) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, kind, action }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), action ? 5000 : 2800);
  }, []);

  const [modal, setModal] = React.useState(null); // { type, id }
  const openModal = React.useCallback((type, id) => setModal({ type, id }), []);
  const closeModal = React.useCallback(() => setModal(null), []);

  const [signalId, setSignalId] = React.useState(null);
  const openSignal = React.useCallback(s => setSignalId(typeof s === "string" ? s : s?.id), []);
  const closeSignal = React.useCallback(() => setSignalId(null), []);
  const [visibleSignalOrder, setVisibleSignalOrder] = React.useState(null);
  const [signalSearchQuery, setSignalSearchQuery] = React.useState("");
  const pendingLiveRefreshRef = React.useRef(false);
  const requestLiveRefresh = React.useCallback(() => { pendingLiveRefreshRef.current = true; }, []);
  const consumeLiveRefresh = React.useCallback(() => {
    const pending = pendingLiveRefreshRef.current;
    pendingLiveRefreshRef.current = false;
    return pending;
  }, []);

  React.useEffect(() => {
    const prev = document.body.style.overflow;
    if (modal || signalId) document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [modal, signalId]);

  const assignOwner = React.useCallback((entityId, owner) => {
    setState(s => ({ ...s, owners: { ...s.owners, [entityId]: owner } }));
    toast(`Assigned ${owner} as policy owner`);
  }, [toast]);
  const saveFeedback = React.useCallback((signalId, label, reason) => {
    // The feedback chip's inline .on state is the single confirmation (UX-13); no toast.
    setState(s => ({ ...s, feedback: { ...s.feedback, [signalId]: { label, reason, ts: Date.now() } } }));
  }, []);
  const unarchive = React.useCallback((signalId) => {
    setState(s => { const n = { ...s.archived }; delete n[signalId]; return { ...s, archived: n }; });
  }, []);
  const archive = React.useCallback((signalId) => {
    let remaining = 0;
    setState(s => {
      const archived = { ...s.archived, [signalId]: true };
      // Compute the count from the NEXT state so rapid successive archives do
      // not read a stale snapshot. Clamp at 0 for safety.
      remaining = Math.max(0, SIGNALS.filter(x => !archived[x.id]).length);
      return { ...s, archived };
    });
    const msg = remaining > 0 ? `${signalId} archived · ${remaining} remaining` : "All signals reviewed";
    toast(msg, "ok", { label: "Undo", fn: () => unarchive(signalId) });
  }, [toast, unarchive]);
  const addWatchlist = React.useCallback((key) => {
    // Persist the flag and report the real running count so the action is
    // observable, not a bare success toast. The flag survives reload and can
    // be read back via state.watchlistAdds.
    let total = 0;
    let already = false;
    setState(s => {
      if (s.watchlistAdds[key]) {
        already = true;
        total = Object.keys(s.watchlistAdds).length;
        return s;
      }
      const watchlistAdds = { ...s.watchlistAdds, [key]: true };
      total = Object.keys(watchlistAdds).length;
      return { ...s, watchlistAdds };
    });
    toast(already ? "Already on watchlist" : `Saved to watchlist, ${total} tracked`, "brass");
  }, [toast]);
  const isWatched = React.useCallback((key) => !!state.watchlistAdds[key], [state.watchlistAdds]);
  const removeWatchlist = React.useCallback((key) => {
    setState(s => {
      const watchlistAdds = { ...s.watchlistAdds };
      delete watchlistAdds[key];
      return { ...s, watchlistAdds };
    });
    toast("Removed from watchlist", "brass");
  }, [toast]);
  const createWatchlist = React.useCallback((name) => {
    // Seed sensibly: derive keyword terms from the name and compute real match
    // counts against the current signal stream so a new watchlist is not a dead
    // zero row. trend is left flat and the entry is flagged new for the UI.
    const keywordList = name.toLowerCase().split(/\s+|&/).map(t => t.trim()).filter(t => t.length > 2);
    const matches = watchlistMatches({ name, keywordList }).length;
    const entry = {
      name,
      keywordList,
      keywords: keywordList.length,
      matches,
      trend: [0, 0, 0, 0, 0, 0, matches],
      created: true,
    };
    setState(s => ({ ...s, watchlistCreated: [...s.watchlistCreated, entry] }));
    toast(`Watchlist "${name}" created`, "brass");
  }, [toast]);
  const generateBrief = React.useCallback((signalId, type) => {
    setState(s => ({ ...s, briefsGenerated: { ...s.briefsGenerated, [signalId]: { ts: Date.now(), type } } }));
  }, []);
  const addFeed = React.useCallback((feed) => {
    setState(s => ({ ...s, feeds: [...s.feeds, feed] }));
    toast(`Feed added: ${feed.name}`, "brass");
  }, [toast]);
  const saveNote = React.useCallback((signalId, text) => {
    setState(s => ({ ...s, notes: { ...s.notes, [signalId]: text } }));
  }, []);

  const storeValue = React.useMemo(() => ({
      state, setState, toast, toasts,
      modal, openModal, closeModal,
      signalId, openSignal, closeSignal,
      visibleSignalOrder, setVisibleSignalOrder,
      signalSearchQuery, setSignalSearchQuery,
      requestLiveRefresh, consumeLiveRefresh,
      navigate,
      assignOwner, saveFeedback, archive, unarchive,
      addWatchlist, removeWatchlist, isWatched, createWatchlist, generateBrief, addFeed, saveNote,
  }), [
    state, toasts, toast,
    modal, openModal, closeModal,
    signalId, openSignal, closeSignal,
    visibleSignalOrder, signalSearchQuery,
    requestLiveRefresh, consumeLiveRefresh,
    navigate, assignOwner, saveFeedback, archive, unarchive,
    addWatchlist, removeWatchlist, isWatched, createWatchlist, generateBrief, addFeed, saveNote,
  ]);

  return (
    <StoreCtx.Provider value={storeValue}>
      {children}
      <div className="toast-wrap" aria-live="polite" aria-atomic="false">
        {toasts.map(t => (
          <div
            key={t.id}
            className={"toast" + (t.kind === "error" ? " toast-err" : "")}
            style={{
              border: "1px solid var(--line-bright)",
              borderLeft: "3px solid " + (t.kind === "error" ? "var(--ember-flash)" : "var(--brass)"),
            }}
          >
            <Icon
              name={t.kind === "error" ? "close" : "check"}
              size={14}
              stroke={t.kind === "error" ? "var(--ember-flash)" : t.kind === "brass" ? "var(--brass)" : "var(--ok)"}
            />
            <span>{t.msg}</span>
            {t.action && (
              <button className="toast-act" onClick={() => { t.action.fn(); setToasts(ts => ts.filter(x => x.id !== t.id)); }}>
                {t.action.label}
              </button>
            )}
          </div>
        ))}
      </div>
    </StoreCtx.Provider>
  );
}

// ---- Detail Modal: renders per entity type ----
function DetailModal() {
  const { modal, closeModal, openModal, state, assignOwner, addWatchlist, openSignal } = useStore();
  const prevFocusRef = React.useRef(null);
  const closeButtonRef = React.useRef(null);
  const titleId = React.useId();

  React.useEffect(() => {
    if (!modal) return;
    const h = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeModal(); } };
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, [modal, closeModal]);

  React.useEffect(() => {
    if (!modal) return;
    prevFocusRef.current = document.activeElement;
    requestAnimationFrame(() => closeButtonRef.current?.focus());
    return () => {
      prevFocusRef.current?.focus?.();
      prevFocusRef.current = null;
    };
  }, [modal]);

  React.useEffect(() => {
    if (!modal) return;
    const trap = (e) => {
      if (e.key !== "Tab") return;
      const modalEl = closeButtonRef.current?.closest(".modal");
      if (!modalEl) return;
      const focusable = Array.from(modalEl.querySelectorAll("button, [href], input, textarea, select, [tabindex]:not([tabindex='-1'])")).filter(el => !el.disabled);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
    };
    document.addEventListener("keydown", trap);
    return () => document.removeEventListener("keydown", trap);
  }, [modal]);

  if (!modal) return null;
  const { type, id } = modal;

  const render = () => {
    if (type === "committee") return <CommitteeDetail id={id} />;
    if (type === "bill") return <BillDetail id={id} />;
    if (type === "member") return <MemberDetail id={id} />;
    if (type === "minister") return <MinisterDetail id={id} />;
    if (type === "division") return <DivisionDetail id={id} />;
    if (type === "feed") return <FeedDetail id={id} />;
    if (type === "watchlist") return <WatchlistDetail id={id} />;
    if (type === "radar") return <RadarDetail id={id} />;
    if (type === "inquiry") return <InquiryDetail id={id} />;
    if (type === "hearing") return <HearingDetail data={id} />;
    return <div>Unknown</div>;
  };

  return (
    <div className="modal-back" onClick={closeModal}>
      <div
        className="modal"
        onClick={e => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
        aria-labelledby={titleId}
        style={{
          border: "1px solid var(--line-bright)",
          boxShadow: "0 1px 0 #00000060, 0 40px 90px -32px #000000bf, inset 0 0 0 1px #ffffff08",
        }}
      >
        {React.cloneElement(render(), { titleId, closeButtonRef })}
      </div>
    </div>
  );
}

function WatchlistDetail({ id, titleId, closeButtonRef }) {
  const { closeModal, toast, state } = useStore();
  // F2: resolve against the merged list so user-created watchlists open their
  // detail rather than a "Not found" modal.
  const all = [...WATCHLISTS, ...(state.watchlistCreated || [])];
  const w = all.find(x => x.name === id);
  if (!w) return <ModalHead kicker="Watchlist" title="Not found" titleId={titleId} closeButtonRef={closeButtonRef} />;
  // F2: guard the spark divisor so an all-zero trend cannot divide by zero.
  const trend = Array.isArray(w.trend) ? w.trend : [];
  const max = Math.max(...trend, 1);
  // F16: stable keyword matching against signal tags, not a name-prefix substring.
  const matchingSignals = watchlistMatches(w).slice(0, 3);
  return (
    <>
      <ModalHead kicker={w.created ? "Watchlist · New" : "Watchlist"} title={w.name} representative={!!w.representative} titleId={titleId} closeButtonRef={closeButtonRef} />
      <div className="modal-body">
        {w.created && (
          <div className="empty" style={{marginBottom:14}}>Created watchlist. Keyword matching runs against the current signal stream. Trend builds as new signals arrive.</div>
        )}
        <div className="grid g-3" style={{gap:12}}>
          <div className="panel stat"><div className="stat-label">Matches</div><div className="stat-value" style={{fontSize:26}}>{w.matches}</div></div>
          <div className="panel stat"><div className="stat-label">Keywords</div><div className="stat-value" style={{fontSize:26}}>{w.keywords}</div></div>
          <div className="panel stat"><div className="stat-label">7-day trend</div>
            <div className="spark" style={{marginTop:8}}>{trend.map((v,i) => <span key={i} style={{height:(v/max*24+3)+"px"}}/>)}</div>
          </div>
        </div>
        <h3 className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em", marginTop:18, marginBottom:6}}>Matching signals</h3>
        {matchingSignals.length === 0 && <div className="empty">No matching signals in the current stream.</div>}
        {matchingSignals.map(s => (
          <div key={s.id} style={{padding:"8px 12px", border:"1px solid var(--line-2)", borderRadius:8, marginBottom:6}}>
            <div style={{fontSize:12.5, fontWeight:500}}>{s.title}</div>
            <div className="mono" style={{fontSize:10.5, color:"var(--ink-4)", marginTop:2}}>{s.id} · {s.source}</div>
          </div>
        ))}
      </div>
      <div className="modal-foot">
        <button className="btn ghost" onClick={() => { toast("Watchlist digest sent (demo)", "brass"); closeModal(); }}>Send digest</button>
        <button className="btn" onClick={() => toast("Configuration saved")}>Edit</button>
      </div>
    </>
  );
}

      </div>

}

Object.assign(window, { StoreProvider, useStore, DetailModal, watchlistKeywords, watchlistMatches });

<script type="text/babel">
// Shell: Sidebar, Topbar (with working global search), SignalCard, Drawer

const IS_MAC = /Mac|iPad/i.test(navigator.platform);

function fmtClock() {
  return new Date().toLocaleTimeString("en-AU", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function TopClock() {
  const [clock, setClock] = React.useState(fmtClock);
  React.useEffect(() => {
    const id = setInterval(() => setClock(fmtClock()), 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <span className="mono top-clock" aria-label="Local time" title="Local time" style={{fontSize:12, color:"var(--ink-3)", letterSpacing:".06em", fontVariantNumeric:"tabular-nums"}}>
      {clock}
    </span>
  );
}

function DesignStateBanner() {
  const key = "pp-design-banner-dismissed";
  const [visible, setVisible] = React.useState(() => !sessionStorage.getItem(key));
  if (!visible) return null;
  return (
    <div className="design-banner" role="status">
      <Icon name="signal" size={14} stroke="var(--brass)" />
      <span><strong>Design state.</strong> All signals and intelligence outputs are fixture data included for demonstration. No live analysis has occurred. </span>
      <button aria-label="Dismiss notice" onClick={() => { sessionStorage.setItem(key, "1"); setVisible(false); }}>×</button>
    </div>
  );
}

function EmptyState({ icon = "signal", kicker = "Empty", children, action, variant = "default" }) {
  return (
    <div className={"empty-state" + (variant === "error" ? " error" : "")}>
      <Icon name={icon} size={15} stroke={variant === "error" ? "var(--caution)" : "var(--ink-4)"} />
      <div>
        <div className="empty-kicker">{kicker}</div>
        <div className="empty-body">{children}</div>
      </div>
      {action && <div className="empty-action">{action}</div>}
    </div>

}

function SkeletonRow() {

    <div className="g-live-event" style={{display:"grid", gap:10, padding:"12px 8px", borderBottom:"1px solid var(--line)", alignItems:"start"}}>
      <span className="skeleton" style={{height:12, width:36}}/>
      <span className="skeleton" style={{height:14, width:14, borderRadius:"50%"}}/>
      <div>
        <span className="skeleton" style={{height:13, width:"80%", marginBottom:7}}/>
        <span className="skeleton" style={{height:10, width:"45%"}}/>

function SkeletonCard() {

      <span className="skeleton" style={{height:18, width:"72%", marginBottom:10}}/>
      <span className="skeleton" style={{height:13, width:"92%", marginBottom:7}}/>
      <span className="skeleton" style={{height:13, width:"56%"}}/>
