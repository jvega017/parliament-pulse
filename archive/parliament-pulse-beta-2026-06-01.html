const NAV = [
  { id: "overview", label: "Overview", group: "Today", count: 12 },
  { id: "live", label: "Live parliament", group: "Today", count: null, live: true },
  { id: "signals", label: "All signals", group: "Today", count: 6 },
  { id: "radar", label: "Attention radar", group: "Today", count: 6 },
  { id: "committees", label: "Committees", group: "Workspace", count: 7 },
  { id: "bills", label: "Bills intelligence", group: "Workspace", count: 5 },
  { id: "parliament", label: "Daily program", group: "Workspace", count: 3 },
  { id: "patterns", label: "QON patterns", group: "Workspace", count: 1 },
  { id: "briefings", label: "Briefings", group: "Workspace", count: 4 },
  { id: "watchlists", label: "Watchlists", group: "Workspace", count: 12 },
  { id: "sources", label: "Sources", group: "Workspace", count: sourceCounts().total },
];

const ICONS = {
  overview: "overview", radar: "radar", committees: "committee", bills: "bill",
  parliament: "parliament", patterns: "pattern", briefings: "brief",
  watchlists: "watch", sources: "sources", live: "signal", signals: "signal",
};

function Sidebar({ page, onNavigate, mobileOpen }) {
  const { state } = useStore();
  const navCount = React.useMemo(() => {
    const active = SIGNALS.filter(s => !state.archived[s.id]);
    return {
      overview: active.length,
      live: null,
      radar:    active.filter(s => s.attention !== "low").length,
      signals:  active.length,
      committees: COMMITTEE_ITEMS.length,
      bills: BILLS.length,
      parliament: DIVISIONS.length,
      patterns: QON_PATTERN.items.length,
      briefings: BRIEFING_QUEUE.length + Object.keys(state.briefsGenerated || {}).length,
      watchlists: WATCHLISTS.length + (state.watchlistCreated || []).length,
      sources: sourceCounts().total + (state.feeds || []).length,
    };
  }, [state.archived, state.briefsGenerated, state.watchlistCreated, state.feeds]);
  const groups = [...new Set(NAV.map(n => n.group))];
  // Streak: consecutive days the tool has been opened — reflection of practice, not gamification.
  // Compute the display value without side effects so the lazy initialiser is pure if dev StrictMode is added.
  const [streak, setStreak] = React.useState(() => {
    const today = new Date().toISOString().slice(0, 10);
    const last = localStorage.getItem("pp-last-open-date");
    const count = parseInt(localStorage.getItem("pp-streak-count") || "0");
    if (last === today) return count || 1;
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    const yStr = yest.toISOString().slice(0, 10);
    return (last === yStr) ? count + 1 : 1;
  });
  // F5: the localStorage WRITE runs after mount, so render itself cannot double-count or corrupt the streak.
  React.useEffect(() => {
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem("pp-last-open-date") === today) return;
    const count = parseInt(localStorage.getItem("pp-streak-count") || "0");
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    const yStr = yest.toISOString().slice(0, 10);
    const newCount = (localStorage.getItem("pp-last-open-date") === yStr) ? count + 1 : 1;
    localStorage.setItem("pp-streak-count", String(newCount));
    localStorage.setItem("pp-last-open-date", today);
    setStreak(newCount);
  }, []);
  return (
    <aside className={"side" + (mobileOpen ? " mobile-open" : "")}>
      <div className="brand">
        <div className="brand-mark">
          <svg width="26" height="26" viewBox="0 0 22 22" fill="none">
            {/* Prometheus flame — stylised, institutional */}
            <path d="M11 2 C 7 5, 6 9, 8 12 C 5 11, 4 13, 5 15 C 6 17, 9 18, 11 18 C 13 18, 16 17, 17 15 C 18 13, 17 11, 14 12 C 16 9, 15 5, 11 2 Z" fill="url(#flame)" opacity="0.95"/>
            <path d="M11 6 C 9 8, 9 11, 11 13 C 13 11, 13 8, 11 6 Z" fill="#fff" opacity="0.88"/>
            <defs>
              <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="var(--brass-2)"/>
                <stop offset="100%" stopColor="var(--brass)"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <div style={{display:"flex", alignItems:"center", gap:7}}>
            <div className="brand-name">Parliament Pulse</div>
            <span className="chip-fixture" style={{verticalAlign:"middle"}}>Beta</span>
          </div>
          <div className="brand-sub">Prometheus Policy Lab</div>
        </div>
      </div>
      <nav id="main-navigation" className="nav" aria-label="Main navigation">
        {groups.map(g => (
          <div key={g}>
            <div className="nav-group">{g}</div>
            {NAV.filter(n => n.group === g).map(n => (
              <div
                key={n.id}
                className={"nav-item" + (page === n.id ? " active" : "")}
                onClick={() => onNavigate(n.id)}
                role="button" tabIndex={0}
                aria-current={page === n.id ? "page" : undefined}
                onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onNavigate(n.id); } }}
              >
                <Icon name={ICONS[n.id]} size={15} className="ico" />
                <span>{n.label}</span>
                {n.live && <span className="count nav-live">LIVE</span>}
                {!n.live && navCount[n.id] !== null && <span className="count">{navCount[n.id]}</span>}
              </div>
            ))}
          </div>
        ))}
      </nav>
      <div className="side-foot">
        <div className="avatar">JV</div>
        <div style={{lineHeight:1.2}}>
          <div style={{fontSize:12.5, fontWeight:500}}>Juan Vega</div>
          <div style={{fontFamily:"var(--mono)", fontSize:10, color:"var(--ink-4)"}}>Principal Policy Officer · Futures & Foresight</div>
        </div>
      </div>
    </aside>
  );
}

function ShortcutHelp() {
  const [open, setOpen] = React.useState(false);
  const shortcuts = [
    ["j / k", "Navigate to next / previous signal"],
    ["Enter / Space", "Open focused signal or nav item"],
    ["Esc", "Close drawer or modal"],
    ["b", "Copy brief to clipboard (while signal open)"],
    ["w", "Add signal to watchlist (while signal open)"],
    ["a", "Archive signal and advance (while signal open)"],
    [IS_MAC ? "⌘K" : "Ctrl+K", "Focus global search"],
  ];
  return (
    <div style={{position:"relative"}}>
      <button className="btn ghost sm" title="Keyboard shortcuts" onClick={() => setOpen(o => !o)} aria-label="View keyboard shortcuts" aria-expanded={open}>
        <Icon name="pattern" size={13} />
      </button>
      {open && (
        <div style={{position:"absolute", top:"calc(100% + 8px)", right:0, background:"var(--panel-2)", border:"1px solid var(--line-bright)", borderRadius:10, boxShadow:"var(--shadow)", zIndex:40, width:320, padding:"12px 14px"}} role="dialog" aria-label="Keyboard shortcuts">
          <div className="mono" style={{fontSize:10, color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".16em", marginBottom:10}}>Keyboard shortcuts</div>
          {shortcuts.map(([k, d]) => (
            <div key={k} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", borderBottom:"1px solid var(--line)", fontSize:12.5}}>
              <span style={{color:"var(--ink-2)"}}>{d}</span>
              <kbd style={{fontFamily:"var(--mono)", fontSize:11, background:"var(--panel-hi)", border:"1px solid var(--line-2)", borderRadius:4, padding:"2px 7px", color:"var(--brass)", marginLeft:10, whiteSpace:"nowrap"}}>{k}</kbd>
            </div>
          ))}
          <button style={{marginTop:10, background:"none", border:"none", color:"var(--ink-4)", cursor:"pointer", fontSize:12, padding:0}} onClick={() => setOpen(false)}>Close</button>
        </div>
      )}
    </div>
  );
}

function Topbar({ mobileNavOpen, setMobileNavOpen }) {
  const { openModal, openSignal, toast, modal, signalId, setSignalSearchQuery, requestLiveRefresh, consumeLiveRefresh, navigate } = useStore();
  const [q, setQ] = React.useState("");
  const [open, setOpen] = React.useState(false);
  const [cursor, setCursor] = React.useState(-1);
  const [isDark, setIsDark] = React.useState(() => localStorage.getItem("pp-theme") !== "light");
  const [focused, setFocused] = React.useState(false);
  const ref = React.useRef(null);
  const searchRef = React.useRef(null);

  React.useEffect(() => {
    const h = (e) => {
      if (e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ref.current?.focus(); }
      if (e.key === "Escape") {
        if (modal || signalId) return;
        if (open) { e.preventDefault(); setOpen(false); setCursor(-1); ref.current?.blur(); return; }
        ref.current?.blur();
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [modal, signalId, open]);

  React.useEffect(() => {
    const h = (e) => {
      if (!searchRef.current || searchRef.current.contains(e.target)) return;
      setOpen(false);
      setFocused(false);
      setCursor(-1);
    };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);

  const results = React.useMemo(() => {
    if (!q.trim()) return null;
    const term = q.toLowerCase();
    const sig = SIGNALS.filter(s =>
      s.title.toLowerCase().includes(term) || s.summary.toLowerCase().includes(term) || s.id.toLowerCase().includes(term));
    const bills = Object.values(ENTITIES.bills).filter(b => [b.title, b.ref, b.portfolio, b.stage].some(v => (v || "").toLowerCase().includes(term)));
    const comm = Object.values(ENTITIES.committees).filter(c => [c.name, c.portfolio, c.chamber].some(v => (v || "").toLowerCase().includes(term)));
    const mem = Object.values(ENTITIES.members).filter(m => [m.name, m.party, (m.roles || []).join(" ")].some(v => (v || "").toLowerCase().includes(term)));
    const feeds = APH_FEEDS.filter(f => f.name.toLowerCase().includes(term));
    return { sig, bills, comm, mem, feeds };
  }, [q]);

  // Flat ordered list for keyboard cursor
  const flat = React.useMemo(() => {
    if (!results) return [];
    return [
      ...results.sig.slice(0,4).map(s => ({ kind:"signal", key:s.id, label:s.title, sub:s.id, act:() => { openSignal(s.id); } })),
      ...(results.sig.length > 4 ? [{ kind:"signalsAll", key:"signals-all", label:`See all ${results.sig.length} signals`, sub:q, act:() => { setSignalSearchQuery(q); navigate("signals"); } }] : []),
      ...results.bills.map(b => ({ kind:"bill", key:b.ref, label:b.title, sub:b.ref, act:() => { openModal("bill", b.ref); } })),
      ...results.comm.map(c => ({ kind:"committee", key:c.id, label:c.name, sub:c.chamber, act:() => { openModal("committee", c.id); } })),
      ...results.mem.map(m => ({ kind:"member", key:m.id, label:m.name, sub:m.party, act:() => { openModal("member", m.id); } })),
      ...results.feeds.slice(0,4).map(f => ({ kind:"feed", key:f.id, label:f.name, sub:f.group, act:() => { openModal("feed", f.id); } })),
    ];
  }, [results, q, openSignal, openModal, setSignalSearchQuery, navigate]);

  React.useEffect(() => setCursor(-1), [q]);

  const selectItem = (item) => { item.act(); setOpen(false); setQ(""); setCursor(-1); };

  const onKeyDown = (e) => {
    if (!open || !results) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setCursor(c => Math.min(c + 1, flat.length - 1)); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); setCursor(c => Math.max(c - 1, -1)); return; }
    if (e.key === "Escape")    { setOpen(false); setCursor(-1); ref.current?.blur(); return; }
    if (e.key === "Enter" && cursor >= 0 && flat[cursor]) { e.preventDefault(); selectItem(flat[cursor]); return; }
  };

  // Map flat index back to per-group index offsets for rendering
  const sigOff  = 0;
  const sigFlatCount = results ? results.sig.slice(0,4).length + (results.sig.length > 4 ? 1 : 0) : 0;
  const billOff = sigFlatCount;
  const commOff = billOff + (results ? results.bills.length : 0);
  const memOff  = commOff + (results ? results.comm.length : 0);
  const feedOff = memOff  + (results ? results.mem.length : 0);

  return (
    <div className="topbar">
      <button
        className="btn ghost sm nav-toggle"
        aria-label={mobileNavOpen ? "Close navigation" : "Open navigation"}
        aria-expanded={mobileNavOpen}
        aria-controls="main-navigation"
        onClick={() => setMobileNavOpen(open => !open)}
      >
        <Icon name="menu" size={15} />
      </button>
      <div ref={searchRef} className={"search" + (focused ? " focused" : "")} onClick={() => setOpen(true)}
        style={focused ? {borderColor:"var(--brass)", boxShadow:"0 0 0 3px var(--brass-soft)"} : undefined}>
        <Icon name="search" size={14} stroke={focused ? "var(--brass)" : "var(--ink-3)"} />
        <input ref={ref} value={q}
          role="combobox"
          onChange={e => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => { setOpen(true); setFocused(true); }}
          onBlur={() => setFocused(false)}
          onKeyDown={onKeyDown}
          aria-label="Search parliament signals, bills, committees and members"
          aria-expanded={open && !!results}
          aria-autocomplete="list"
          aria-controls="search-listbox"
          aria-activedescendant={cursor >= 0 ? `search-option-${cursor}` : undefined}
          placeholder="Search signals, bills, committees, members, feeds…" />
        {q ? (
          <button onClick={() => { setQ(""); setOpen(false); setCursor(-1); ref.current?.focus(); }}
            aria-label="Clear search" title="Clear search"
            style={{background:"none", border:"none", cursor:"pointer", padding:"2px 4px", color:"var(--ink-3)", display:"flex", alignItems:"center", flexShrink:0}}>
            <Icon name="close" size={12} />
          </button>
        ) : (
          <span className="kbd">{IS_MAC ? "⌘K" : "Ctrl+K"}</span>
        )}
        {open && results && (
          <div id="search-listbox" role="listbox" className="search-results">
            {results.sig.length > 0 && <>
              <div className="sr-group">Signals ({results.sig.length})</div>
              {results.sig.slice(0,4).map((s, i) => (
                <div key={s.id} id={`search-option-${sigOff + i}`} role="option" aria-selected={cursor === sigOff + i}
                  className={"sr-item" + (cursor === sigOff + i ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[sigOff + i]); }}>
                  <span className="k">{s.id}</span><span>{s.title}</span>
                </div>
              ))}
              {results.sig.length > 4 && (
                <div id={`search-option-${sigOff + 4}`} role="option" aria-selected={cursor === sigOff + 4}
                  className={"sr-item" + (cursor === sigOff + 4 ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[sigOff + 4]); }}>
                  <span className="k">All</span><span>See all {results.sig.length} signals</span>
                </div>
              )}
            </>}
            {results.bills.length > 0 && <>
              <div className="sr-group">Bills</div>
              {results.bills.map((b, i) => (
                <div key={b.ref} id={`search-option-${billOff + i}`} role="option" aria-selected={cursor === billOff + i}
                  className={"sr-item" + (cursor === billOff + i ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[billOff + i]); }}>
                  <span className="k">{b.ref}</span><span>{b.title}</span>
                </div>
              ))}
            </>}
            {results.comm.length > 0 && <>
              <div className="sr-group">Committees</div>
              {results.comm.map((c, i) => (
                <div key={c.id} id={`search-option-${commOff + i}`} role="option" aria-selected={cursor === commOff + i}
                  className={"sr-item" + (cursor === commOff + i ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[commOff + i]); }}>
                  <span className="k">{c.chamber}</span><span>{c.name}</span>
                </div>
              ))}
            </>}
            {results.mem.length > 0 && <>
              <div className="sr-group">Members</div>
              {results.mem.map((m, i) => (
                <div key={m.id} id={`search-option-${memOff + i}`} role="option" aria-selected={cursor === memOff + i}
                  className={"sr-item" + (cursor === memOff + i ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[memOff + i]); }}>
                  <span className="k">{m.party}</span><span>{m.name}</span>
                </div>
              ))}
            </>}
            {results.feeds.length > 0 && <>
              <div className="sr-group">Sources ({results.feeds.length})</div>
              {results.feeds.slice(0,4).map((f, i) => (
                <div key={f.id} id={`search-option-${feedOff + i}`} role="option" aria-selected={cursor === feedOff + i}
                  className={"sr-item" + (cursor === feedOff + i ? " active" : "")}
                  onMouseDown={e => { e.preventDefault(); selectItem(flat[feedOff + i]); }}>
                  <span className="k">{f.group}</span><span>{f.name}</span>
                </div>
              ))}
            </>}
            {q && !results.sig.length && !results.bills.length && !results.comm.length && !results.mem.length && !results.feeds.length && (
              <div className="sr-item" role="option" aria-selected="false" style={{color:"var(--ink-4)", cursor:"default"}}>No matches for "{q}"</div>
            )}
          </div>
        )}
      </div>
      <div className="top-right">
        <TopClock />
        <span className="chip clk live-chip" onClick={() => navigate("live")} title="Parliament is sitting · official feeds configured" style={{borderColor:"var(--ember-flash)", color:"var(--ink)", background:"transparent"}}>
          <span className="dot pulse-dot" style={{background:"var(--ember-flash)"}}/> Live · {sourceCounts().total} sources
        </span>
        <button className="btn ghost sm shortcut-btn" title="Go to Live parliament and refresh feeds there" aria-label="Refresh live feeds" onClick={() => {
          requestLiveRefresh();
          navigate("live");
          if (window.__refreshLiveFeeds) { consumeLiveRefresh(); window.__refreshLiveFeeds(); toast("Refreshing live feeds..."); }
          else toast("Opening Live page to refresh feeds", "brass");
        }}><Icon name="refresh" size={14} /></button>
        <button className="btn ghost sm" title="Alerts (demo): no alerts backend wired" aria-label="Alerts" onClick={() => toast("Alerts (demo): no alerts backend is wired", "brass")}><Icon name="bell" size={14} /></button>
        <button className="btn primary sm" onClick={() => navigate("briefings")}><Icon name="plus" size={13} /> New brief</button>
        <ShortcutHelp />
        <button className="btn ghost sm" title={isDark ? "Switch to light mode" : "Switch to dark mode"} aria-label={isDark ? "Switch to light mode" : "Switch to dark mode"} onClick={() => {
          const next = isDark ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          localStorage.setItem("pp-theme", next);
          setIsDark(!isDark);
        }}><Icon name={isDark ? "sun" : "moon"} size={13} /></button>
      </div>
    </div>
  );
}

function Att({ level }) {
  const map = { high: "High", med: "Medium", low: "Low" };
  return <span className={"att " + level}>{map[level]}</span>;
}

function Conf({ n = 3 }) {
  // 5-segment ember-to-gold ramp: lit segments climb from incandescent ember to gold
  // so the bar reads quantitatively, not just as a count.
  const ramp = ["var(--brass)", "var(--brass)", "var(--brass-2)", "var(--gold)", "var(--gold)"];
  return (
    <span className="conf" title={`Confidence ${n}/5`}>
      {[1,2,3,4,5].map(i => (
        <span key={i} className={i<=n?"on":""}
          style={i<=n ? {background: ramp[i-1]} : undefined} />
      ))}
    </span>
  );
}

function buildBriefSections(s) {
  const evidence = (s.evidence || []).map(e => ({ label: e.label, url: e.url }));
  return {
    title: s.title,
    meta: {
      id: s.id,
      date: s.date,
      time: s.time,
      source: s.source,
      sourceAuthority: s.sourceAuthority,
      attention: s.attention,
      confidence: s.confidence,
      humanReview: s.humanReview,
    },
    summary: s.summary,
    whyItMatters: s.attentionReason,
    recommendedAction: {
      label: s.action,
      reason: s.actionReason,
    },
    evidence,
    provenance: `Signal ID: ${s.id} | Confidence: ${s.confidence}/5 | Human review: ${s.humanReview}`,
  };
}

function SignalCard({ s }) {
  const { openSignal, state, isWatched } = useStore();
  const archived = !!state.archived[s.id];
  const feedback = state.feedback[s.id];
  const watched = isWatched(s.id);
  return <SignalCardView s={s} archived={archived} feedback={feedback} watched={watched} openSignal={openSignal} />;
}

const SignalCardView = React.memo(function SignalCardView({ s, archived, feedback, watched, openSignal }) {
  if (archived) return null;
  return (
    <div className="signal" data-att={s.attention} onClick={() => openSignal(s.id)} role="button" tabIndex={0} aria-label={`Signal: ${s.title}`} onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSignal(s.id); } }}>
      <div className="sig-head">
        <span className="sig-id mono">{s.id}</span>
        <span className="sig-source mono">· {s.source}</span>
        <Att level={s.attention} />
        {watched && <span className="tag brass">Watching</span>}
        <span className="sig-time mono">{s.time}</span>
      </div>
      <div className="sig-title serif">{s.title}</div>
      <div className="sig-sum">{s.summary.length > 120 ? s.summary.slice(0, 120).replace(/\s\S+$/, "") + "…" : s.summary}</div>
      <div className="sig-tags">
        {s.tags.map((t, i) => <span key={i} className={"tag " + (t.c || "")}>{t.l}</span>)}
      </div>
      <div className="sig-action">
        <span className="sig-action-label">Recommended</span>
        <span className="sig-action-value">{s.action}</span>
        <span className="mono" title="Analyst confidence" style={{fontSize:10.5, color:"var(--ink-4)", letterSpacing:".04em", whiteSpace:"nowrap"}}>{s.confidence}/5</span>
      </div>
      {feedback && (
        <div style={{marginTop:8, fontSize:11.5, color:"var(--brass)"}}>
          <Icon name="check" size={12} style={{verticalAlign:"-2px", marginRight:4}}/> Feedback: {feedback.label}
        </div>
      )}
      {watched && (
        <div style={{marginTop:8, fontSize:11.5, color:"var(--brass)"}}>
          <Icon name="watch" size={12} style={{verticalAlign:"-2px", marginRight:4}}/> On watchlist
        </div>
      )}
    </div>
  );
});

function generateBriefMarkdown(s) {
  const brief = buildBriefSections(s);
  const evidence = brief.evidence.map(e => `- [${e.label}](${e.url})`).join("\n");
  return [
    `> DRAFT — generated from fixture demonstration data. Not for distribution.`,
    ``,
    `# Executive Brief — ${brief.title}`,
    `Date: ${brief.meta.date} | Source: ${brief.meta.source} | Priority: ${(brief.meta.attention || "").toUpperCase()}`,
    ``,
    `## Summary`,
    brief.summary,
    ``,
    `## Why it matters`,
    brief.whyItMatters,
    ``,
    `## Recommended action`,
    `**${brief.recommendedAction.label}**`,
    brief.recommendedAction.reason,
    ``,
    `## Evidence`,
    evidence || "_No evidence links recorded._",
    ``,
    `## Provenance`,
    brief.provenance,
    `Generated: ${new Date().toISOString()}`,
  ].join("\n");
}

function Drawer() {
  const { signalId, openSignal, closeSignal, state, modal, openModal, saveFeedback, archive, addWatchlist, isWatched, saveNote, generateBrief, toast, visibleSignalOrder, navigate } = useStore();
  const signal = React.useMemo(() => SIGNALS.find(s => s.id === signalId), [signalId]);
  const [fb, setFb] = React.useState(null);
  const [note, setNote] = React.useState("");
  const [noteSaved, setNoteSaved] = React.useState(false);
  // F12: keep the live note text and the signal it belongs to in refs so we can flush it
  // to the store on drawer close and before j/k navigation, not only on textarea blur.
  const noteRef = React.useRef("");
  const noteSigRef = React.useRef(null);
  const noteSavedTimerRef = React.useRef(null);
  React.useEffect(() => { noteRef.current = note; }, [note]);
  React.useEffect(() => { noteSigRef.current = signalId; }, [signalId]);
  // Invariant: flushNote must run before close/navigation, while the reset effect below only runs on signalId changes so it cannot erase unsaved typing during unrelated store updates.
  const flushNote = React.useCallback(() => {
    const sid = noteSigRef.current;
    if (sid && noteRef.current !== (state.notes[sid] || "")) {
      saveNote(sid, noteRef.current);
      setNoteSaved(true);
      clearTimeout(noteSavedTimerRef.current);
      noteSavedTimerRef.current = setTimeout(() => setNoteSaved(false), 1600);
    }
  }, [saveNote, state.notes]);
  const closeWithFlush = React.useCallback(() => { flushNote(); closeSignal(); }, [flushNote, closeSignal]);
  const sigIdxRef = React.useRef(0);
  const drawerBodyRef = React.useRef(null);
  const prevFocusRef = React.useRef(null);
  const closeButtonRef = React.useRef(null);

  // Visible signals (non-archived) — computed early so keyboard deps can reference it
  const visibleSigs = React.useMemo(() => {
    const fallback = SIGNALS.filter(x => !state.archived[x.id]);
    if (!Array.isArray(visibleSignalOrder) || visibleSignalOrder.length === 0) return fallback;
    const byId = new Map(SIGNALS.map(x => [x.id, x]));
    const ordered = visibleSignalOrder.map(id => byId.get(id)).filter(x => x && !state.archived[x.id]);
    return ordered.length ? ordered : fallback;
  }, [visibleSignalOrder, state.archived]);

  // Sync index ref and scroll drawer to top when signal changes
  React.useEffect(() => {
    const idx = visibleSigs.findIndex(s => s.id === signalId);
    if (idx !== -1) sigIdxRef.current = idx;
    if (drawerBodyRef.current) drawerBodyRef.current.scrollTop = 0;
  }, [signalId, visibleSigs]);

  // Focus management: save trigger element, move focus into drawer, restore on close
  React.useEffect(() => {
    if (signalId) {
      prevFocusRef.current = document.activeElement;
      requestAnimationFrame(() => closeButtonRef.current?.focus());
    } else if (prevFocusRef.current) {
      prevFocusRef.current.focus();
      prevFocusRef.current = null;
    }
  }, [signalId]);

  // Tab trap inside drawer
  React.useEffect(() => {
    if (!signalId) return;
    const trap = (e) => {
      if (e.key !== "Tab") return;
      const drawerEl = closeButtonRef.current?.closest("aside.drawer");
      if (!drawerEl) return;
      const focusable = Array.from(drawerEl.querySelectorAll("button, [href], input, textarea, select, [tabindex]:not([tabindex='-1'])")).filter(el => !el.disabled);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
    };
    document.addEventListener("keydown", trap);
    return () => document.removeEventListener("keydown", trap);
  }, [signalId]);

  React.useEffect(() => {
    setFb(state.feedback[signalId]?.label || null);
  }, [signalId, state.feedback]);

  // Note only resets on signal navigation — intentionally excludes state.notes so that
  // concurrent state updates (e.g. archiving a different signal) cannot wipe in-progress typing.
  React.useEffect(() => {
    setNote(state.notes[signalId] || "");
    setNoteSaved(false);
  }, [signalId]); // eslint-disable-line react-hooks/exhaustive-deps

  // Keyboard navigation: j/k to navigate, Escape to close, b to brief, w to watchlist
  React.useEffect(() => {
    const handler = (e) => {
      if (modal) return; // disable when detail modal is open
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "Escape" && signalId) { e.preventDefault(); flushNote(); closeSignal(); return; }
      if (e.key === "j" || e.key === "k") {
        e.preventDefault();
        const cur = visibleSigs.findIndex(s => s.id === signalId);
        const next = e.key === "j"
          ? Math.min(cur + 1, visibleSigs.length - 1)
          : Math.max(cur - 1, 0);
        if (visibleSigs[next] && visibleSigs[next].id !== signalId) { flushNote(); openSignal(visibleSigs[next].id); }
      }
      if (e.key === "b" && signalId) {
        e.preventDefault();
        const s = SIGNALS.find(x => x.id === signalId);
        if (s) {
          navigator.clipboard.writeText(generateBriefMarkdown(s))
            .then(() => { generateBrief(s.id, "Executive brief"); toast("Brief copied to clipboard", "brass", { label: "Open briefings", fn: () => navigate("briefings") }); })
            .catch(() => toast("Clipboard unavailable — brief not copied", "error"));
        }
      }
      if (e.key === "w" && signalId) {
        e.preventDefault();
        addWatchlist(signalId);
      }
      if (e.key === "a" && signalId) {
        e.preventDefault();
        flushNote();
        const cur = visibleSigs.findIndex(s => s.id === signalId);
        const nextSig = visibleSigs[cur + 1] || visibleSigs[cur - 1];
        archive(signalId);
        if (nextSig) openSignal(nextSig.id); else closeSignal();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [signalId, modal, visibleSigs, openSignal, closeSignal, archive, addWatchlist, generateBrief, toast, flushNote, navigate]);

  const on = !!signal;
  const s = signal || {};
  const watched = signalId ? isWatched(signalId) : false;
  const labels = ["Correct priority","Too high","Too low","Wrong topic","Wrong portfolio","Duplicate","Noise","Needs human review"];
  const sigPos = visibleSigs.findIndex(x => x.id === signalId);
  return (
    <>
      <div className={"drawer-back" + (on ? " on" : "")} onClick={closeWithFlush} aria-hidden="true" />
      <aside className={"drawer" + (on ? " on" : "")} role="dialog" aria-modal="true" aria-label={on ? s.title : "Signal detail"}>
        {on && (
          <>
            <div className="drawer-head">
              <div>
                <div className="mono" style={{fontSize:10, color:"var(--ink-4)", letterSpacing:".16em", textTransform:"uppercase"}}>
                  {s.id} · {s.date}
                </div>

<script type="text/babel">
// Pages — all entities are clickable; store-wired

const { useState, useMemo } = React;

function csvEscape(v) {
  const text = v == null ? "" : String(v);
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function exportSignalsCSV() {
  const headers = ["id","date","source","attention","title","action","confidence"];
  const rows = SIGNALS.map(s => [
    s.id, s.date, s.source, s.attention,
    s.title,
    s.action,
    s.confidence,
  ]);
  exportRowsCSV(headers, rows, `parliament-pulse-signals-${new Date().toISOString().slice(0,10)}.csv`);
}

// Reused by the Bills register export (F4): generic array-to-CSV download with no blob leak.
function exportRowsCSV(headers, rows, filename) {
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

  const [nonce, setNonce] = React.useState(0); // bump to force reload
  const embedReady = embedTarget.which === which && embedTarget.nonce === nonce;
  // F9: a cross-origin iframe cannot expose true playback state, so we treat the
  // stream as unconfirmed until the iframe fires onLoad. If no load arrives within
  // the timeout we auto-switch to the offline panel. The LIVE badge is never shown
  // until the iframe has at least loaded; we still label it "Signal" not a hard LIVE
  // claim, because confirmed playback is not detectable from here.
  const [loaded, setLoaded] = React.useState(false);

  // When chamber changes or we retry, reset embed and confirmation state
  React.useEffect(() => {
    setMode("embed");
    setLoaded(false);
    const id = setTimeout(() => setEmbedTarget({ which, nonce }), 300);
    return () => clearTimeout(id);
  }, [which, nonce]);

  // Auto-switch to offline if the embed has not loaded within the timeout window.
  React.useEffect(() => {
    if (mode !== "embed" || !embedReady) return;
    const id = setTimeout(() => {
      if (!loaded) setMode("offline");
    }, 6000);
    return () => clearTimeout(id);
  }, [mode, loaded, embedReady]);

  return (
    <div className="live-wrap" style={{background:"#000", aspectRatio:"16/9", position:"relative", overflow:"hidden", borderRadius:10, border:"1px solid var(--line-2)"}}>
      {mode === "embed" && embedReady && (
        <iframe
          key={embedTarget.which + "-" + embedTarget.nonce}
          src={cfg.url}
          title={`AUSParliamentLive — ${cfg.label}`}
          allow="autoplay; encrypted-media"
          allowFullScreen
          loading="lazy"
          referrerPolicy="strict-origin-when-cross-origin"
          onLoad={() => setLoaded(true)}
          style={{position:"absolute", inset:0, width:"100%", height:"100%", border:0}}
        />
      )}

      {/* LIVE badge — only after the iframe has loaded; we cannot confirm playback
          cross-origin so this never asserts LIVE before a load event. */}
      {mode === "embed" && loaded && (
        <div className="live-badge" style={{position:"absolute", top:12, left:12, zIndex:3, display:"flex", alignItems:"center", gap:6, background:"rgba(0,0,0,0.6)", padding:"5px 10px", borderRadius:4, fontFamily:"var(--mono)", fontSize:11, color:"#fff", letterSpacing:".12em", border:"1px solid var(--ember-flash)"}}>
          <span style={{width:7, height:7, borderRadius:"50%", background:"var(--ember-flash)", boxShadow:"0 0 10px var(--ember-flash)", animation:"pulse 1.6s ease-in-out infinite"}}/>
          LIVE · {cfg.label.toUpperCase()}
        </div>
      )}

      {/* Connecting state — shown while the embed is loading, before any LIVE claim */}
      {mode === "embed" && !loaded && (
        <div style={{position:"absolute", top:12, left:12, zIndex:3, display:"flex", alignItems:"center", gap:6, background:"rgba(0,0,0,0.6)", padding:"5px 10px", borderRadius:4, fontFamily:"var(--mono)", fontSize:11, color:"var(--ink-2)", letterSpacing:".12em", border:"1px solid var(--line-bright)"}}>
          <span style={{width:7, height:7, borderRadius:"50%", background:"var(--ink-3)"}}/>
          Connecting · {cfg.label.toUpperCase()}
        </div>
      )}

      {/* Manual "No stream?" pill — always available in embed mode because YouTube's
          offline state renders INSIDE the iframe and we can't detect it from here. */}
      {mode === "embed" && (
        <button
          onClick={() => setMode("offline")}
          style={{position:"absolute", top:12, right:12, zIndex:3, fontFamily:"var(--mono)", fontSize:10.5, color:"#fff", background:"rgba(0,0,0,0.55)", border:"1px solid var(--line-bright)", padding:"4px 9px", borderRadius:4, cursor:"pointer", letterSpacing:".08em"}}
          title="Show alternate sources if no stream is live"
        >
          NO STREAM?
        </button>
      )}

      {/* Fallback for no-stream / blocked / user-toggled */}
      {mode === "offline" && (
        <div style={{position:"absolute", inset:0, background:"linear-gradient(180deg, var(--panel-2), var(--bg))", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24, textAlign:"center"}}>
          <div style={{fontFamily:"var(--serif)", fontSize:22, color:"var(--brass)", marginBottom:10}}>Stream unavailable</div>
          <div style={{color:"var(--ink-2)", fontSize:13, maxWidth:460, lineHeight:1.5, marginBottom:18}}>
            AUSParliamentLive only broadcasts <strong>{cfg.label}</strong> while the chamber is in session. Try the official APH pages below, or retry the embed.
          </div>
          <div style={{display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center"}}>
            <a href="https://www.youtube.com/@AUSParliamentLive/streams" target="_blank" rel="noopener noreferrer" className="btn primary" style={{textDecoration:"none"}}>YouTube · AUSParliamentLive <Icon name="ext" size={12}/></a>
            <a href="https://www.aph.gov.au/News_and_Events/Watch_Read_Listen" target="_blank" rel="noopener noreferrer" className="btn" style={{textDecoration:"none"}}>APH Watch / Read / Listen <Icon name="ext" size={12}/></a>
            <a href="https://parlview.aph.gov.au/" target="_blank" rel="noopener noreferrer" className="btn" style={{textDecoration:"none"}}>ParlView archive <Icon name="ext" size={12}/></a>
            <button className="btn" onClick={() => { setNonce(n => n + 1); setMode("embed"); }}>Retry embed</button>
          </div>
        </div>
      )}

      {/* @keyframes pulse defined globally in index.html */}
    </div>
  );
}

// --- REAL LIVE RSS POLLER ---
// Fetches the official APH RSS feeds listed at https://www.aph.gov.au/Help/Rss_feeds
// via a CORS proxy (local proxy-server.js in dev, Cloudflare Worker in production),
// parses the XML, and merges items into a single time-sorted signal stream.
// Refreshes every 2 minutes.
//
// The feed list is read from the single canonical registry window.SOURCE_REGISTRY
// (owned by data.jsx / WP-E). We no longer keep a duplicate APH_FEED_URLS here.
// The parlinfo Bills Digests feed is intentionally absent: it sits behind an Azure
// WAF JavaScript challenge and a plain Worker fetch is blocked, so it must not be
// routed through the simple proxy.

// Derive a display kind (drives the row icon) from a registry entry's id/module.
function feedKind(entry) {
  const id = (entry.id || "").toLowerCase();
  const url = (entry.url || "").toLowerCase();
  if (id.includes("div") || url.includes("/divisions")) return "division";
  if (id.includes("report") || url.includes("/reports")) return "report";
  if (id.includes("inquir") || url.includes("inquiries") || url.includes("new_inquiries")) return "inquiry";
  if (id.includes("hearing") || url.includes("hearings") || url.includes("/red")) return "hearing";
  if (id.includes("program") || url.includes("daily_program")) return "program";
  if (id.includes("digest") || id.includes("bills")) return "digest";
  return "signal";
}

// Map the canonical registry into the shape the poller consumes.
// Falls back to an empty list if the registry is not yet attached (defensive).
function liveFeedList() {
  const reg = (typeof window !== "undefined" && Array.isArray(window.SOURCE_REGISTRY)) ? window.SOURCE_REGISTRY : [];
  return reg
    .filter(f => f.url && f.url.startsWith("http") && !f.url.includes("parlinfo.aph.gov.au"))
    .map(f => ({ url: f.url, label: f.label || f.name || f.url, kind: feedKind(f) }));
}

function safeHttpUrl(u) {
  return /^https?:\/\//i.test(u || "") ? u : "";
}

// Bounded-concurrency map: at most `limit` calls of fn run at once. Keeps the live
// poller from spawning an unbounded fetch burst (Chromium ERR_INSUFFICIENT_RESOURCES)
// as the feed list grows. Mirrors Promise.allSettled's result shape.
async function mapPool(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  const worker = async () => {
    while (next < items.length) {
      const idx = next++;
      try { results[idx] = { status: "fulfilled", value: await fn(items[idx], idx) }; }
      catch (e) { results[idx] = { status: "rejected", reason: e }; }
    }
  };
  const lanes = Math.max(1, Math.min(limit, items.length));
  await Promise.all(Array.from({ length: lanes }, worker));
  return results;
}

function PageLive() {
  const [which, setWhich] = useState("house");
  const { toast, openModal, consumeLiveRefresh } = useStore();

  const [events, setEvents] = useState([]);
  const [feedStatus, setFeedStatus] = useState({}); // url -> {ok, count, error}
  const [lastPoll, setLastPoll] = useState(null);
  const [loading, setLoading] = useState(true);

  React.useEffect(() => {
    let cancelled = false;

    // Local CORS proxy (proxy-server.js) returns raw RSS/XML from aph.gov.au.
    // Use DOMParser to extract <item> elements.
    const parseRSSXml = (text, feedMeta) => {
      const out = [];
      try {
        const doc = new DOMParser().parseFromString(text, "application/xml");
        const items = doc.querySelectorAll("item");
        const seen = new Set();
        items.forEach(item => {
          if (out.length >= 6) return;
          const title = item.querySelector("title")?.textContent?.trim().replace(/\s+/g, " ") || "";
          // <link> in RSS 2.0 is a text node between tags (not an attribute)
          const linkEl = item.querySelector("link");
          const link = safeHttpUrl((linkEl?.textContent || linkEl?.getAttribute("href") || "").trim());
          const pubDateStr = item.querySelector("pubDate")?.textContent?.trim() || null;
          const pubDate = pubDateStr ? new Date(pubDateStr) : null;
          if (title.length < 10 || !link) return;
          const key = title.toLowerCase();
          if (seen.has(key)) return;
          seen.add(key);
          out.push({
            title, link,
            date: (pubDate && !isNaN(pubDate)) ? pubDate : null,
            sourceLabel: feedMeta.label,
            sourceUrl:   feedMeta.url,
            kind:        feedMeta.kind,
            order:       out.length,
          });
        });
      } catch (e) { /* parse error — return empty */ }
      return out;
    };

    // F1: a file:// origin cannot reach a proxy; guard early so the panel can advise.
    if (location.protocol === "file:") {
      setFeedStatus({ __fileGuard: { ok: false, error: "Opened from the file system. Serve over http to reach the feed proxy." } });
      setEvents([]);
      setLoading(false);
      return () => { cancelled = true; };
    }

    // PERF-1: track in-flight fetches so unmount can abort them, and give each an 8s
    // timeout so a hung proxy cannot leave the panel stuck on "Polling".
    const controllers = new Set();
    const fetchOne = async (f) => {
      // Auto-detect: use Cloudflare Worker in production, local proxy in dev.
      // The Worker serves /rss?u=<encoded feed url> (route fix; deploy blocker).
      const proxyBase = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://localhost:3001/proxy?url="
        : "https://aph-proxy.jvega019.workers.dev/rss?u=";
      const proxy = proxyBase + encodeURIComponent(f.url);
      const ctrl = new AbortController();
      controllers.add(ctrl);
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(proxy, { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return parseRSSXml(await res.text(), f);
      } finally {
        clearTimeout(timer);
        controllers.delete(ctrl);
      }
    };

    let inFlight = false;
    const poll = async () => {
      if (inFlight) return;            // skip overlapping polls so results cannot land out of order
      inFlight = true;
      setLoading(true);
      const feeds = liveFeedList();
      // PERF-1: cap concurrency at 3 rather than firing every feed at once.
      const results = await mapPool(feeds, 3, fetchOne);
      if (cancelled) { inFlight = false; return; }
      const all = [];
      const status = {};
      results.forEach((r, i) => {
        const f = feeds[i];
        const reg = SOURCE_REGISTRY.find(x => x.url === f.url);
        if (r.status === "fulfilled") {
          status[f.url] = { ok: true, count: r.value.length, label: f.label };
          if (reg) {
            reg.lastStatusCode = 200;
            reg.errorDetail = null;
            reg.lastItemCount = r.value.length;
          }
          all.push(...r.value.map((it, idx) => ({ ...it, feedIdx: i, itemIdx: idx })));
        } else {
          status[f.url] = { ok: false, error: String(r.reason).slice(0, 80), label: f.label };
          if (reg) {
            reg.lastStatusCode = 0;
            reg.errorDetail = String(r.reason).slice(0, 80);
            reg.lastItemCount = null;
          }
        }
      });
      window.__sourceHealth = sourceCounts();
      // Without dates, sort by feed priority (divisions first, then hearings, etc.) then item order
      all.sort((a, b) => a.feedIdx - b.feedIdx || a.itemIdx - b.itemIdx);
      setEvents(all.slice(0, 30));
      setFeedStatus(status);
      setLastPoll(new Date());
      setLoading(false);
      inFlight = false;
    };

    window.__refreshLiveFeeds = poll;
    if (consumeLiveRefresh()) toast("Refreshing live feeds...", "brass");
    poll();
    const id = setInterval(poll, 120000); // 2 min
    return () => { cancelled = true; clearInterval(id); controllers.forEach(c => c.abort()); window.__refreshLiveFeeds = null; };
  }, []);

  const fmtTime = (d) => {
    if (!d) return "—";
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return `${d.getDate()} ${d.toLocaleString("en-AU",{month:"short"})}`;
  };
  const liveCount = Object.values(feedStatus).filter(s => s.ok).length;
  const totalFeeds = Object.keys(feedStatus).filter(k => k !== "__fileGuard").length || liveFeedList().length;
  // Collected feed errors, surfaced in the empty-state panel (F1).
  const feedErrors = Object.entries(feedStatus)
    .filter(([, s]) => s && !s.ok)
    .map(([url, s]) => ({ url, label: s.label || url, error: s.error }));
  const isLocalHost = location.hostname === "localhost" || location.hostname === "127.0.0.1";

  return (

          <button className={"btn " + (which === "federation" ? "primary" : "")} onClick={() => setWhich("federation")}>Federation</button>
          <button className="btn" title="Demo control: no capture backend in this build" onClick={() => toast("Flag moment (demo): capture backend not wired", "brass")}><Icon name="flag" size={13}/> Flag moment (demo)</button>
        </div>
      </div>

      <div className="grid g-live-main" style={{gap:16}}>
        <div>
          <LiveBroadcast which={which} toast={toast} />
          <div style={{display:"flex", gap:8, marginTop:12, alignItems:"center", flexWrap:"wrap"}}>
            <span className="src-badge">AUSParliamentLive · YouTube embed</span>
            <a href="https://www.youtube.com/@AUSParliamentLive/streams" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> AUSParliamentLive</a>
            <a href="https://parlview.aph.gov.au/" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> ParlView archive</a>
            <a href="https://www.aph.gov.au/Parliamentary_Business/Hansard" target="_blank" rel="noopener noreferrer" className="src-badge" style={{textDecoration:"none", color:"var(--teal)"}}><Icon name="ext" size={11}/> Hansard</a>
            <button className="btn sm ghost" style={{marginLeft:"auto"}} title="Demo control: no transcript backend in this build" onClick={() => toast("Request transcript (demo): no transcript backend")}>Request transcript (demo)</button>
            <button className="btn sm" title="Demo control: no clip backend in this build" onClick={() => toast("Clip to brief (demo): clip backend not wired", "brass")}><Icon name="brief" size={12}/> Clip to brief (demo)</button>
          </div>

          <div className="panel" style={{marginTop:16}}>
            <div className="panel-head">
              <h2 className="panel-title">Currently on program</h2>
              <span className="panel-kicker">{which === "house" ? "House of Representatives" : which === "senate" ? "Senate" : "Federation Chamber"}</span>
              <a href={which === "house" ? "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Daily_program" : "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/Senate_chamber_documents/Dynamic_Red"} target="_blank" rel="noopener noreferrer" style={{marginLeft:"auto", fontSize:11.5, color:"var(--teal)", textDecoration:"none"}}>Open daily program <Icon name="ext" size={11}/></a>

                <div className="tl-item teal"><div className="tl-time">14:00</div><div className="tl-body">Government business · 2nd reading <button className="linklike" onClick={()=>openModal("bill","BILL-2026-041")}>Cyber Security Bill</button> <span className="tag brass" style={{marginLeft:6}}>Watchlist · Cyber</span></div></div>

                  { name: "Hansard", url: "https://www.aph.gov.au/Parliamentary_Business/Hansard", desc: "Official Hansard source page" },
                  { name: "ParlInfo Search", url: "https://parlinfo.aph.gov.au/parlInfo/search/search.w3p", desc: "Official search page" },
                  { name: "Bills Search", url: "https://www.aph.gov.au/Parliamentary_Business/Bills_Legislation/Bills_Search_Results", desc: "Official bills search page" },

                  { name: "House Daily Program", url: "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Daily_program", desc: "Official House program page" },
                  { name: "Division results", url: "https://www.aph.gov.au/Parliamentary_Business/Chamber_documents/HoR_chamber_documents/Division_lists", desc: "Official division lists page" },
                  { name: "Committee RSS feeds", url: "https://www.aph.gov.au/Parliamentary_Business/Committees/RSS_Feeds", desc: "Official committee RSS listing" },

                ].map((c,i) => (
                  <a key={i} href={c.url} target="_blank" rel="noopener noreferrer" style={{display:"flex", alignItems:"center", gap:10, padding:"10px 12px", border:"1px solid var(--line-2)", borderRadius:6, textDecoration:"none", color:"var(--ink)", background:"var(--panel-2)"}}>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:12.5, fontWeight:500}}>{c.name}</div>

                    </div>
                    <Icon name="ext" size={12} stroke="var(--ink-3)"/>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="panel">
          <div className="panel-head">
            <h2 className="panel-title">Signal events · live RSS</h2>
            <span className="panel-kicker">{loading && events.length === 0 ? "Polling…" : `${events.length} items · ${liveCount}/${totalFeeds} feeds`}</span>
          </div>
          <div className="panel-body" style={{maxHeight:720, overflowY:"auto"}}>
            {loading && events.length === 0 && (
              <div style={{padding:"8px 0"}} aria-label="Loading live RSS feed" aria-busy="true">
                {[...Array(6)].map((_, i) => (
                  <SkeletonRow key={i} />

            {!loading && events.length === 0 && (
              <div className="empty-state error" style={{fontSize:"var(--t-body-sm)", color:"var(--ink-3)"}}>
                <Icon name="flag" size={15} stroke="var(--caution)" />
                <div>
                <div style={{color:"var(--caution)", fontWeight:500, marginBottom:6}}>No items returned</div>
                {isFileGuard ? (
                  <>
                    <p style={{margin:"0 0 8px"}}>This page was opened from the file system, so the browser cannot reach the feed proxy.</p>
                    <p style={{margin:"0 0 8px", fontFamily:"var(--mono)", fontSize:11, background:"var(--panel-2)", padding:"6px 8px", borderRadius:4}}>

              <a key={e.link || e.title + i} href={safeHttpUrl(e.link) || safeHttpUrl(e.sourceUrl) || "#"} target="_blank" rel="noopener noreferrer" className="clk data-row g-live-event" style={{display:"grid", gap:10, borderRadius:6, alignItems:"start", textDecoration:"none", color:"inherit"}}>

function PageSources() {
  const { openModal, addFeed, state, toast } = useStore();
  const [testing, setTesting] = useState(false);
  const [testState, setTestState] = useState(null);
  const [newUrl, setNewUrl] = useState("https://www.aph.gov.au/.../FlagPost/Blog_entries");
  const [newName, setNewName] = useState("FlagPost Blog (HTML)");
  const startTest = () => {
    setTesting(true); setTestState(null);
    setTimeout(() => setTestState({
      status: "warn",
      lines: [
        { t: "ok", s: "URL resolved · 200 OK" },
        { t: "ok", s: "Content-Type: text/html · not XML" },
        { t: "warn", s: "No <rss> root detected — attempting HTML parse" },
        { t: "ok", s: "Found 12 dated entries" },
        { t: "warn", s: "Latest item date · 5 days old · verify cadence" },
        { t: "ok", s: "Links extractable · 12/12" },
        { t: "warn", s: "Recommended: mark as Needs validation before routing to modules" },
      ],
    }), 1100);
  };
  const saveFeed = () => {
    if (!newName.trim()) return;
    addFeed({ id: "custom-"+Date.now(), name: newName.trim(), url: newUrl, status:"review", group:"Custom" });
    setTestState(null);
  };

  const allFeeds = [...APH_FEEDS, ...state.feeds.map(f => ({ ...f, last:"just now", today:0, fpr:"—", modules:["Custom"], parser:"Needs validation", authority:"Custom", confidence:"—" }))];

  return (
    <div className="page">
      <div className="design-banner" role="status" style={{marginBottom:12, borderRadius:8}}>
        <Icon name="signal" size={13} stroke="var(--brass)" />
        <span><strong>Representative data.</strong> Feed URLs are the real APH endpoints, but the health metrics, item counts and the feed validator on this page are representative. The Validate step does not perform a live network check.</span>
      </div>
      <div className="page-head">
        <div>
          <div className="page-kicker">Admin</div>
          <h1 className="page-title">Sources</h1>
          <div className="page-sub">Official APH feed bundle plus any custom RSS feeds you've added. Each source is validated, classified and routed to modules.</div>
        </div>
        <div style={{display:"flex", gap:10}}>
          <button className="btn" title="Re-polls the live RSS feeds if the Live page poller is mounted" onClick={() => { if (typeof window.__refreshLiveFeeds === "function") { window.__refreshLiveFeeds(); toast("Live feeds re-polled"); } else { toast("Open the Live page to start the feed poller"); } }}><Icon name="refresh" size={13}/> Refresh all</button>
          <button className="btn primary" onClick={() => document.getElementById("new-feed-url")?.focus()}><Icon name="plus" size={13}/> Add feed</button>
        </div>
      </div>

      <div className="grid g-4" style={{marginBottom:18}}>
        <div className="panel stat"><div className="stat-label">Active feeds</div><div className="stat-value">{sourceCounts().total}</div><div className="stat-meta">Official APH feeds configured</div></div>
        <div className="panel stat"><div className="stat-label">Healthy</div><div className="stat-value" style={{fontSize:18, color:"var(--ink-3)"}}>—</div><div className="stat-meta">Available after live poll</div></div>
        <div className="panel stat"><div className="stat-label">Items ingested · today</div><div className="stat-value" style={{fontSize:18, color:"var(--ink-3)"}}>—</div><div className="stat-meta">Available after live poll</div></div>
        <div className="panel stat"><div className="stat-label">False positive rate</div><div className="stat-value" style={{fontSize:18, color:"var(--ink-3)"}}>—</div><div className="stat-meta">Available after 30 days' operation</div></div>
      </div>

      <div className="grid g-overview">
        <div className="panel">
          <div className="panel-head">
            <h2 className="panel-title">Official APH Feed Bundle</h2>
            <span className="panel-kicker">{sourceCounts().total} official feeds configured · click a row for detail</span>
          </div>
          <table className="ds">
            <thead><tr>
              <th>Source</th><th>Group</th><th>Status</th><th>Last</th>
              <th className="num">Today</th><th>FPR</th><th>Parser</th>
            </tr></thead>
            <tbody>
              {allFeeds.map(f => (
                <tr key={f.id} onClick={() => f.group !== "Custom" && openModal("feed", f.id)}>
                  <td>
                    <div style={{fontWeight:500}}>{f.name}</div>
                    <div className="mono" style={{fontSize:10.5, color:"var(--ink-4)"}}>{f.url.length > 56 ? f.url.slice(0,56)+"…" : f.url}</div>
                  </td>
                  <td><span className="tag">{f.group}</span></td>
                  <td>{f.lastStatusCode != null ? (f.lastStatusCode >= 200 && f.lastStatusCode < 300 ? "Live" : "Error") : "—"}</td>
                  <td className="mono" style={{fontSize:11.5, color:"var(--ink-3)"}}>{f.last || "—"}</td>

          </table>
        </div>

        <div>

              <span className="panel-kicker">6-step workflow</span>

            <div className="panel-body">

              <div className="g-feed-form" style={{marginTop:12, display:"grid", gap:10}}>
                <div>
                  <div className="mono t-label" style={{color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", marginBottom:4}}>Source type</div>
                  <select className="btn" aria-label="Source type" style={{width:"100%", padding:"7px 10px"}}>
                    <option>Parliamentary Library</option><option>Senate</option><option>House</option><option>Department</option><option>Ministerial</option><option>Regulator</option><option>News</option><option>Think tank</option><option>Industry</option>
                  </select>
                </div>
                <div>
                  <div className="mono t-label" style={{color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", marginBottom:4}}>Refresh cadence</div>
                  <select className="btn" aria-label="Refresh cadence" style={{width:"100%", padding:"7px 10px"}}>
                    <option>Hourly</option><option>Every 15 min</option><option>Daily</option>
                  </select>
                </div>
              </div>
              <div style={{marginTop:12}}>
                <div className="mono t-label" style={{color:"var(--ink-4)", textTransform:"uppercase", letterSpacing:".14em", marginBottom:6}}>Route to modules</div>
                <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                  {["Today's Signal","Committees","Bills","Parliament","Briefings","Emerging Issues","Watchlists","Search"].map(m => (
                    <label key={m} style={{display:"inline-flex", alignItems:"center", gap:6, padding:"4px 10px", border:"1px solid var(--line-2)", borderRadius:999, fontSize:12, cursor:"pointer"}}>
                      <input type="checkbox" defaultChecked={["Emerging Issues","Briefings"].includes(m)} style={{accentColor:"var(--brass)"}}/>
                      {m}
                    </label>
                  ))}
                </div>
              </div>

              {testState && (
                <div className="feed-test" style={{marginTop:14}}>
                  <div style={{marginBottom:6, letterSpacing:".1em", display:"flex", alignItems:"center", gap:7}} className="warn"><Icon name="flag" size={12} /> Parser: needs validation</div>
                  {testState.lines.map((l, i) => (
                    <div key={i} className={"feed-test-line " + l.t}>
                      <Icon name={l.t === "ok" ? "check" : l.t === "warn" ? "flag" : "close"} size={12} />
                      <span>{l.s}</span>

          </div>

          <div className="panel">
            <div className="panel-head">
              <h2 className="panel-title">Not yet connected</h2>
              <span className="panel-kicker">Needs parser or source</span>

          </div>
        </div>
      </div>
    </div>
  );
}

    return { type: v.type || "Executive Brief", for: label, status: "Copied · clipboard", _sid: sid, _ts: v.ts };

function PageSignals() {
  const { state, setVisibleSignalOrder, signalSearchQuery, setSignalSearchQuery } = useStore();
  const [filter, setFilter] = useState("all");
  const [sort, setSort] = useState("time");

  const visible = React.useMemo(() => {
    let sigs = SIGNALS.filter(s => !state.archived[s.id]);
    const query = (signalSearchQuery || "").trim().toLowerCase();
    if (query) sigs = sigs.filter(s =>
      s.title.toLowerCase().includes(query) ||
      s.summary.toLowerCase().includes(query) ||
      s.id.toLowerCase().includes(query) ||
      (s.tags || []).some(t => (t.l || "").toLowerCase().includes(query))
    );
    if (filter !== "all") sigs = sigs.filter(s => s.attention === filter);
    if (sort === "score") sigs = [...sigs].sort((a, b) => (b.score?.authority || 0) - (a.score?.authority || 0));
    return sigs;
  }, [state.archived, filter, sort, signalSearchQuery]);

  React.useEffect(() => {
    setVisibleSignalOrder(visible.map(s => s.id));
    return () => setVisibleSignalOrder(null);
  }, [visible, setVisibleSignalOrder]);

  const counts = React.useMemo(() => ({
    all: SIGNALS.filter(s => !state.archived[s.id]).length,
    high: SIGNALS.filter(s => s.attention === "high" && !state.archived[s.id]).length,
    med: SIGNALS.filter(s => s.attention === "med" && !state.archived[s.id]).length,
    low: SIGNALS.filter(s => s.attention === "low" && !state.archived[s.id]).length,
  }), [state.archived]);

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="page-kicker">Today</div>
          <h1 className="page-title">All signals</h1>
          <div className="page-sub">{counts.all} active signals · {counts.high} high · {counts.med} medium · {counts.low} low</div>
        </div>
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <label htmlFor="sig-sort" className="sr-only">Sort signals</label>
          <span aria-hidden="true" style={{fontSize:12, color:"var(--ink-4)"}}>Sort:</span>
          <select id="sig-sort" value={sort} onChange={e => setSort(e.target.value)}
            style={{background:"var(--panel)", border:"1px solid var(--line-2)", color:"var(--ink)", borderRadius:6, padding:"5px 8px", fontSize:12, cursor:"pointer"}}>
            <option value="time">Time</option>
            <option value="score">Authority score</option>
          </select>
        </div>
      </div>

      {signalSearchQuery && (
        <div className="empty-state" style={{marginBottom:14, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12}}>
          <span>Filtered by search: "{signalSearchQuery}"</span>
          <button className="btn sm ghost" onClick={() => setSignalSearchQuery("")}>Clear search</button>
        </div>
      )}

      <div role="group" aria-label="Filter signals by attention level" style={{display:"flex", gap:8, marginBottom:16, flexWrap:"wrap"}}>
        {[["all","All"], ["high","High"], ["med","Medium"], ["low","Low"]].map(([val, label]) => (
          <button key={val} className={"filter-chip" + (filter === val ? " active" : "")}
            aria-pressed={filter === val} onClick={() => setFilter(val)}>
            {label} <span style={{opacity:.65}}>({counts[val]})</span>
            {filter === val && <span className="sr-only"> (active filter)</span>}
          </button>
        ))}
      </div>

      {visible.length === 0 ? (
        <EmptyState icon="signal" kicker="No signals">
          {filter === "all" ? "No active signals - all archived." : `No ${filter} attention signals.`}
        </EmptyState>
      ) : (
        <div>
          {visible.map(s => <SignalCard key={s.id} s={s} />)}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { PageOverview, PageLive, PageSources, PageCommittees, PageBills, PageParliament, PagePatterns, PageBriefings, PageWatchlists, PageRadar, PageSignals, OnboardingGuide });

</script>

<script type="text/babel">
// App root — wires StoreProvider and all pages
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Parliament Pulse render error", error, info);
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="panel" role="alert" style={{margin:18, padding:18, borderColor:"var(--ember-flash)"}}>
        <div className="page-kicker">Render error</div>
        <h1 className="page-title" style={{fontSize:24, marginTop:6}}>Parliament Pulse could not render this view</h1>
        <p style={{color:"var(--ink-2)", maxWidth:640}}>Reload the page to reset the current browser state. If the problem repeats, capture the page and action that caused it.</p>
        <button className="btn primary" onClick={() => location.reload()}><Icon name="refresh" size={13}/> Reload</button>
      </div>
    );
  }
}

function App() {
  const [page, setPage] = React.useState("overview");
  const [mobileNavOpen, setMobileNavOpen] = React.useState(() => {
    try { return localStorage.getItem("pp-nav-open") === "true"; } catch { return false; }
  });
  const navigate = React.useCallback((nextPage) => {
    setPage(nextPage);
    setMobileNavOpen(false);
  }, []);
  React.useEffect(() => {
    try { localStorage.setItem("pp-nav-open", String(mobileNavOpen)); } catch { /* storage unavailable */ }
  }, [mobileNavOpen]);
  React.useEffect(() => {
    const saved = localStorage.getItem("pp-theme");
    if (saved) document.documentElement.dataset.theme = saved;
  }, []);

  const renderPage = () => {
    switch (page) {
      case "overview":   return <PageOverview />;
      case "live":       return <PageLive />;
      case "sources":    return <PageSources />;
      case "committees": return <PageCommittees />;
      case "bills":      return <PageBills />;
      case "parliament": return <PageParliament />;
      case "patterns":   return <PagePatterns />;
      case "briefings":  return <PageBriefings />;
      case "watchlists": return <PageWatchlists />;
      case "radar":      return <PageRadar />;
      case "signals":    return <PageSignals />;
      default:           return <PageOverview />;
    }
  };

  return (
    <StoreProvider navigate={navigate}>
      <div className="app">
        <div className={"drawer-back mobile-nav-back" + (mobileNavOpen ? " on" : "")} onClick={() => setMobileNavOpen(false)} aria-hidden="true" />
        <Sidebar page={page} onNavigate={navigate} mobileOpen={mobileNavOpen} />
        <div className="main">
          <Topbar mobileNavOpen={mobileNavOpen} setMobileNavOpen={setMobileNavOpen} />
          <DesignStateBanner />
          <div className="content"><ErrorBoundary>{renderPage()}</ErrorBoundary></div>
        </div>
        <ErrorBoundary><Drawer /></ErrorBoundary>
        <ErrorBoundary><DetailModal /></ErrorBoundary>
      </div>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode><App /></React.StrictMode>
);

</script>
</body>
</html>
