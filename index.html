  /* tokens:begin
     ============================================================
     Parliament Pulse tokens: register b (Fire House editorial-terminal),
     Parliament desk. Every colour literal in this block is a value from
     04_Templates/brand-tokens.json v2.6.4; tests/copy-gates.test.mjs checks
     each one against tests/brand-hex-allowlist.json (generated from that file
     by scripts/sync-brand-hex.mjs) and fails on any hex outside this block,
     #fff and #000 excepted. Everything else derives from these with
     color-mix(), so no other literal ships. FE-09 executes DS-018: the
     off-token oranges and the teal retire; the desk accent is
     accent.parliament and healthy or verified states use status.active.

     WCAG 2.x contrast, measured 29 Sep 2026 (sRGB relative luminance).
     Dark:  token            value     bg.primary  bg.panel  panel-2
            ink              #f5f0e1   17.66       16.75     15.92
            ink-3 (label)    #a0a4b4    8.11        7.69      7.31
            ink-4 (subtle)   #8a8e9e    6.17        5.86      5.57
            brass (parl.)    #b9712e    5.23        4.97      4.72
            brass-2 (policy) #c98a4e    6.92        6.57      6.24
            gold / link      #d9b779   10.54       10.00      9.50
            ember-flash      #e0534b    5.28        5.01      4.76
            escalate         #f87171    7.27        6.90      6.56
            caution          #d4a017    8.47        8.03      7.64
            info             #9aa6b0    8.10        7.68      7.30
            ok (active)      #4ade80   11.54       10.95     10.41
            control-edge     #626476    3.45        3.28      3.11  (non-text, 3:1)
            primary button: bg.primary on brass 5.23
     Light: ground paper.panel #F1ECE0, panel paper.base #F8F5EE, bg-2 panel-3 #ECE6D8
            ink.primary      #1B1812   15.02 on bg, 16.26 on panel
            ink.tertiary     #5C5547    6.26 / 6.78
            ink.quaternary   #6E6757    4.76 / 5.16 (4.51 on bg-2)
            ember.accent     #A23B1C    5.60 / 6.07
            ember.oxide      #7C2E18    7.88 / 8.53 (link)
            semantic warn    #8A5E14    4.83 / 5.22
            semantic neg     #B23A2A    5.04 / 5.46
            semantic pos     #1B5E40    6.55 / 7.09
            slate.rail       #4A515C    6.79 / 7.35
            control-edge = ink.quaternary (FE-10): 4.18 on the watchlist card, the lowest light surface (non-text, 3:1)
            primary button: paper.base on ember.accent 6.07
     ============================================================ */
  :root {
    /* brand-tokens.json literals (dark) */
    --t-bg-primary:   #06070d;
    --t-bg-panel-alt: #0a0c14;
    --t-bg-panel:     #0d0f1a;
    --t-bg-border:    #1c1e2a;
    --t-panel-2:      #111525;
    --t-edge:         #1c2030;
    --t-control-edge: #626476;
    --t-text-primary: #f5f0e1;
    --t-text-secondary: #d8d4c5;
    --t-text-label:   #a0a4b4;
    --t-text-subtle:  #8a8e9e;
    --t-parliament:   #b9712e;
    --t-policy:       #c98a4e;
    --t-market:       #d9b779;
    --t-geopolitics:  #9aa6b0;
    --t-oxide:        #7C2E18;
    --t-active:       #4ade80;
    --t-warm:         #d4a017;
    --t-risk:         #f87171;
    --t-flash:        #e0534b;
    /* brand-tokens.json literals (light paper, and the brief preview) */
    --t-paper-base:   #F8F5EE;
    --t-paper-panel:  #F1ECE0;
    --t-paper-panel-3: #ECE6D8;
    --t-paper-hair:   #D7CFBE;
    --t-paper-rule:   #B7AF9C;
    --t-ink-primary:  #1B1812;
    --t-ink-secondary: #433E35;
    --t-ink-tertiary: #5C5547;
    --t-ink-quaternary: #6E6757;
    --t-ember-accent: #A23B1C;
    --t-light-warn:   #8A5E14;
    --t-light-neg:    #B23A2A;
    --t-light-pos:    #1B5E40;
    --t-slate-rail:   #4A515C;

    /* Surfaces */
    --bg:           var(--t-bg-primary);
    --bg-2:         var(--t-bg-panel-alt);
    --panel:        var(--t-bg-panel);
    --panel-2:      var(--t-panel-2);
    --panel-hi:     color-mix(in srgb, var(--t-bg-border) 45%, transparent);
    --line:         color-mix(in srgb, #fff 5%, transparent);
    --line-2:       color-mix(in srgb, #fff 9%, transparent);
    --line-bright:  color-mix(in srgb, #fff 16%, transparent);
    --control-edge: var(--t-control-edge);

    /* Ink ramp (warm cream, never pure white) */
    --ink:          var(--t-text-primary);
    --ink-2:        var(--t-text-secondary);
    --ink-3:        var(--t-text-label);
    --ink-4:        var(--t-text-subtle);

    /* Desk accent: accent.parliament. Sanctioned uses (DESIGN-2): brand mark and
       active-nav rule, the single primary action per surface, focus and
       selection, live and high-priority accents, the topbar scanline. */
    --brass:        var(--t-parliament);
    --brass-2:      var(--t-policy);
    --brass-soft:   color-mix(in srgb, var(--t-parliament) 30%, transparent);
    --brass-ink:    var(--t-bg-primary);
    --gold:         var(--t-market);
    --ember-flash:  var(--t-flash);
    --link:         var(--t-market);

    /* Status: status.active for healthy and verified, warm for caution, risk and
       flash for degraded and breaking, geopolitics steel-ash for information. */
    --ok:           var(--t-active);
    --teal:         var(--ok);   /* legacy name: verified and healthy states only */
    --teal-soft:    color-mix(in srgb, var(--ok) 45%, var(--bg));
    --info:         var(--t-geopolitics);
    --caution:      var(--t-warm);
    --escalate:     var(--t-risk);
    --att-high:     var(--t-risk);
    /* Live state (UX-16): a neutral outline that follows real freshness. */
    --live-state:   var(--ok);

    --side-start:   var(--bg-2);
    --side-end:     var(--bg);
    --topbar-bg:    color-mix(in srgb, var(--bg-2) 80%, transparent);
    --scrim:        color-mix(in srgb, #000 63%, transparent);
    --scrim-strong: color-mix(in srgb, #000 69%, transparent);
    --overlay-shadow: color-mix(in srgb, #000 50%, transparent);
    --search-shadow: color-mix(in srgb, #000 63%, transparent);
    --brand-core:   color-mix(in srgb, var(--brass) 8%, var(--bg));
    --brand-glow:   color-mix(in srgb, var(--brass) 25%, var(--bg));
    --accent-ring:  color-mix(in srgb, var(--brass) 20%, transparent);
    --accent-glow:  color-mix(in srgb, var(--brass) 33%, transparent);
    --topbar-underglow: color-mix(in srgb, var(--brass) 10%, transparent);
    --rule-1:       color-mix(in srgb, #fff 8%, transparent);
    --rule-2:       color-mix(in srgb, #fff 3%, transparent);
    --gap-section:  28px;
    --gap-intra:    8px;
    --signal-high-bg: linear-gradient(160deg, color-mix(in srgb, var(--ember-flash) 7%, var(--panel)) 0%, var(--panel) 100%);
    --ember-wash:   color-mix(in srgb, var(--brass) 7%, var(--bg));
    --hover-surface: color-mix(in srgb, #fff 2%, transparent);
    --active-surface: color-mix(in srgb, #fff 5%, transparent);
    --soft-surface: color-mix(in srgb, #fff 1%, transparent);
    --scroll-thumb: color-mix(in srgb, var(--control-edge) 70%, transparent);
    --toast-err-bg: color-mix(in srgb, var(--escalate) 8%, var(--panel));

    /* Brief preview: light paper in both themes (ppl-press literals). */
    --brief-bg:     var(--t-paper-base);
    --brief-ink:    var(--t-ink-primary);
    --brief-accent: var(--t-light-warn);
    --brief-link:   var(--t-oxide);

    /* Native form controls, scrollbars and inputs follow the app theme. */
    color-scheme: dark;

    --r-sm: 4px;
    --r:    6px;     /* register.b.radius.control */
    --r-md: 10px;    /* register.b.radius.panel */
    --r-lg: 14px;
    --r-pill: 999px; /* register.b.radius.pill */

    --shadow: 0 1px 0 color-mix(in srgb, #000 38%, transparent), 0 20px 50px -28px color-mix(in srgb, #000 56%, transparent);

    /* Elevation: three named tiers (resident / floating / modal) */
    --elev-1: inset 0 1px 0 color-mix(in srgb, #fff 3%, transparent);
    --elev-2: 0 20px 50px -28px color-mix(in srgb, #000 56%, transparent), 0 1px 0 color-mix(in srgb, #000 38%, transparent);
    --elev-3: 0 50px 100px var(--scrim-strong), inset 0 0 0 1px color-mix(in srgb, #fff 3%, transparent);

    --sans: "IBM Plex Sans", "IBM Plex Sans Fallback", system-ui, sans-serif;
    --serif: "IBM Plex Serif", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    /* Type scale (brand-tokens type.size). FE-10 (A11Y-other:10px-text): the
       screen floor is 12px, so eyebrow, label and micro all sit at the caption
       size; they stay distinct through mono, uppercase and letter-spacing. The
       print stylesheet keeps its own pt sizes. */
    --t-display:  56px;
    --t-masthead: clamp(24px, 2.2vw + 16px, 30px);
    --t-headline: 23px;
    --t-subhead:  18px;
    --t-body:     15px;
    --t-body-sm:  13px;
    --t-caption:  12px;
    --t-eyebrow:  12px;
    --t-stat:     28px;
    --t-kpi:      48px;
    --t-label:    12px;
    --t-micro:    12px;
    --lh-tight:   1.25;
    --lh-body:    1.5;

    /* Spacing (brand-tokens spacing, plus the 20 and 28 steps the grid uses). */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --sp-7: 28px;
    --sp-8: 32px;

    /* Motion tokens: Fire House tier model */
    --ease-functional: cubic-bezier(0.2,0,0,1);
    --ease-entrance:   cubic-bezier(0.22,1,0.36,1);
    --ease-textural:   cubic-bezier(0.34,1.56,0.64,1);
    --dur-micro: 120ms;
    --dur:       200ms;
    --dur-page:  280ms;
  }

  :root[data-theme="light"] {
    /* Warm paper light theme: the ppl-press paper and ink literals. */
    color-scheme: light;
    --bg:       var(--t-paper-panel);
    --bg-2:     var(--t-paper-panel-3);
    --panel:    var(--t-paper-base);
    --panel-2:  var(--t-paper-panel);
    --panel-hi: color-mix(in srgb, var(--t-ink-primary) 4%, transparent);
    --ink:      var(--t-ink-primary);
    --ink-2:    var(--t-ink-secondary);
    --ink-3:    var(--t-ink-tertiary);
    --ink-4:    var(--t-ink-quaternary);
    --line:     color-mix(in srgb, var(--t-ink-primary) 11%, transparent);
    --line-2:   color-mix(in srgb, var(--t-ink-primary) 7%, transparent);
    --line-bright: color-mix(in srgb, var(--t-ink-primary) 18%, transparent);
    --control-edge: var(--t-ink-quaternary);  /* FE-10: 4.18:1 or better on every light surface (paper.rule was 2.00:1) */
    --shadow:   0 1px 0 color-mix(in srgb, var(--t-ink-primary) 5%, transparent), 0 12px 36px -20px color-mix(in srgb, var(--t-ink-primary) 20%, transparent);
    --brass:    var(--t-ember-accent);
    --brass-2:  var(--t-oxide);
    --brass-soft: color-mix(in srgb, var(--t-ember-accent) 22%, transparent);
    --brass-ink: var(--t-paper-base);
    --gold:     var(--t-light-warn);
    --link:     var(--t-oxide);
    --ember-flash: var(--t-light-neg);
    --ok:       var(--t-light-pos);
    --escalate: var(--t-light-neg);
    --att-high: var(--t-light-neg);
    --caution:  var(--t-light-warn);
    --info:     var(--t-slate-rail);
    --side-start: var(--t-paper-panel-3);
    --side-end: var(--t-paper-panel-3);
    --topbar-bg: color-mix(in srgb, var(--t-paper-panel) 90%, transparent);
    --scrim: color-mix(in srgb, var(--t-ink-primary) 36%, transparent);
    --scrim-strong: color-mix(in srgb, var(--t-ink-primary) 46%, transparent);
    --overlay-shadow: color-mix(in srgb, var(--t-ink-primary) 22%, transparent);
    --search-shadow: color-mix(in srgb, var(--t-ink-primary) 16%, transparent);
    --brand-core: color-mix(in srgb, var(--brass) 10%, var(--panel));
    --brand-glow: color-mix(in srgb, var(--brass) 6%, var(--panel));
    --accent-ring: color-mix(in srgb, var(--brass) 22%, transparent);
    --accent-glow: color-mix(in srgb, var(--brass) 24%, transparent);
    --topbar-underglow: color-mix(in srgb, var(--brass) 14%, transparent);
    --ember-wash: color-mix(in srgb, var(--brass) 6%, var(--panel));
    --hover-surface: color-mix(in srgb, var(--t-ink-primary) 5%, transparent);
    --active-surface: color-mix(in srgb, var(--t-ink-primary) 7%, transparent);
    --soft-surface: color-mix(in srgb, var(--t-ink-primary) 3%, transparent);
    --scroll-thumb: var(--t-paper-rule);
    --toast-err-bg: color-mix(in srgb, var(--escalate) 6%, var(--panel));
  }
  /* tokens:end */
  /* Light theme structural overrides — hardcoded dark values in base CSS */
  [data-theme="light"] body {
    background: var(--bg);
  }
  [data-theme="light"] .signal {
    background: var(--panel);
  }
  [data-theme="light"] .drawer {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
  }
  [data-theme="light"] .pattern {
    background: linear-gradient(180deg, var(--panel), var(--ember-wash));
  }
  [data-theme="light"] .nav-item .count {
    background: var(--active-surface);
  }
  /* Active nav count: a darker brown on light paper so the badge clears AA
     (the shared brass over a translucent-orange fill measured 3.98:1). */
  [data-theme="light"] .nav-item.active .count { color: var(--brass-2); background: color-mix(in srgb, var(--brass) 12%, transparent); }
  [data-theme="light"] table.ds th {
    background: var(--soft-surface);
    color: var(--ink-3);  /* FE-10: 5.61:1 (ink-4 was 4.26:1 on the tinted head) */
  }
  [data-theme="light"] .panel-section-title { color: var(--ink-3); }  /* FE-10: 5.72:1 (ink-4 was 4.35:1) */
  [data-theme="light"] .coverage-labels { color: var(--ink-3); }  /* FE-10: ink-4 was 4.18:1 on the tinted head */
  [data-theme="light"] table.ds tbody tr:hover {
    background: var(--soft-surface);
  }
  [data-theme="light"] .wl {
    background: var(--soft-surface);
  }
  [data-theme="light"] .toast {
    background: var(--panel);
    border-color: var(--line-bright);
    box-shadow: 0 4px 20px var(--search-shadow);
  }
  [data-theme="light"] .toast.toast-err {
    background: var(--toast-err-bg);
    border-color: color-mix(in srgb, var(--ember-flash) 27%, transparent);
  }
  [data-theme="light"] .clk:hover {
    background: var(--hover-surface);
  }
  [data-theme="light"] .live-strip {
    background: linear-gradient(90deg, var(--ember-wash) 0%, var(--bg) 60%, var(--bg) 100%);
  }
  [data-theme="light"] ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); }
  [data-theme="light"] .nav-item.active {
    background: var(--active-surface);
  }
  [data-theme="light"] .sr-item:focus-within {
    background: var(--active-surface);
  }
  /* High-attention signal card: base rule hardcodes a dark gradient; warm-paper override (design bug). */
  [data-theme="light"] .signal[data-att="high"] {
    background: linear-gradient(160deg, color-mix(in srgb, var(--ember-flash) 7%, var(--panel)) 0%, var(--panel) 100%);
  }

  * { box-sizing: border-box; }
  /* Icons never squash to a dot inside a flex row (FE-09: empty states, evidence rows, thread rows). */
  svg[aria-hidden="true"] { flex-shrink: 0; }
  html, body { margin:0; padding:0; }
  body {
    background:
      radial-gradient(1600px 900px at 8% -8%, var(--ember-wash) 0%, transparent 55%),
      radial-gradient(1100px 760px at 96% 112%, var(--ember-wash) 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--t-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: 0.005em;
  }

  .mono { font-family: var(--mono); font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .serif { font-family: var(--serif); }
  .t-kpi { font-size: var(--t-kpi); line-height: 1; }
  .t-stat { font-size: var(--t-stat); line-height: 1; }
  .t-body { font-size: var(--t-body-sm); line-height: 1.5; }
  .t-label { font-size: var(--t-label); letter-spacing: .18em; text-transform: uppercase; }
  .list-row, .data-row { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
  .list-row:last-child, .data-row:last-child { border-bottom: 0; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 256px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .side {
    background: var(--side-start);   /* flat ink slab — premium UIs do not gradient chrome */
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);   /* iOS home-indicator clearance (docs/design-scale-uplift-spec.md 3.6.3) */
  }
  .brand {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 6px;
    background: var(--brand-core);
    border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-family: var(--serif); font-weight: 600; font-size: var(--t-subhead); letter-spacing: -0.01em; }
  .brand-sub  { font-family: var(--mono); color: var(--ink-4); font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .18em; margin-top: 2px; }

  .nav {
    padding: 10px 8px;
    overflow-y: auto;
    flex: 1;
  }
  .nav-group {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; text-transform: uppercase;
    letter-spacing: .18em; color: var(--ink-4);
    padding: 14px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 6px;
    color: var(--ink-2); cursor: pointer;
    font-size: var(--t-body-sm);
    user-select: none;
    position: relative;
  }
  .nav-item:hover { background: var(--hover-surface); color: var(--ink); }
  .nav-item.active {
    background: var(--active-surface);  /* ember left-border carries selection */
    color: var(--ink);
  }
  .nav-item.active::before{
    content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    background: var(--brass); border-radius: 0 2px 2px 0;
    box-shadow: 0 0 10px -2px var(--brass);
  }
  .nav-item .ico { width:16px; height:16px; opacity:.85; flex:none; }
  .nav-item .count {
    margin-left: auto; font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-3);
    background: var(--active-surface); padding: 1px 6px; border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .nav-item.active .count { color: var(--brass-2); background: color-mix(in srgb, var(--brass) 12%, transparent); }  /* FE-10: 5.31:1 (brass was 4.02:1) */
  /* UX-16: neutral live-state outline that follows real freshness, never a permanent red badge. */
  .nav-item .count.nav-live, .nav-item.active .count.nav-live { color: var(--live-state); background: transparent; border: 1px solid color-mix(in srgb, var(--live-state) 45%, transparent); font-weight: 500; }
  .nav-item .count.nav-live[data-live-state="stale"] { --live-state: var(--caution); }
  .nav-item .count.nav-live[data-live-state="offline"] { --live-state: var(--ink-4); }

  .side-foot {
    border-top: 1px solid var(--line);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .side-status {
    margin: 10px 10px 12px;
    padding: 12px;
    border: 1px solid color-mix(in srgb, var(--brass) 28%, var(--line-2));
    border-radius: 8px;
    background:
      radial-gradient(180px 80px at 0% 0%, color-mix(in srgb, var(--brass) 8%, transparent), transparent),
      var(--panel-hi);
    font-size: var(--t-caption);
    color: var(--ink-3);
    line-height: 1.45;
  }
  .side-status-head {
    display:flex; align-items:center; gap:7px;
    color: var(--ok);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .side-status .mono { margin-top: 6px; font-size: var(--t-micro); color: var(--ink-4); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brass-soft), var(--brass));
    display: grid; place-items: center;
    font-family: var(--mono); font-size: var(--t-eyebrow); color: var(--brass-ink); font-weight: 600;
  }

  /* ---------- Top bar ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 -1px 0 var(--topbar-underglow);
    background: var(--topbar-bg);
    position: sticky; top: 0; z-index: 20;
  }
  .search {
    flex: 1; max-width: 620px;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 8px 10px;
    transition: border-color var(--dur) var(--ease-functional), box-shadow var(--dur) var(--ease-functional);
  }
  .search:focus-within {
    border-color: var(--brass);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 13%, transparent);
  }
  /* The topbar search keeps a usable width: next to the no-wrap poll line it
     shrank to 54 px at 1280 ("Search s"). Its input stays at least 200 px wide,
     and below 1360 px the poll line takes its own row (media rule below). */
  .topbar .search { min-width: 320px; }
  .search input {
    background: transparent; border: 0; outline: 0;
    color: var(--ink); font-family: var(--sans); font-size: var(--t-body-sm); width: 100%;
  }
  /* Topbar command-bar live clock + status cluster */
  .top-clock {
    font-family: var(--mono); font-size: var(--t-caption); color: var(--ink-2);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .kbd {
    font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-3);
    padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 4px;
    background: var(--soft-surface);
  }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn.nav-toggle { display: none; flex: none; }
  .mobile-nav-back { display: none; }
  .chip {
    font-family: var(--mono); font-size: var(--t-label); line-height: 1.2; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 9px; border-radius: var(--r-pill);
    border: 1px solid var(--line-2); color: var(--ink-3); background: var(--soft-surface);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 13%, transparent); }
  .chip.warn .dot { background: var(--caution); box-shadow: 0 0 0 3px color-mix(in srgb, var(--caution) 13%, transparent);}
  .chip.bad .dot { background: var(--escalate); box-shadow: 0 0 0 3px color-mix(in srgb, var(--escalate) 13%, transparent);}
  .btn {
    font-family: var(--sans); font-size: var(--t-body-sm);
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    min-height: 32px;
    border: 1px solid var(--control-edge); background: var(--panel); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--dur-micro) var(--ease-functional), color var(--dur-micro) var(--ease-functional);
  }
  .btn:hover { background: var(--panel-2); color: var(--ink); }
  /* A disabled control reads as unavailable (FE-09). */
  .btn:disabled, .btn:disabled:hover { opacity: .45; cursor: not-allowed; background: var(--panel); color: var(--ink-3); }
  .btn.primary {
    background: linear-gradient(180deg, var(--brass-2), var(--brass));
    color: var(--brass-ink); border: 1px solid color-mix(in srgb, var(--brass) 80%, #000);
    font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--brass) 40%, transparent), 0 0 14px -4px var(--brass-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { border-color: var(--line-2); }
  .btn.sm { padding: 4px 9px; font-size: var(--t-caption); min-height: 28px; }

  /* Coarse pointer (touch): WCAG 2.2 target-size 44px (40px for compact). */
  @media (pointer: coarse) {
    .btn { min-height: 44px; }
    .btn.sm { min-height: 40px; }
  }

  /* Native select: token-driven, mirrors the inline PageSignals style so it can be swept. */
  .select {
    background: var(--panel); border: 1px solid var(--line-2); color: var(--ink);
    border-radius: 6px; padding: 5px 8px; font-size: var(--t-caption); cursor: pointer;
  }

  /* Skip link: visually hidden until keyboard focus, then a panel pill top-left. */
  .skip-link {
    position: fixed; top: 12px; left: 12px; z-index: 80;
    transform: translateY(-200%);
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-bright); border-radius: var(--r);
    padding: 10px 16px; font-family: var(--sans); font-size: var(--t-body-sm);
    box-shadow: var(--elev-2);
    transition: transform var(--dur) var(--ease-functional);
  }
  .skip-link:focus, .skip-link:focus-visible {
    transform: translateY(0); outline: 2px solid var(--brass); outline-offset: 2px;
  }

  /* Horizontal table scroll: phone widths scroll the table inside its panel, never the page. */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table.ds { min-width: 560px; }

  /* Manual-refresh spinner: 800ms linear while a refetch is in flight (reduced-motion halts it). */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 800ms linear infinite; }

  /* ---------- Content ---------- */
  .content {
    padding: 20px;
    max-width: 1500px;
    width: 100%;
  }
  /* Persistent APH licence attribution (LEG-03). Kept visible in print too. */
  .site-foot {
    margin-top: auto;
    padding: 14px 20px 18px;
    max-width: 1500px;
    border-top: 1px solid var(--line);
    font-size: var(--t-caption); line-height: 1.5;
    color: var(--ink-3);
  }
  .site-foot p { margin: 0; max-width: 820px; }
  .site-foot a { color: var(--link); }
  /* FE-08 (LEG-13): legal, privacy and licence links on every desk. */
  .site-foot-links { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: 6px; }
  .site-foot-links a { display: inline-block; padding: 4px 0; min-height: 24px; }
  .page-title:focus { outline: none; }
  .page-title:focus-visible { outline: 1px solid var(--accent-glow); outline-offset: 6px; border-radius: 2px; width: fit-content; }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px; gap: 24px;
  }
  .page-title {
    font-family: var(--serif); font-weight: 600; font-size: var(--t-masthead); letter-spacing: -.012em; margin: 0;
  }
  .page-kicker {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 6px;
  }
  .page-sub { color: var(--ink-3); font-size: var(--t-body-sm); margin-top: 6px; max-width: 620px; }

  /* ---------- Command-strip hero ---------- */
  .command-strip {
    display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--gap-intra); align-items: stretch;
    margin-bottom: var(--gap-section);
  }
  .cs-primary .unit, .cs-secondary .unit { font-family: var(--mono); font-size: var(--t-body-sm); color: var(--ink-3); margin-left: 8px; font-weight: 400; }
  .cs-primary {
    background:
      radial-gradient(420px 140px at 0% 0%, color-mix(in srgb, var(--brass) 8%, transparent), transparent),
      linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--line-2);
    border-left: 3px solid var(--brass);
    border-radius: var(--r);
    box-shadow: var(--elev-1);
    padding: 18px 20px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .cs-primary .cs-kpi {
    font-family: var(--sans); font-weight: 600; font-size: var(--t-kpi); line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .cs-primary .cs-kpi .unit { font-family: var(--mono); font-size: var(--t-body-sm); color: var(--ink-3); margin-left: 8px; font-weight: 400; }
  .cs-secondary {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--rule-1); border-radius: var(--r);
    padding: 16px; display: flex; flex-direction: column; justify-content: center;
  }
  .cs-secondary .cs-stat {
    font-family: var(--sans); font-weight: 600; font-size: var(--t-stat); line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .cs-secondary .cs-stat-label {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; margin-bottom: 8px;
  }
  /* KPI count-up flourish on first paint (600ms decel); static under reduced-motion */
  .cs-count-up { animation: csCountUp 600ms var(--ease-functional) both; }

  .beta-ledger {
    margin: -2px 0 var(--gap-section);
    border: 1px solid var(--rule-1);
    border-radius: var(--r);
    background:
      radial-gradient(640px 180px at 0% 0%, color-mix(in srgb, var(--brass) 6%, transparent), transparent 70%),
      linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    box-shadow: var(--elev-1);
    overflow: hidden;
  }
  .beta-ledger-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule-1);
  }
  .beta-ledger-head h2 {
    margin: 5px 0 0;
    font-family: var(--serif);
    font-size: var(--t-subhead);
    line-height: 1.2;
    letter-spacing: -.006em;
    color: var(--ink);
  }
  .beta-ledger-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .beta-ledger-row {
    appearance: none;
    border: 0;
    border-right: 1px solid var(--rule-1);
    background: transparent;
    color: var(--ink-2);
    text-align: left;
    padding: 14px 16px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 122px 1fr;
    gap: 10px 12px;
    min-height: 132px;
  }
  .beta-ledger-row:last-child { border-right: 0; }
  .beta-ledger-row:hover { background: color-mix(in srgb, #fff 2%, transparent); }
  .beta-ledger-row strong { display: block; color: var(--ink); font-size: var(--t-body-sm); margin-bottom: 5px; }
  .beta-ledger-row span span { display: block; font-size: var(--t-body-sm); line-height: 1.5; color: var(--ink-3); }
  .beta-state {
    align-self: start;
    width: fit-content;
    font-family: var(--mono);
    font-size: var(--t-label);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .16em;
    text-transform: uppercase;
    padding: 4px 7px;
    border-radius: 4px;
    border: 1px solid var(--line-2);
  }
  .beta-live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
  .beta-representative { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); background: color-mix(in srgb, var(--gold) 8%, transparent); }
  .beta-next { color: var(--brass-2); border-color: color-mix(in srgb, var(--brass) 45%, transparent); background: color-mix(in srgb, var(--brass) 8%, transparent); }  /* FE-10: 5.74:1 dark (brass was 4.33:1) */
  .beta-action {
    grid-column: 2;
    align-self: end;
    font-family: var(--mono);
    font-size: var(--t-label);
    color: var(--brass);
    letter-spacing: .05em;
  }

  .provenance-stack {
    margin: 0 0 var(--gap-section);
    border: 1px solid var(--rule-1);
    border-radius: var(--r);
    background:
      linear-gradient(90deg, var(--ember-wash) 0%, transparent 16%),
      linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .provenance-head {
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule-1);
  }
  .provenance-head h2 {
    margin: 5px 0 0;
    font-family: var(--serif);
    font-size: var(--t-subhead);
    line-height: 1.2;
    color: var(--ink);
  }
  .provenance-steps {
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .provenance-step {
    position: relative;
    padding: 14px 14px 16px;
    border-right: 1px solid var(--rule-1);
    display:grid;
    grid-template-columns: 42px 1fr;
    gap: 10px;
    min-height: 154px;
  }
  .provenance-step:last-child { border-right: 0; }
  .provenance-step::after {
    content:"";
    position:absolute;
    left:56px; right:14px; top:33px;
    height:1px;
    background: linear-gradient(90deg, var(--brass), transparent);
    opacity:.35;
  }
  .prov-index {
    position: relative;
    z-index: 1;
    width:34px; height:34px;
    display:grid; place-items:center;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent);
    color: var(--brass);
    font-family: var(--mono);
    font-size: var(--t-micro);
    font-weight: 700;
    background: var(--panel);
  }
  .prov-label {
    font-family: var(--mono);
    font-size: var(--t-micro);
    font-weight: 700;
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: .16em;
    margin: 2px 0 7px;
  }
  .provenance-step strong { display:block; color:var(--ink); font-size:var(--t-body-sm); line-height:1.25; }
  .provenance-step p { margin:7px 0 12px; color:var(--ink-3); font-size:var(--t-caption); line-height:1.5; }
  .provenance-step .beta-state { grid-column: 2; align-self: end; }

  .provenance-metrics {
    margin: 0 0 var(--gap-section);
    border: 1px solid color-mix(in srgb, var(--brass) 34%, var(--rule-1));
    border-radius: var(--r);
    background:
      linear-gradient(90deg, var(--ember-wash) 0%, transparent 26%),
      linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    padding: 13px 16px 15px;
  }
  .prov-metric-grid {
    display:grid;
    grid-template-columns: repeat(var(--prov-cols, 4), minmax(0, 1fr));
    gap: 12px;
    margin-top: 11px;
  }
  .prov-metric {
    border: 0;
    background: transparent;
    color: var(--ink-2);
    display:grid;
    grid-template-columns: 26px auto;
    grid-template-areas:
      "icon value"
      "icon label"
      "icon detail";
    align-items:center;
    gap: 1px 10px;
    padding: 4px 0;
    text-align:left;
    cursor:pointer;
  }
  .prov-metric + .prov-metric { border-left: 1px solid var(--rule-1); padding-left: 18px; }
  .prov-metric svg { grid-area: icon; color: var(--brass); }
  .prov-metric strong { grid-area: value; color: var(--ink); font-size: var(--t-subhead); line-height: 1; font-variant-numeric: tabular-nums; }
  .prov-metric span { grid-area: label; color: var(--ink); font-size: var(--t-body-sm); font-weight: 600; margin-top: 3px; }
  .prov-metric small { grid-area: detail; color: var(--ink-4); font-size: var(--t-eyebrow); line-height: 1.35; }

  .coverage-matrix {
    margin: 0 0 var(--gap-section);
    border: 1px solid var(--rule-1);
    border-radius: var(--r);
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .coverage-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--rule-1);
  }
  .coverage-head h2 {
    margin: 5px 0 0;
    font-family: var(--sans);
    font-size: var(--t-body);
    line-height: 1.3;
    color: var(--ink);
  }
  .coverage-grid { display: grid; }
  .coverage-row {
    display: grid;
    grid-template-columns: minmax(130px, .8fr) 118px minmax(180px, 1.1fr) minmax(220px, 1.25fr) auto;
    gap: 12px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule-1);
    font-size: var(--t-body-sm);
    color: var(--ink-3);
  }
  .coverage-row:last-child { border-bottom: 0; }
  .coverage-row strong { color: var(--ink); font-size: var(--t-body-sm); }
  .coverage-labels {
    font-family: var(--mono);
    font-size: var(--t-label);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-4);
    background: var(--panel-hi);
  }
  .coverage-state {
    width: fit-content;
    font-family: var(--mono);
    font-size: var(--t-label);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .12em;
    text-transform: uppercase;
    border: 1px solid var(--line-2);
    border-radius: 4px;
    padding: 4px 7px;
    color: var(--ink-2);
  }
  .coverage-state.state-live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .coverage-state.state-partial-live, .coverage-state.state-local-beta, .coverage-state.state-in-this-browser { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 45%, transparent); background: color-mix(in srgb, var(--brass) 8%, transparent); }
  .coverage-state.state-derived { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 45%, transparent); background: color-mix(in srgb, var(--teal) 8%, transparent); }
  .coverage-state.state-unavailable { color: var(--ink-3); border-color: var(--line-2); background: transparent; }
  .coverage-state.state-representative { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); background: color-mix(in srgb, var(--gold) 8%, transparent); }
  @keyframes csCountUp { from { opacity: 0; } to { opacity: 1; } }  /* opacity-only — no first-paint layout shift (PERF-7) */

  .grid { display: grid; gap: 14px; }
  .g-2 { grid-template-columns: repeat(2, 1fr); align-items: start; }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-overview { grid-template-columns: 2.4fr 1fr; align-items: start; }
  /* FE-07 (UX-05): grid items default to min-width:auto, so one wide table
     widened the whole page. min-width:0 lets each column shrink to its track and
     a wide table scrolls inside its own .table-scroll instead. */
  .g-overview > *, .g-briefings > *, .g-live-main > * { min-width: 0; }
  .g-onboarding { grid-template-columns: repeat(3,1fr); }
  .g-live-strip { grid-template-columns: auto 1fr auto auto auto; }
  .g-brief-row, .g-tracked-row, .g-threshold-row { grid-template-columns: 1fr auto; }
  .g-source-row { grid-template-columns: 1fr auto auto; }
  .g-live-main { grid-template-columns: 1.7fr 1fr; }
  .g-link-grid, .g-feed-form { grid-template-columns: 1fr 1fr; }
  .g-live-event { grid-template-columns: 56px 16px 1fr; }
  .g-qon-evidence { grid-template-columns: 130px 200px 1fr 90px; }
  .g-briefings { grid-template-columns: 280px 1fr; }
  .radar-row.g-radar-table { grid-template-columns: 1fr 100px 80px 120px 140px; }

  /* ---------- Panel — two-step elevation ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--rule-1);
    border-radius: var(--r);
    box-shadow: var(--elev-1);   /* resident-panel tier: tonal lift */
  }
  .panel-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule-1);
  }
  .panel-title { font-weight: 600; font-size: var(--t-body); margin: 0; color: var(--ink); letter-spacing: .005em; }
  .h-drawer { font-family: var(--serif); font-size: var(--t-headline); font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  .panel-kicker { font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 500; color: var(--ink-3); letter-spacing: .02em; }
  .panel-body { padding: 14px 16px; }
  .panel-foot { padding: 10px 16px; border-top: 1px solid var(--line); display:flex; align-items:center; gap:10px; }
  /* one cohesive rail: sections inside a single panel, hairline-separated */
  .panel-section { padding: 16px; border-bottom: 1px solid var(--rule-1); }
  .panel-section:last-child { border-bottom: 0; }
  .panel-section-head { display:flex; align-items:baseline; gap:10px; margin-bottom: 12px; }
  .panel-section-title { font-family: var(--mono); font-size: var(--t-label); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-4); margin: 0; font-weight: 600; }

  /* ---------- Stat block ---------- */
  .stat {
    padding: 16px;
  }
  .stat-label { font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4); text-transform: uppercase; letter-spacing: .18em; }
  .stat-value { font-family: var(--sans); font-size: var(--t-kpi); font-weight: 600; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat-value .unit { font-size: var(--t-body-sm); color: var(--ink-3); margin-left: 6px; font-family: var(--mono); }
  .stat-meta { margin-top: 6px; font-size: var(--t-caption); color: var(--ink-3); display:flex; align-items:center; gap: 8px; }
  /* optional trend slot — ember up, steel-ash down */
  .stat-trend.up { color: var(--brass); }
  .stat-trend.down { color: var(--info); }

  /* ---------- Signal Card ---------- */
  .signal {
    border: 1px solid var(--line-bright);
    border-radius: var(--r-lg);
    background: linear-gradient(160deg, var(--panel-2) 0%, var(--panel) 100%);
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
    content-visibility: auto;           /* skip layout for off-screen cards at scale */
    contain-intrinsic-size: auto 150px;
  }
  .signal:hover { border-color: var(--line-bright); box-shadow: 0 6px 24px -10px color-mix(in srgb, #000 56%, transparent), 0 0 0 1px color-mix(in srgb, #fff 7%, transparent) inset; }
  .signal + .signal { margin-top: 10px; }

  /* The date never wraps inside itself ("16 / Sep"); the head wraps instead, so a
     long label such as "Date not supplied" drops to its own line at 390 px. */
  .sig-head { display:flex; flex-wrap: wrap; align-items:center; gap:4px 10px; margin-bottom: 6px; }
  .sig-id { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4); letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  .sig-source { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-3); }
  .sig-time { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .sig-title {
    font-family: var(--serif); font-size: var(--t-subhead); font-weight: 600; line-height: 1.3;
    color: var(--ink); margin: 2px 0 6px;
  }
  .sig-sum { color: var(--ink-2); font-size: var(--t-body-sm); }

  .sig-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-family: var(--mono); font-size: var(--t-label);
    padding: 3px 8px; border-radius: 4px;
    background: var(--hover-surface); border: 1px solid var(--line-2); color: var(--ink-3);
    text-transform: none;
  }
  .tag.brass { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 20%, transparent); background: color-mix(in srgb, var(--brass) 6%, transparent); }
  .tag.teal  { color: var(--teal);  border-color: color-mix(in srgb, var(--teal) 20%, transparent); background: color-mix(in srgb, var(--teal) 6%, transparent); }
  .tag.amber { color: var(--caution); border-color: color-mix(in srgb, var(--caution) 20%, transparent); background: color-mix(in srgb, var(--caution) 6%, transparent); }
  .tag.red   { color: var(--escalate); border-color: color-mix(in srgb, var(--escalate) 20%, transparent); background: color-mix(in srgb, var(--escalate) 6%, transparent); }
  .tag.info  { color: var(--info); border-color: color-mix(in srgb, var(--info) 20%, transparent); background: color-mix(in srgb, var(--info) 6%, transparent); }

  .sig-action {
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--rule-2);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 14px; align-items: center;
  }
  .sig-action-label {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em;
  }
  .sig-action-value { font-size: var(--t-body-sm); color: var(--ink); font-weight: 500; }
  /* FE-10: the confidence label wraps rather than slide under the Open button on phones. */
  .sig-action [data-conf] { white-space: normal !important; min-width: 0; }
  .sig-action-reason { grid-column: 1 / -1; color: var(--ink-3); font-size: var(--t-body-sm); font-style: italic; }

  /* attention pill — fire-to-ash ramp */
  .att {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; text-transform: uppercase; letter-spacing: .18em;
    padding: 3px 8px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .att::before { content:""; width:6px; height:6px; border-radius:50%; }
  .att.high { color: var(--att-high); background: color-mix(in srgb, var(--ember-flash) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ember-flash) 25%, transparent); }
  .att.high::before { background: var(--att-high); }
  .att.med { color: var(--caution); background: color-mix(in srgb, var(--caution) 10%, transparent); border: 1px solid color-mix(in srgb, var(--caution) 25%, transparent); }
  .att.med::before { background: var(--caution); }
  .att.low { color: var(--info); background: color-mix(in srgb, var(--info) 10%, transparent); border: 1px solid color-mix(in srgb, var(--info) 25%, transparent); }
  .att.low::before { background: var(--info); }
  /* Light theme: --att-high is semantic-light.neg on paper (5.04:1 on bg, A11Y-9). */
  /* FE-10: over the high card's ember wash the neg text measured 4.16:1; ember.oxide is 6.50:1 there. The dot keeps the neg hue. */
  [data-theme="light"] .att.high { color: var(--t-oxide); background: color-mix(in srgb, var(--att-high) 10%, transparent); border-color: color-mix(in srgb, var(--att-high) 30%, transparent); }
  [data-theme="light"] .att.high::before { background: var(--att-high); }
  /* FE-10: semantic warn measured 4.02:1 on a tinted table row; 80% warn with ink.primary is 5.12:1 there and 6.65:1 on paper. The dot keeps the warn hue. */
  [data-theme="light"] .att.med { color: color-mix(in srgb, var(--t-light-warn) 80%, var(--t-ink-primary)); }

  /* confidence bar — 5-segment ember-to-gold gradient */
  .conf {
    display: inline-flex; align-items: center; gap: 2px;
  }
  .conf span { width: 6px; height: 11px; background: var(--line-2); border-radius: 1px; }
  /* single sovereign accent at stepped opacity reads quantitatively without a 5-hue ramp */
  .conf span.on { background: var(--brass); }
  .conf span.on:nth-child(1) { opacity: .45; }
  .conf span.on:nth-child(2) { opacity: .6; }
  .conf span.on:nth-child(3) { opacity: .75; }
  .conf span.on:nth-child(4) { opacity: .9; }
  .conf span.on:nth-child(5) { opacity: 1; }

  /* ---------- Table ---------- */
  table.ds { width: 100%; border-collapse: collapse; font-size: var(--t-body-sm); font-variant-numeric: tabular-nums; }
  table.ds th, table.ds td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  table.ds th {
    font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4);
    text-transform: uppercase; letter-spacing: .18em; font-weight: 600;
    background: var(--soft-surface); position: sticky; top: 0;
    box-shadow: inset 0 -1px 0 var(--rule-1);
  }
  table.ds tbody tr { cursor: pointer; }
  table.ds tbody tr:hover { background: var(--soft-surface); }
  table.ds td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* FE-07 (UX-05): a long unbroken feed URL wraps instead of widening its table. */
  .ds-url { overflow-wrap: anywhere; }
  table.ds td.ds-lead { overflow-wrap: anywhere; min-width: 12rem; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before {
    content:""; position:absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line-2);
  }
  .tl-item { position: relative; padding: 4px 0 12px; }
  .tl-item::before {
    content:""; position:absolute; left: -18px; top: 8px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--brass);
  }
  .tl-item.teal::before { border-color: var(--teal); }
  .tl-item.info::before { border-color: var(--info); }
  .tl-time { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4); text-transform: uppercase; letter-spacing: .14em; }
  .tl-body { color: var(--ink-2); font-size: var(--t-body-sm); margin-top: 2px; }

  /* ---------- Drawer ---------- */
  .drawer-back {
    position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 40;
  }
  .drawer-back.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 580px; max-width: 95vw;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border-left: 1px solid var(--line-2);
    transform: translateX(100%);
    visibility: hidden;  /* FE-10: out of the accessibility tree and focus order while closed */
    transition: transform var(--dur-page) var(--ease-entrance), visibility 0s linear var(--dur-page);
    z-index: 50; display: flex; flex-direction: column;
    box-shadow: none;
  }
  .drawer.on { visibility: visible; transition: transform var(--dur-page) var(--ease-entrance), visibility 0s; }
  /* The shadow only while open: a closed drawer cast it over the right edge of every light-theme page. */
  .drawer.on { transform: translateX(0); box-shadow: -20px 0 60px var(--overlay-shadow); }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .drawer-head > div:first-child { min-width: 0; flex: 1 1 auto; }
  .drawer-head .h-drawer { overflow-wrap: anywhere; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; background: var(--bg); }

  .drawer-section { margin-bottom: 26px; }
  .drawer-section h3 {
    font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 500; color: var(--ink-3);
    letter-spacing: .04em; margin: 0 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--rule-2);
  }
  .drawer-section p { margin: 0; color: var(--ink-2); font-size: var(--t-body-sm); line-height: 1.55; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; font-size: var(--t-body-sm); }
  .kv dt { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4); text-transform: uppercase; letter-spacing: .1em; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--ink); }

  .feedback-row { display: flex; flex-wrap: wrap; gap: 6px; }
  /* Unselected, "Correct priority" is an ordinary chip with a green tick, so it
     never reads as already chosen (FE-09); selected, it fills. */
  .fb.affirmative svg { stroke: var(--ok); }
  .fb {
    font-family: var(--sans); font-size: var(--t-caption);
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--soft-surface); color: var(--ink-2);
    transition: background .1s, border-color .1s, color .1s;
  }
  .fb:hover { background: var(--hover-surface); color: var(--ink); }
  .fb.on { background: color-mix(in srgb, var(--brass) 8%, transparent); border-color: color-mix(in srgb, var(--brass) 33%, transparent); color: var(--brass); animation: fbSelect 180ms ease-out; }
  .fb.affirmative.on {
    background: var(--ok);
    border-color: var(--ok);
    color: var(--bg);
  }
  .fb.affirmative.on svg { stroke: var(--bg); }
  @keyframes fbSelect { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.06); } }

  /* ---------- Radar ---------- */
  .radar-row { display: grid; grid-template-columns: 1fr 80px 100px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .radar-row:last-child { border-bottom: 0; }
  .radar-mlabel { display: none; color: var(--ink-4); }
  .bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--brass); }  /* priority/score metric — ember, not teal (teal is verification-only) */
  .spark { display: flex; gap: 2px; align-items: end; height: 22px; }
  .spark span { width: 5px; background: var(--teal-soft); border-radius: 1px; }

  /* ---------- Pattern card ---------- */
  .pattern {
    border: 1px solid color-mix(in srgb, var(--brass) 27%, transparent);
    background:
      radial-gradient(400px 120px at 0% 0%, color-mix(in srgb, var(--brass) 8%, transparent), transparent),
      linear-gradient(180deg, var(--panel-2), var(--panel));
    border-radius: var(--r-lg);
    padding: 16px 18px;
    position: relative;
  }
  .pattern .ribbon {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: var(--t-micro); font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--brass); background: color-mix(in srgb, var(--brass) 8%, transparent); border: 1px solid color-mix(in srgb, var(--brass) 33%, transparent);
    padding: 3px 8px; border-radius: 4px;
  }

  /* ---------- Watchlist chip ---------- */
  .wl {
    border: 1px solid var(--line-2); border-radius: var(--r-md);
    padding: 12px 14px; background: var(--soft-surface);
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer;
  }
  .wl:hover { border-color: var(--line-bright); }
  .wl-name { font-weight: 500; font-size: var(--t-body-sm); }
  .wl-meta { font-size: var(--t-caption); color: var(--ink-3); display:flex; gap: 10px; font-family: var(--mono); }

  /* Progress ring placeholder */
  .ring {
    width: 40px; height: 40px; border-radius: 50%;
    background: conic-gradient(var(--brass) calc(var(--p,70)*1%), var(--line-2) 0);
    display: grid; place-items: center;
  }
  .ring::after {
    content: attr(data-p)"%"; color: var(--ink);
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel); display: grid; place-items: center;
    font-family: var(--mono); font-size: var(--t-micro);
  }

  /* ---------- Brief preview — warm paper, gold accent ---------- */
  /* --brief-* are defined in the token block. */
  .brief {
    background: var(--brief-bg); color: var(--brief-ink);
    border-radius: var(--r-md); padding: 18px 20px;
    font-family: var(--serif); font-size: var(--t-body-sm); line-height: 1.55;
    overflow-wrap: anywhere;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, #000 8%, transparent);
  }
  .brief h5 { margin: 12px 0 4px; font-family: var(--mono); font-size: var(--t-eyebrow); font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--brief-accent); }
  .brief h3 { margin: 0 0 4px; font-family: var(--serif); font-size: var(--t-subhead); font-weight: 600; }
  .brief .meta { font-family: var(--mono); font-size: var(--t-label); color: var(--brief-accent); }
  .brief ul { margin: 4px 0 0; padding-left: 18px; }
  .brief-attrib { margin-top: 14px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--brief-ink) 15%, transparent); font-family: var(--sans); font-size: var(--t-caption); line-height: 1.45; color: var(--brief-accent); }

  .linklike {
    appearance: none; background: none; border: 0; padding: 0;
    color: inherit; font: inherit; text-decoration: underline; cursor: pointer;
  }
  .linklike:hover { color: var(--link); }

  /* FE-10 (A11Y-01): former mouse-only tags, chips and names are real buttons.
     These reset the native button so each keeps its old look, and give it a
     24 x 24 CSS px minimum target (WCAG 2.5.8). */
  /* A standalone text link gets a 24 px tall hit area without moving the layout:
     the padding grows the target and the equal negative margin cancels it. Links
     with a class or an inline display set their own box and are sized below. */
  a[href]:not([class]):not([style*="display"]), a.sr-title { padding-block: 4px; margin-block: -4px; }
  .src-badge { min-height: 24px; }
  .search input { min-height: 24px; }
  button.tag, button.chip, button.row-btn, button.sig-open, button.sr-open {
    font: inherit; font-family: var(--mono); cursor: pointer; margin: 0; text-align: left;
    min-height: 24px; min-width: 24px;
  }
  button.tag { font-size: var(--t-label); line-height: 1.2; display: inline-flex; align-items: center; }
  button.chip { font-size: var(--t-label); background: transparent; }
  button.row-btn {
    appearance: none; background: none; border: 0; padding: 2px 0; color: inherit;
    font-family: var(--sans); font-weight: 500; display: block; width: 100%;
  }
  button.row-btn:hover { color: var(--link); text-decoration: underline; }
  button.row-btn:disabled { cursor: default; }
  button.row-btn:disabled:hover { color: inherit; text-decoration: none; }

  /* A11Y-02: a signal card is an article. Its Open button stretches over the
     whole card (::after), so a click anywhere still opens the drawer, while the
     title's source link sits above that layer and stays its own target. */
  .signal { cursor: default; }
  button.sig-open {
    appearance: none; border: 1px solid var(--control-edge); background: var(--panel);
    color: var(--ink-2); font-family: var(--sans); font-size: var(--t-caption);
    padding: 3px 12px; border-radius: 6px; flex: none; grid-column: -2 / -1; justify-self: end;
  }
  button.sig-open::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); cursor: pointer; }
  button.sig-open:hover { color: var(--ink); background: var(--panel-2); }
  .signal .sig-title a, .signal .sig-tags, .signal button:not(.sig-open) { position: relative; z-index: 1; }
  .signal:focus-within { border-color: var(--line-bright); }

  /* source health dot */
  .hdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align: middle; }
  .hdot.live { background: var(--ok); }
  .hdot.delayed { background: var(--caution); transform: rotate(45deg); border-radius: 1px; }  /* diamond — shape redundancy for deuteranopia */
  .hdot.broken { background: var(--escalate); border-radius: 2px; }  /* square — distinct from live circle */
  .hdot.stale  { background: var(--ink-4); }
  .hdot.review { background: var(--info); }

  /* inline SVG icons */
  .ico { display: inline-block; vertical-align: middle; }

  /* Fade page switches */
  .page { animation: fadeIn var(--dur-page) var(--ease-entrance) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }  /* opacity-only — page switches no longer shift content (PERF-7) */

  /* Skeleton shimmer — loading state */
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position:  200% center; }
  }
  .skeleton {
    display: block;
    background: linear-gradient(90deg, var(--panel) 0%, var(--line-2) 40%, color-mix(in srgb, #fff 13%, transparent) 50%, var(--line-2) 60%, var(--panel) 100%);
    background-size: 200% 100%;
    animation: shimmer 2.4s linear infinite;  /* slower + linear — less frenetic */
    border-radius: 4px;
  }

  /* Focus-visible ring — keyboard accessibility */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
  .search input:focus-visible { outline: none; }

  /* Signal card attention-level left border — status spine */
  .signal[data-att="high"] { border-left: 4px solid var(--ember-flash); background: var(--signal-high-bg); }
  .signal[data-att="med"]  { border-left: 4px solid var(--caution); }
  .signal[data-att="low"]  { border-left: 4px solid var(--info); }

  /* Signal card hover lift — reduced, ember-tinted shadow */
  .signal { transition: border-color var(--dur-micro) var(--ease-functional), box-shadow var(--dur-micro) var(--ease-functional), transform var(--dur-micro) var(--ease-functional); }
  .signal:hover { box-shadow: 0 6px 22px -8px var(--accent-ring), 0 4px 18px -10px var(--search-shadow); transform: translateY(-1px); }

  /* Modal-ish tester */
  .feed-test {
    background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r-md);
    padding: 14px; font-family: var(--mono); font-size: var(--t-caption); color: var(--ink-2);
  }
  .feed-test-line { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .feed-test .ok { color: var(--ok); }
  .feed-test .warn { color: var(--caution); }
  .feed-test .err { color: var(--escalate); }

  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

  .empty { color: var(--ink-4); font-style: italic; font-size: var(--t-body-sm); padding: 12px 0; }
  .empty-state {
    display: flex; align-items: center; gap: var(--sp-3);
    color: var(--ink-3); padding: var(--sp-5) 0;
  }
  .empty-state.error {
    padding: var(--sp-4);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    background: var(--panel-hi);
    align-items: flex-start;
  }
  .empty-kicker {
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600;
    color: var(--ink-4); letter-spacing: .18em; text-transform: uppercase;
  }
  .empty-body { font-size: var(--t-body-sm); color: var(--ink-2); margin-top: 2px; }
  .empty-action { margin-left: auto; }

  /* Responsive ish */
  @media (max-width: 1360px) {
    .top-right { flex-wrap: wrap; justify-content: flex-end; row-gap: 4px; }
    .top-right .top-poll { order: 10; flex-basis: 100%; text-align: right; }
  }
  @media (max-width: 1100px) {
    /* FE-07 (reflow): between 781 and 1100 px the sidebar stays open and the
       topbar's status chips and actions no longer fit one line; they wrap under
       the search instead of widening the page (measured 1,024 px wide at 800). */
    .topbar { flex-wrap: wrap; row-gap: 8px; }
    .top-right { flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
    .page-head { flex-wrap: wrap; }
    .page-head > div:last-child { flex-wrap: wrap; }
    .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .live-strip.g-live-strip { display: flex !important; flex-wrap: wrap; }
    .wl-name { overflow-wrap: anywhere; }
    .g-4 { grid-template-columns: repeat(2, 1fr); }
    .g-overview { grid-template-columns: 1fr; }
    .beta-ledger-grid { grid-template-columns: 1fr; }
    .beta-ledger-row { border-right: 0; border-bottom: 1px solid var(--rule-1); min-height: 0; }
    .beta-ledger-row:last-child { border-bottom: 0; }
    .provenance-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .provenance-step:nth-child(2n) { border-right: 0; }
    .provenance-step:nth-child(-n+2) { border-bottom: 1px solid var(--rule-1); }
    .prov-metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .prov-metric + .prov-metric { border-left: 0; padding-left: 0; }
    .coverage-row { grid-template-columns: minmax(120px, .9fr) 116px minmax(160px, 1fr); }
    .coverage-row > span:nth-child(4), .coverage-row > button { grid-column: 3; }
    .coverage-labels > span:nth-child(4), .coverage-labels > span:nth-child(5) { grid-column: 3; }
  }
  @media (max-width: 900px) {
    .chip.sources-chip, .shortcut-btn { display: none !important; }
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px 10px;
      padding: 8px 12px;
    }
    .btn.nav-toggle { display: inline-flex; }
    .mobile-nav-back { display: block; }
    .side {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(82vw, 320px);
      height: 100vh;
      z-index: 50;
      transform: translateX(-104%);
      visibility: hidden;  /* FE-10 (A11Y-03): zero focus stops while closed */
      transition: transform var(--dur-page) var(--ease-entrance), visibility 0s linear var(--dur-page);
      box-shadow: 20px 0 60px var(--overlay-shadow);
    }
    .side.mobile-open { transform: translateX(0); visibility: visible; transition: transform var(--dur-page) var(--ease-entrance), visibility 0s; }
    .side .nav { display: block; overflow-y: auto; padding: 10px 8px; }
    .side .nav-group { display: block; }
    .side .nav-item { white-space: normal; min-height: 40px; }
    .side-foot { display: flex; }
    .g-2, .g-3 { grid-template-columns: 1fr; }
    /* Collapse every multi-column grid to one column. */
    .command-strip, .live-strip { grid-template-columns: 1fr; }
    .content .grid { grid-template-columns: 1fr !important; }
    .page-head { flex-direction: column; align-items: stretch; gap: 12px; }
    /* FE-07: panel headers wrap their actions on phones instead of overflowing. */
    .panel-head { flex-wrap: wrap; row-gap: 8px; }
    .live-head-actions { justify-content: flex-start; }
    .page-head > div:last-child { justify-content: flex-start !important; }
    .g-onboarding, .g-live-strip, .g-brief-row, .g-tracked-row, .g-threshold-row,
    .g-source-row, .g-live-main, .g-link-grid, .g-feed-form,
    .g-qon-evidence, .g-briefings { grid-template-columns: 1fr !important; }
    /* FE-09: a live item keeps its time beside the title on a phone; the kind icon drops. */
    .g-live-event { grid-template-columns: 44px minmax(0, 1fr) !important; }
    .g-live-event > :nth-child(2) { display: none; }
    .radar-row { grid-template-columns: 1fr !important; gap: 4px !important; }
    /* FE-06: on phones the Activity-by-source header row hides and each value carries its own label. */
    .radar-head { display: none !important; }
    .radar-row .radar-num { text-align: left !important; }
    .radar-mlabel { display: inline !important; }
    /* Mobile triage focus: lead with the priority hero + signals; defer secondary KPIs and the context rail. */
    .command-strip .cs-secondary { display: none; }
    /* Only the Overview defers its context rail. Sources and Daily program reuse
       .g-overview, and on a phone this rule used to hide their second column:
       the Add feed form, Reference pages and Recent divisions (FE-09). */
    .page-overview .g-overview > div:last-child { display: none; }
    /* FE-07 (UX-13): the first signal card starts inside the first 700 px on a
       phone. The Overview stacks as a flex column so the source strip follows
       the signals, and the priority hero is compacted. */
    .page-overview { display: flex; flex-direction: column; }
    .page-overview > .page-head { margin-bottom: 14px; }
    .page-overview > .live-strip { order: 1; margin: var(--gap-section) 0 0 !important; }
    .page-overview > .about-data-line { order: 2; }
    .page-overview .command-strip { margin-bottom: 14px; }
    .page-overview .cs-primary { padding: 12px 14px; }
    .page-overview .cs-primary .cs-kpi { font-size: var(--t-kpi); }
    /* Overlays go full width on phones (UX-3/UX-5). */
    .drawer { width: 100% !important; max-width: 100% !important; }
    .modal { max-width: 100% !important; }
    .modal-back { padding: 12px !important; }
    .chip.live-chip { display: none !important; }
    .search, .topbar .search { max-width: none; min-width: 0; width: 100%; padding: 7px 8px; }
    .search input { font-size: var(--t-caption); min-width: 0; }
    .search .kbd { display: none; }
    .top-clock { display: none !important; }
    .top-right { grid-column: 1 / -1; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
    /* FE-10: the 12 px text floor widened the letter-spaced mono labels, so on
       phones their tracking tightens to keep the old line count. */
    .page-kicker, .sig-action-label { letter-spacing: .08em; }
    .chip { letter-spacing: .04em; padding: 4px 8px; }
    .topbar .search .search-results { min-width: 0; }
    .beta-ledger-head { flex-direction: column; gap: 8px; }
    .beta-ledger-row { grid-template-columns: 1fr; }
    .beta-action { grid-column: 1; }
    .provenance-head { flex-direction: column; gap: 8px; }
    .provenance-steps { grid-template-columns: 1fr; }
    .provenance-step { border-right: 0; border-bottom: 1px solid var(--rule-1); min-height: 0; }
    .provenance-step:last-child { border-bottom: 0; }
    .prov-metric-grid { grid-template-columns: 1fr; }
    .prov-metric { border-bottom: 1px solid var(--rule-1); padding-bottom: 10px; }
    .prov-metric:last-child { border-bottom: 0; padding-bottom: 0; }
    .coverage-head { flex-direction: column; gap: 8px; }
    .coverage-labels { display: none; }
    .coverage-row {
      grid-template-columns: 1fr;
      gap: 7px;
      align-items: start;
    }
    .coverage-row > span:nth-child(4), .coverage-row > button { grid-column: 1; }
  }

  /* FE-07 (UX-15): at 640 px and below a .ds-stack table reads as one card per
     row; every cell shows its column name from data-label, the lead cell spans
     the card. The header row stays in the accessibility tree, visually hidden. */
  @media (max-width: 640px) {
    .table-scroll table.ds.ds-stack { min-width: 0; }
    table.ds.ds-stack, table.ds.ds-stack tbody, table.ds.ds-stack tr { display: block; width: 100%; }
    table.ds.ds-stack thead {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
    table.ds.ds-stack tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    table.ds.ds-stack td {
      display: grid; grid-template-columns: minmax(6.5rem, 36%) minmax(0, 1fr); gap: 10px; align-items: baseline;
      padding: 3px 0; border-bottom: 0; text-align: left; min-width: 0; overflow-wrap: anywhere;
    }
    table.ds.ds-stack td::before {
      content: attr(data-label);
      font-family: var(--mono); font-size: var(--t-micro); color: var(--ink-4);
      text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
    }
    table.ds.ds-stack td > * { justify-self: start; }
    table.ds.ds-stack td.ds-lead { display: block; padding-bottom: 6px; }
    table.ds.ds-stack td.ds-lead::before { content: none; }
  }

  /* FE final (mobile polish at 390 px): the topbar controls hold one row, so the
     theme toggle no longer drops to a row of its own. On a phone the topbar
     drops two things another surface already carries: the Alerts button (it
     repeats the Priority signals count) and the feed count in the Live chip
     (Sources lists every feed). The poll line keeps its own full-width row
     below the controls, so a stalled poll still says so on every desk. A
     signal card's confidence reads on one line under the triage label, with
     Open beside both. */
  @media (max-width: 640px) {
    .top-right .tb-alerts, .top-right .tb-feeds { display: none; }
    .top-right .top-poll { order: 10; flex-basis: 100%; text-align: right; }
    .sig-action { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
    .sig-action > .sig-action-label, .sig-action > .sig-action-value, .sig-action > [data-conf] { grid-column: 1; }
    .sig-action > [data-conf] { white-space: nowrap !important; }
    .sig-action > .sig-open { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  }
  @media (max-width: 360px) {
    .top-right .tb-new-brief .tb-label { display: none; }
  }

  /* ---- Modal ---- */
  .modal-back {
    position: fixed; inset: 0; background: var(--scrim-strong); backdrop-filter: blur(3px);
    z-index: 60; display: grid; place-items: center; padding: 40px;
    animation: fadeIn .18s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .modal-scrim { position: absolute; inset: 0; }
  .modal-back > .modal { position: relative; z-index: 1; }
  .modal {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line-2); border-radius: var(--r-lg);
    width: 100%; max-width: 860px; max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--elev-3);
  }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display:flex; align-items:flex-start; gap:14px; }
  .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  .modal-foot { padding: 12px 22px; border-top: 1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; background: var(--bg); }

  /* ---- Live video ---- */
  .live-wrap {
    position: relative; border-radius: var(--r-md);
    border: 1px solid var(--line-2);
  }
  .live-wrap.live-embed { overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  .live-wrap iframe { position: absolute; inset: 0; width:100%; height:100%; border:0; display:block; }
  /* FE-07 (UX-07): the pre-load card sits in normal flow with at least a 16:9
     footprint, so its heading and buttons wrap instead of clipping at 320 px. */
  .live-wrap.live-card {
    aspect-ratio: 16 / 9; overflow: visible;   /* min-height stays auto: the box grows past 16:9 to fit its content */
    background: linear-gradient(180deg, var(--panel-2), var(--bg));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; gap: 12px;
  }
  .live-card-head { display: flex; align-items: center; gap: 8px; max-width: 100%; }
  .live-card-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); }
  .live-card-title { font-family: var(--serif); font-size: var(--t-headline); font-weight: 600; color: var(--ink); margin: 0; overflow-wrap: anywhere; }
  .live-card-body { color: var(--ink-2); font-size: var(--t-body-sm); max-width: 460px; line-height: 1.5; margin: 0; }
  .live-card-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .live-head-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .live-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: var(--mono); font-size: var(--t-label); font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 4px; color: #fff;
    background: var(--ember-flash); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember-flash) 25%, transparent);
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* ember LIVE pulse — the one Prometheus flourish */
  .live-badge .pulse { width:6px; height:6px; border-radius:50%; background:#fff; animation: emberPulse 1.6s ease-in-out infinite; }
  @keyframes emberPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .src-badge {
    font-family: var(--mono); font-size: var(--t-label); color: var(--ink-3);
    display:inline-flex; align-items:center; gap:5px;
    padding: 2px 7px; border: 1px solid var(--line-2); border-radius: 4px;
    background: color-mix(in srgb, #fff 1%, transparent);
  }

  /* clickable chip */
  .clk { cursor: pointer; transition: background .12s, border-color .12s; }
  .clk:hover { background: color-mix(in srgb, #fff 3%, transparent); border-color: var(--line-bright); }

  /* Live now strip — ember-lit, static spine (no perpetual pulse; one pulse per viewport lives in the topbar) */
  .live-strip {
    background: linear-gradient(90deg, var(--ember-wash) 0%, var(--panel) 40%, var(--panel) 100%);
    border: 1px solid var(--line-2);
    border-left: 3px solid var(--ember-flash);
    border-radius: var(--r-md);
  }

  /* Toast */
  .toast-wrap { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 70; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line-bright);
    color: var(--ink); padding: 10px 14px; border-radius: var(--r);
    font-size: var(--t-body-sm); box-shadow: var(--elev-2);
    animation: toastIn .2s cubic-bezier(0.25,0.46,0.45,0.94);
    display: inline-flex; align-items: center; gap: 8px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .toast .tok { color: var(--ok); }
  .toast .tbr { color: var(--brass); }
  .toast.toast-err { border-color: color-mix(in srgb, var(--escalate) 33%, transparent); background: var(--toast-err-bg); }
  .toast-act { background: none; border: 1px solid var(--line-bright); color: var(--brass); border-radius: 5px; padding: 3px 9px; font-size: var(--t-caption); cursor: pointer; font-family: var(--sans); margin-left: 6px; }
  .toast-act:hover { background: color-mix(in srgb, var(--brass) 10%, transparent); }

  /* Global search results */
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-md);
    box-shadow: var(--elev-2); z-index: 30;
    max-height: 420px; overflow-y: auto;
  }
  .sr-group { font-family: var(--mono); font-size: var(--t-label); font-weight: 600; color: var(--ink-4); text-transform: uppercase; letter-spacing: .18em; padding: 10px 14px 4px; }
  .sr-list { list-style: none; margin: 0; padding: 0; }
  .sr-item { padding: 6px 14px; border-top: 1px solid var(--line); font-size: var(--t-body-sm); display:flex; gap:10px; align-items:center; }
  .sr-item:hover, .sr-item:focus-within { background: color-mix(in srgb, #fff 4%, transparent); }
  .sr-item .k { font-family: var(--mono); font-size: var(--t-label); color: var(--ink-4); flex: 0 1 auto; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-item .sr-title { min-width: 0; flex: 1 1 0; overflow-wrap: anywhere; }
  /* The results panel is never narrower than a readable row, even when the
     topbar squeezes the search field (FE-10: rows now hold a link and a button). */
  .search-results { min-width: min(460px, calc(100vw - 24px)); }
  button.sr-open {
    appearance: none; background: none; border: 0; color: inherit; font-family: var(--sans);
    font-size: var(--t-body-sm); padding: 4px 0; display: flex; gap: 10px; align-items: center; flex: 1 1 auto; min-width: 0;
  }
  button.sr-open.sr-open-short { flex: none; border: 1px solid var(--control-edge); border-radius: 6px; padding: 2px 10px; font-size: var(--t-caption); color: var(--ink-2); }
  button.sr-open:hover { color: var(--ink); }
  .search { position: relative; }

  /* Active press states — tactile confirmation */
  .btn:active { transform: translateY(1px); filter: brightness(0.93); }
  .btn.primary:active { transform: translateY(1px); filter: brightness(0.9); }
  .nav-item:active { background: color-mix(in srgb, #fff 6%, transparent); }
  .signal:active { transform: translateY(1px); box-shadow: 0 1px 8px -4px color-mix(in srgb, #000 38%, transparent); }
  .wl:active { background: color-mix(in srgb, #fff 2%, transparent); transform: translateY(1px); }
  .clk:active { background: color-mix(in srgb, #fff 2%, transparent); }

  /* Unified filter chip — replaces inline styles in PageSignals */
  .filter-chip {
    font-family: var(--mono); font-size: var(--t-eyebrow); padding: 4px 12px;
    border-radius: 20px; border: 1px solid var(--line-2);
    background: transparent; color: var(--ink-3); cursor: pointer;
    transition: background .12s, border-color .12s, color .08s;
  }
  .filter-chip:hover { background: color-mix(in srgb, #fff 2%, transparent); color: var(--ink-2); }
  .filter-chip.active { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 10%, transparent); color: var(--brass-2); }  /* FE-10: 5.95:1 dark (brass was 4.49:1) */
  .filter-chip:active { transform: translateY(1px); }

  /* Notice ribbon: the former stack of notice/onboarding bars collapses into
     this one slim, single-line, dismissible ribbon. Any adjacent notices merge
     into one continuous ribbon (no doubled rule, no chunky stacking). */
  .design-banner {
    display:flex; align-items:center; gap:10px; padding:6px 20px;
    min-height:30px; box-sizing:border-box;   /* reserve space so render/dismiss does not shift layout (PERF-7) */
    background: color-mix(in srgb, var(--brass) 8%, transparent);
    border-bottom:1px solid color-mix(in srgb, var(--brass) 22%, transparent);
    font-size:var(--t-body-sm); line-height:1.3; color:var(--ink-2);
  }
  .design-banner > span { min-width:0; }   /* the message flexes within the ribbon */
  .design-banner strong { font-weight:600; color:var(--ink); }
  .design-banner + .design-banner { border-top:0; }   /* stacked notices become one ribbon */
  .design-banner button { margin-left:auto; flex:none; background:none; border:none; color:var(--ink-4); cursor:pointer; font-size:var(--t-body); line-height:1; padding:0 4px; }
  .design-banner button:hover { color:var(--ink); }

  /* Fixture / Representative-data chip on signal cards */
  /* Representative/Fixture marker — deliberately neutral so the honesty layer informs without competing with the ember accent (DESIGN-2). */
  .chip-fixture { font-family:var(--mono); font-size:var(--t-micro); font-weight:600; line-height:1.2; color:var(--ink-3); background:var(--panel-hi); border:1px solid var(--line-2); padding:4px 6px; border-radius:3px; letter-spacing:.18em; text-transform:uppercase; }

  /* Provenance chip modifiers (state-v1 contract: live | derived | fixture).
     .chip-fixture on its own is the "fixture" treatment; these recolour it
     without duplicating its shape. */
  .chip-fixture.chip-live { color:var(--brass); border-color:color-mix(in srgb, var(--brass) 45%, transparent); background:color-mix(in srgb, var(--brass) 8%, transparent); }
  .chip-fixture.chip-derived { color:var(--ink-4); }
  /* A failing feed: sentence case, so a full clause stays readable. */
  .chip-fixture.chip-caution { color:var(--caution); border-color:color-mix(in srgb, var(--caution) 45%, transparent); text-transform:none; letter-spacing:.02em; line-height:1.35; }
  [data-theme="light"] .chip-fixture.chip-derived { color:var(--info); }  /* FE-10: 6.30:1 (ink-4 was 4.41:1) */

  /* prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* scrollbar */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }   /* Firefox */
  [data-theme="light"] * { scrollbar-color: var(--scroll-thumb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Print (PR-13) ----------
     A generated brief and the Briefings desk print as black ink on white
     paper: the app chrome, controls and overlays drop out, every external
     source link prints its address after the link text, and the APH licence
     attribution (the site footer and the line inside each brief) stays on the
     page. Only #fff and #000 are used here, so print needs no extra token. */
  @media print {
    @page { margin: 16mm 14mm; }
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fff; --bg-2: #fff; --panel: #fff; --panel-2: #fff; --panel-hi: transparent;
      --ink: #000;
      --ink-2: color-mix(in srgb, #000 85%, #fff);
